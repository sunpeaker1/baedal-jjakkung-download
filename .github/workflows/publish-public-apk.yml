name: Publish Public APK

on:
  push:
    branches: [ main ]
    paths:
      - 'release-manifest/*.json'
      - '.github/workflows/publish-public-apk.yml'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Manifest file name under release-manifest, or all'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public download repository
        uses: actions/checkout@v4

      - name: Check source token
        shell: bash
        env:
          APP_SOURCE_READ_TOKEN: ${{ secrets.APP_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$APP_SOURCE_READ_TOKEN" ]; then
            echo "APP_SOURCE_READ_TOKEN repository secret is required."
            exit 1
          fi

      - name: Publish fixed latest APK assets
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.APP_SOURCE_READ_TOKEN }}
          DEST_TOKEN: ${{ github.token }}
          MANIFEST_INPUT: ${{ github.event.inputs.manifest || 'all' }}
        run: |
          set -euo pipefail

          if [ "$MANIFEST_INPUT" = "all" ]; then
            mapfile -t MANIFESTS < <(find release-manifest -maxdepth 1 -type f -name '*.json' | sort)
          else
            MANIFESTS=("release-manifest/$MANIFEST_INPUT")
          fi

          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No release manifests found."
            exit 0
          fi

          for manifest in "${MANIFESTS[@]}"; do
            test -f "$manifest"

            app_name=$(jq -r '.name' "$manifest")
            version=$(jq -r '.version' "$manifest")
            source_repo=$(jq -r '.sourceRepo' "$manifest")
            source_type=$(jq -r '.sourceType' "$manifest")
            release_tag=$(jq -r '.publicReleaseTag' "$manifest")
            public_asset=$(jq -r '.publicAssetName' "$manifest")

            workdir=$(mktemp -d)
            source_apk="$workdir/source.apk"
            public_apk="$workdir/$public_asset"

            if [ "$source_type" = "release" ]; then
              source_tag=$(jq -r '.sourceTag' "$manifest")
              source_asset=$(jq -r '.sourceAsset' "$manifest")

              release_json="$workdir/release.json"
              curl --fail --silent --show-error --location \
                -H "Authorization: Bearer $SOURCE_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$source_repo/releases/tags/$source_tag" \
                -o "$release_json"

              asset_id=$(jq -r --arg name "$source_asset" '.assets[] | select(.name==$name) | .id' "$release_json" | head -1)
              test -n "$asset_id"
              test "$asset_id" != "null"

              curl --fail --silent --show-error --location \
                -H "Authorization: Bearer $SOURCE_TOKEN" \
                -H "Accept: application/octet-stream" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$source_repo/releases/assets/$asset_id" \
                -o "$source_apk"
            elif [ "$source_type" = "file" ]; then
              source_ref=$(jq -r '.sourceRef' "$manifest")
              source_path=$(jq -r '.sourcePath' "$manifest")
              encoded_ref=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$source_ref")

              curl --fail --silent --show-error --location \
                -H "Authorization: Bearer $SOURCE_TOKEN" \
                -H "Accept: application/vnd.github.raw+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$source_repo/contents/$source_path?ref=$encoded_ref" \
                -o "$source_apk"
            else
              echo "Unsupported sourceType: $source_type"
              exit 1
            fi

            test -s "$source_apk"
            unzip -t "$source_apk" >/dev/null
            cp "$source_apk" "$public_apk"

            if GH_TOKEN="$DEST_TOKEN" gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              GH_TOKEN="$DEST_TOKEN" gh release upload "$release_tag" "$public_apk" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
              GH_TOKEN="$DEST_TOKEN" gh release edit "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$app_name $version" \
                --notes "$app_name 공개 다운로드 최신본: $version"
            else
              GH_TOKEN="$DEST_TOKEN" gh release create "$release_tag" "$public_apk" \
                --repo "$GITHUB_REPOSITORY" \
                --target main \
                --title "$app_name $version" \
                --notes "$app_name 공개 다운로드 최신본: $version"
            fi

            echo "Published $app_name $version -> $release_tag/$public_asset"
          done
