name: Build Video Return Helper V0.3

on:
  push:
    branches: [ "main" ]
    paths:
      - "_vrh_build/**"
      - ".github/workflows/vrh-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V0.3 APK
        working-directory: _vrh_build
        run: gradle assembleDebug

      - name: Publish APK and clean temporary build files
        run: |
          mkdir -p downloads
          cp _vrh_build/app/build/outputs/apk/debug/app-debug.apk downloads/VideoReturnHelper-v0.3-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add downloads/VideoReturnHelper-v0.3-debug.apk
          git rm -r _vrh_build
          git rm -f .github/workflows/vrh-build.yml
          git rm -f .github/workflows/vrh-runner-test.yml || true

          git commit -m "Publish Video Return Helper V0.3 APK"
          git push
