<main class="adminInboxMain">
<div class="wrap">
<div class="adminInboxHead"><div class="kicker">ADMIN</div><h1>문의 접수함</h1><p>많이 쌓여도 빠르게 찾고 정리할 수 있도록 20건씩 표시합니다.</p></div>

<section class="adminLoginCard" id="adminLoginCard">
<label>관리자 비밀번호
<input id="adminPassword" type="password" autocomplete="current-password" placeholder="관리자 비밀번호">
</label>

<div class="adminMessage" id="adminLoginMessage"></div>
</section>

<section class="adminInbox" id="adminInbox" hidden>
<div class="adminToolbar">
  <div class="adminTabs" id="adminTabs">
    <button class="adminTab active" type="button" data-filter="all">전체 <b id="countAll">0</b></button>
    <button class="adminTab" type="button" data-filter="unread">미확인 <b id="countUnread">0</b></button>
    <button class="adminTab" type="button" data-filter="reviewed">확인 <b id="countReviewed">0</b></button>
    <button class="adminTab" type="button" data-filter="done">처리완료 <b id="countDone">0</b></button>
  </div>

  <div class="adminFilterRow">
    <input id="adminSearch" type="search" placeholder="제목 · 내용 · 업체 · 연락처 · 접수번호 검색">

    <button class="btn" id="adminExportCsv" type="button">CSV 내보내기</button>
    <button class="btn" id="adminExportJson" type="button">JSON 백업</button>
    <button class="btn" id="adminRefresh" type="button">새로고침</button>
    <button class="btn danger" id="deleteSelected" type="button" disabled>선택 삭제 <span id="selectedCount">0</span></button>
    <button class="btn danger" id="deleteDone" type="button">처리완료 일괄 삭제</button>
    <button class="btn dangerStrong" id="resetAll" type="button">전체 초기화</button>
    <button class="btn" id="adminLogout" type="button">로그아웃</button>

  <div class="adminPageInfo" id="pageInfo">1 / 1</div>
  <button id="nextPage" type="button">다음</button>

<script>
(()=>{
  const API='https://baedal-jjakkung-download.vercel.app/api/admin';
  const MAINTENANCE_API='/api/admin-maintenance';
  const PAGE_SIZE=20;

  const loginCard=document.getElementById('adminLoginCard');
  const inbox=document.getElementById('adminInbox');
  const pass=document.getElementById('adminPassword');
  const loginBtn=document.getElementById('adminLoginButton');
  const loginMsg=document.getElementById('adminLoginMessage');
  const inboxMsg=document.getElementById('adminInboxMessage');
  const list=document.getElementById('adminFeedbackList');
  const storageState=document.getElementById('adminStorageState');
  const refresh=document.getElementById('adminRefresh');
  const logout=document.getElementById('adminLogout');
  const exportCsv=document.getElementById('adminExportCsv');
  const exportJson=document.getElementById('adminExportJson');
  const search=document.getElementById('adminSearch');
  const tabs=document.getElementById('adminTabs');
  const selectPage=document.getElementById('selectPage');
  const deleteSelected=document.getElementById('deleteSelected');
  const deleteDone=document.getElementById('deleteDone');
  const resetAll=document.getElementById('resetAll');
  const selectedCount=document.getElementById('selectedCount');
  const summary=document.getElementById('adminSummaryLine');
  const prevPage=document.getElementById('prevPage');
  const nextPage=document.getElementById('nextPage');
  const pageInfo=document.getElementById('pageInfo');

  let token=sessionStorage.getItem('riderAdminToken')||'';
  let allItems=[];
  let currentFilter='all';
  let currentPage=1;
  const selected=new Set();

  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmt=s=>{try{return new Intl.DateTimeFormat('ko-KR',{dateStyle:'short',timeStyle:'short'}).format(new Date(s))}catch{return s||''}};
  const label={unread:'미확인',reviewed:'확인',done:'처리완료'};
  const rank={unread:0,reviewed:1,done:2};

  async function request(method,body){
    const r=await fetch(API,{
      method,
      headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},
      body:body?JSON.stringify(body):undefined
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw Object.assign(new Error(data.message||'요청 실패'),{code:data.code,status:r.status});
    return data;
  }

  async function maintain(action,extra={}){
    const r=await fetch(MAINTENANCE_API,{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify({action,...extra})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw Object.assign(new Error(data.message||'관리 작업 실패'),{code:data.code,status:r.status});
    return data;
  }

  async function login(){
    loginMsg.textContent='';
    loginBtn.disabled=true;
    try{
      const data=await request('POST',{action:'login',password:pass.value});
      token=data.token;
      sessionStorage.setItem('riderAdminToken',token);
      pass.value='';
      await load();
    }catch(e){
      loginMsg.textContent=e.code==='ADMIN_NOT_CONFIGURED'?'관리자 비밀번호 설정이 필요합니다.':e.message;
    }finally{loginBtn.disabled=false}
  }

  async function load(){
    inboxMsg.textContent='';
    try{
      const data=await request('GET');
      loginCard.hidden=true;
      inbox.hidden=false;
      allItems=Array.isArray(data.items)?data.items:[];
      const validIds=new Set(allItems.map(x=>x.id));
      [...selected].forEach(id=>{if(!validIds.has(id))selected.delete(id)});
      render();
      storageState.textContent=data.persistent?'● 영구저장 연결됨 · 삭제/초기화 가능':'⚠ 임시저장 상태 · 삭제/초기화 제한';
      storageState.style.color=data.persistent?'#17845c':'#9a6514';
    }catch(e){
      if(e.status===401){
        token='';sessionStorage.removeItem('riderAdminToken');
        loginCard.hidden=false;inbox.hidden=true;
      }
      inboxMsg.textContent=e.message||'불러오기에 실패했습니다.';
      inboxMsg.className='adminMessage error';
    }
  }

  function counts(){
    const n={all:allItems.length,unread:0,reviewed:0,done:0};
    allItems.forEach(x=>n[x.status||'unread']=(n[x.status||'unread']||0)+1);
    return n;
  }

  function filteredItems(){
    const q=search.value.trim().toLowerCase();
    return allItems
      .filter(x=>currentFilter==='all'||(x.status||'unread')===currentFilter)
      .filter(x=>{
        if(!q)return true;
        return [x.id,x.type,x.title,x.body,x.organization,x.name,x.contact]
          .some(v=>String(v||'').toLowerCase().includes(q));
      })
      .sort((a,b)=>{
        if(currentFilter==='all'){
          const d=(rank[a.status||'unread']??9)-(rank[b.status||'unread']??9);
          if(d)return d;
        }
        return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
      });
  }

  function pageItems(){
    const filtered=filteredItems();
    const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
    currentPage=Math.min(Math.max(1,currentPage),pages);
    return {
      filtered,
      pages,
      page:filtered.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE)
    };
  }

  function updateSelectionUi(page){
    const selectedOnPage=page.filter(x=>selected.has(x.id)).length;
    selectPage.checked=page.length>0&&selectedOnPage===page.length;
    selectPage.indeterminate=selectedOnPage>0&&selectedOnPage<page.length;
    selectedCount.textContent=selected.size;
    deleteSelected.disabled=selected.size===0;
  }

  function render(){
    const n=counts();
    document.getElementById('countAll').textContent=n.all;
    document.getElementById('countUnread').textContent=n.unread;
    document.getElementById('countReviewed').textContent=n.reviewed;
    document.getElementById('countDone').textContent=n.done;
    [...tabs.querySelectorAll('[data-filter]')].forEach(b=>b.classList.toggle('active',b.dataset.filter===currentFilter));

    const data=pageItems();
    summary.textContent='검색 결과 '+data.filtered.length+'건 · '+PAGE_SIZE+'건씩 표시 · 미확인 우선';
    pageInfo.textContent=currentPage+' / '+data.pages;
    prevPage.disabled=currentPage<=1;
    nextPage.disabled=currentPage>=data.pages;

    if(!data.page.length){
      list.innerHTML='<div class="adminEmpty">조건에 맞는 문의가 없습니다.</div>';
      updateSelectionUi([]);
      return;
    }

    list.innerHTML=data.page.map(x=>`
      <article class="adminCompactItem" data-id="${esc(x.id)}">
        <div class="adminCompactHead">
          <input class="adminCheck" type="checkbox" data-select="${esc(x.id)}" ${selected.has(x.id)?'checked':''} aria-label="문의 선택">
          <div>
            <div class="adminCompactMeta">
              <span class="adminType">${esc(x.type)}</span>
              <span class="adminStatus status-${esc(x.status||'unread')}">${label[x.status||'unread']}</span>
            </div>
            <h3 class="adminCompactTitle">${esc(x.title)}</h3>
          </div>
          <time class="adminCompactTime">${esc(fmt(x.createdAt))}</time>
        </div>
        <div class="adminCompactFoot">
          <div class="adminReceiptMini">${esc(x.id)}</div>
          <button class="adminDetailToggle" type="button" data-toggle-detail>상세보기</button>
        </div>
        <div class="adminDetail" hidden>
          ${x.organization?'<div class="adminDetailLine"><b>업체</b> '+esc(x.organization)+'</div>':''}
          ${x.name?'<div class="adminDetailLine"><b>담당자</b> '+esc(x.name)+'</div>':''}
          ${x.contact?'<div class="adminDetailLine"><b>연락처</b> '+esc(x.contact)+'</div>':''}
          <div class="adminDetailBody">${esc(x.body)}</div>
          <div class="adminStatusButtons">
            <button type="button" data-status="unread">미확인</button>
            <button type="button" data-status="reviewed">확인</button>
            <button type="button" data-status="done">처리완료</button>
          </div>
        </div>
      </article>`).join('');

    updateSelectionUi(data.page);
  }

  tabs.addEventListener('click',e=>{
    const b=e.target.closest('[data-filter]');
    if(!b)return;
    currentFilter=b.dataset.filter;
    currentPage=1;
    render();
  });

  search.addEventListener('input',()=>{currentPage=1;render()});
  prevPage.addEventListener('click',()=>{if(currentPage>1){currentPage--;render();scrollTo({top:0,behavior:'smooth'})}});
  nextPage.addEventListener('click',()=>{const p=pageItems();if(currentPage<p.pages){currentPage++;render();scrollTo({top:0,behavior:'smooth'})}});

  selectPage.addEventListener('change',()=>{
    const page=pageItems().page;
    page.forEach(x=>selectPage.checked?selected.add(x.id):selected.delete(x.id));
    render();
  });

  list.addEventListener('change',e=>{
    const cb=e.target.closest('[data-select]');
    if(!cb)return;
    cb.checked?selected.add(cb.dataset.select):selected.delete(cb.dataset.select);
    updateSelectionUi(pageItems().page);
  });

  list.addEventListener('click',async e=>{
    const detailBtn=e.target.closest('[data-toggle-detail]');
    if(detailBtn){
      const item=detailBtn.closest('[data-id]');
      const detail=item.querySelector('.adminDetail');
      detail.hidden=!detail.hidden;
      detailBtn.textContent=detail.hidden?'상세보기':'접기';
      return;
    }

    const btn=e.target.closest('[data-status]');
    if(!btn)return;
    const item=btn.closest('[data-id]');
    btn.disabled=true;
    try{
      await request('PATCH',{id:item.dataset.id,status:btn.dataset.status});
      await load();
    }catch(err){
      inboxMsg.textContent=err.message;
      inboxMsg.className='adminMessage error';
    }finally{btn.disabled=false}
  });

  deleteSelected.addEventListener('click',async()=>{
    const ids=[...selected];
    if(!ids.length)return;
    if(!confirm('선택한 '+ids.length+'건을 삭제할까요? 삭제 후 복구할 수 없습니다.'))return;
    deleteSelected.disabled=true;
    try{
      const data=await maintain('delete-selected',{ids});
      selected.clear();
      inboxMsg.textContent=(data.deleted||0)+'건을 삭제했습니다.';
      inboxMsg.className='adminMessage success';
      await load();
    }catch(e){
      inboxMsg.textContent=e.message;
      inboxMsg.className='adminMessage error';
    }finally{deleteSelected.disabled=false}
  });

  deleteDone.addEventListener('click',async()=>{
    const n=counts().done;
    if(!n){inboxMsg.textContent='처리완료 문의가 없습니다.';return}
    if(!confirm('처리완료 '+n+'건을 모두 삭제할까요? 삭제 후 복구할 수 없습니다.'))return;
    try{
      const data=await maintain('delete-done');
      selected.clear();
      inboxMsg.textContent=(data.deleted||0)+'건을 삭제했습니다.';
      inboxMsg.className='adminMessage success';
      await load();
    }catch(e){
      inboxMsg.textContent=e.message;
      inboxMsg.className='adminMessage error';
    }
  });

  resetAll.addEventListener('click',async()=>{
    if(!allItems.length){inboxMsg.textContent='초기화할 문의가 없습니다.';return}
    if(!confirm('전체 문의 '+allItems.length+'건을 모두 삭제하려고 합니다. 먼저 CSV 또는 JSON 백업을 권장합니다. 계속할까요?'))return;
    const word=prompt('정말 전체 초기화하려면 아래에 정확히 입력하세요.\n전체 초기화');
    if(word!=='전체 초기화'){inboxMsg.textContent='전체 초기화를 취소했습니다.';return}
    try{
      const data=await maintain('reset-all',{confirm:'전체 초기화'});
      selected.clear();
      inboxMsg.textContent=(data.deleted||0)+'건을 삭제하고 접수함을 초기화했습니다.';
      inboxMsg.className='adminMessage success';
      await load();
    }catch(e){
      inboxMsg.textContent=e.message;
      inboxMsg.className='adminMessage error';
    }
  });

  function fileStamp(){
    const d=new Date(); const p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
  }

  function downloadAdminFile(name,type,content){
    if(!window.confirm('파일을 저장하시겠습니까?')) return false;
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    return true;
  }

  function exportAllJson(){
    if(!allItems.length){inboxMsg.textContent='내보낼 접수 데이터가 없습니다.';return}
    const payload={exportedAt:new Date().toISOString(),count:allItems.length,items:allItems};
    const saved=downloadAdminFile('rider-feedback-backup-'+fileStamp()+'.json','application/json;charset=utf-8',JSON.stringify(payload,null,2));
    inboxMsg.textContent=saved?'JSON 백업 파일을 만들었습니다.':'저장을 취소했습니다.';
  }

  function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
  function exportAllCsv(){
    if(!allItems.length){inboxMsg.textContent='내보낼 접수 데이터가 없습니다.';return}
    const rows=[
      ['접수번호','종류','업체명','담당자','연락처','제목','내용','상태','접수시간','수정시간'],
      ...allItems.map(x=>[x.id||'',x.type||'',x.organization||'',x.name||'',x.contact||'',x.title||'',x.body||'',label[x.status||'unread']||x.status||'',x.createdAt||'',x.updatedAt||''])
    ];
    const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
    const saved=downloadAdminFile('rider-feedback-'+fileStamp()+'.csv','text/csv;charset=utf-8',csv);
    inboxMsg.textContent=saved?'CSV 파일을 만들었습니다.':'저장을 취소했습니다.';
  }

  exportCsv.addEventListener('click',exportAllCsv);
  exportJson.addEventListener('click',exportAllJson);
  loginBtn.addEventListener('click',login);
  pass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  refresh.addEventListener('click',load);
  logout.addEventListener('click',()=>{
    token='';sessionStorage.removeItem('riderAdminToken');selected.clear();
