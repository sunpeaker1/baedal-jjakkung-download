<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4fbff">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>관리자 접수함 | 라이더짝꿍</title>
<script>
if(location.hostname==='sunpeaker1.github.io'){
  location.replace('https://baedal-jjakkung-download.vercel.app/admin.html');
}
</script>
<link rel="stylesheet" href="assets/style.css?v=20260924-26">
</head>
<body class="homeLight adminInboxPage">
<nav class="nav"><div class="wrap"><div class="navin">
<a class="brand homeBrand" href="https://sunpeaker1.github.io/baedal-jjakkung-download/"><img src="assets/rider-app-icon.png?v=20260924-8" alt=""><span>라이더짝꿍</span></a>
<a class="btn" href="https://sunpeaker1.github.io/baedal-jjakkung-download/">홈으로</a>
</div></div></nav>
<main class="adminInboxMain">
<div class="wrap">
<div class="adminInboxHead"><div class="kicker">ADMIN</div><h1>오류·제안 접수함</h1><p>관리자 전용 화면입니다.</p></div>

<section class="adminLoginCard" id="adminLoginCard">
<label>관리자 비밀번호
<input id="adminPassword" type="password" autocomplete="current-password" placeholder="관리자 비밀번호">
</label>
<button class="btn primary" id="adminLoginButton" type="button">관리자 로그인</button>
<div class="adminMessage" id="adminLoginMessage"></div>
</section>

<section class="adminInbox" id="adminInbox" hidden>
<div class="adminToolbar">
<div class="adminCounts" id="adminCounts"></div><div id="adminStorageState" style="margin-top:8px;font-size:13px;font-weight:850;color:#526b83"></div>
<div class="adminToolbarButtons">
<button class="btn" id="adminExportCsv" type="button">CSV 내보내기</button>
<button class="btn" id="adminExportJson" type="button">JSON 백업</button>
<button class="btn" id="adminRefresh" type="button">새로고침</button>
<button class="btn" id="adminLogout" type="button">로그아웃</button>
</div>
</div>
<div class="adminFilterBar"><input id="adminSearch" type="search" placeholder="제목·내용·접수번호 검색"><select id="adminStatusFilter"><option value="all">전체 상태</option><option value="unread">미확인</option><option value="reviewed">확인</option><option value="done">처리완료</option></select></div>
<div class="adminMessage" id="adminInboxMessage"></div>
<div class="adminFeedbackList" id="adminFeedbackList"></div>
</section>
</div>
</main>
<script>
(()=>{
  const API=location.hostname.endsWith('.vercel.app')?'/api/admin':'https://baedal-jjakkung-download.vercel.app/api/admin';
  const loginCard=document.getElementById('adminLoginCard');
  const inbox=document.getElementById('adminInbox');
  const pass=document.getElementById('adminPassword');
  const loginBtn=document.getElementById('adminLoginButton');
  const loginMsg=document.getElementById('adminLoginMessage');
  const inboxMsg=document.getElementById('adminInboxMessage');
  const list=document.getElementById('adminFeedbackList');
  const counts=document.getElementById('adminCounts');
  const storageState=document.getElementById('adminStorageState');
  const refresh=document.getElementById('adminRefresh');
  const logout=document.getElementById('adminLogout');
  const exportCsv=document.getElementById('adminExportCsv');
  const exportJson=document.getElementById('adminExportJson');
  const search=document.getElementById('adminSearch');
  const statusFilter=document.getElementById('adminStatusFilter');
  let token=sessionStorage.getItem('riderAdminToken')||'';
  let allItems=[];

  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmt=s=>{try{return new Intl.DateTimeFormat('ko-KR',{dateStyle:'short',timeStyle:'short'}).format(new Date(s))}catch{return s||''}};
  const label={unread:'미확인',reviewed:'확인',done:'처리완료'};

  async function request(method,body){
    const r=await fetch(API,{
      method,
      headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},
      body:body?JSON.stringify(body):undefined
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw Object.assign(new Error(data.message||'요청 실패'),{code:data.code,status:r.status});
    return data;
  }

  async function login(){
    loginMsg.textContent='';
    loginBtn.disabled=true;
    try{
      const data=await request('POST',{action:'login',password:pass.value});
      token=data.token;
      sessionStorage.setItem('riderAdminToken',token);
      pass.value='';
      await load();
    }catch(e){
      loginMsg.textContent=e.code==='ADMIN_NOT_CONFIGURED'?'Vercel 관리자 비밀번호 설정이 필요합니다.':e.message;
    }finally{loginBtn.disabled=false}
  }

  async function load(){
    try{
      const data=await request('GET');
      loginCard.hidden=true;
      inbox.hidden=false;
      render(data.items||[]);
      if(storageState){
        storageState.textContent=data.persistent?'● 영구저장 연결됨':'⚠ 임시저장 상태 · Vercel Blob 연결 필요';
        storageState.style.color=data.persistent?'#17845c':'#9a6514';
      }
    }catch(e){
      if(e.status===401){
        token='';sessionStorage.removeItem('riderAdminToken');
        loginCard.hidden=false;inbox.hidden=true;
      }
      inboxMsg.textContent=e.message||'불러오기에 실패했습니다.';
    }
  }

  function render(items){
    allItems=Array.isArray(items)?items:[];
    const n={unread:0,reviewed:0,done:0};
    items.forEach(x=>n[x.status||'unread']=(n[x.status||'unread']||0)+1);
    counts.innerHTML='<b>전체 '+items.length+'</b><span>미확인 '+n.unread+'</span><span>확인 '+n.reviewed+'</span><span>처리완료 '+n.done+'</span>';
    if(!items.length){
      list.innerHTML='<div class="adminEmpty">아직 접수된 오류·제안이 없습니다.</div>';
      return;
    }
    list.innerHTML=items.map(x=>`
      <article class="adminFeedbackItem" data-id="${esc(x.id)}" data-state="${esc(x.status||'unread')}">
        <div class="adminFeedbackMeta">
          <span class="adminType">${esc(x.type)}</span>
          <span class="adminStatus status-${esc(x.status||'unread')}">${label[x.status||'unread']}</span>
          <time>${esc(fmt(x.createdAt))}</time>
        </div>
        <h3>${esc(x.title)}</h3>
        <p>${esc(x.body)}</p>
        <div class="adminReceipt">${esc(x.id)}</div>
        <div class="adminStatusButtons">
          <button type="button" data-status="unread">미확인</button>
          <button type="button" data-status="reviewed">확인</button>
          <button type="button" data-status="done">처리완료</button>
        </div>
      </article>`).join('');
    applyAdminFilter();
  }

  function applyAdminFilter(){
    const q=(search?.value||'').trim().toLowerCase();
    const state=statusFilter?.value||'all';
    [...list.querySelectorAll('.adminFeedbackItem')].forEach(item=>{
      const matchText=!q || item.textContent.toLowerCase().includes(q);
      const matchState=state==='all' || item.dataset.state===state;
      item.hidden=!(matchText&&matchState);
    });
  }
  search?.addEventListener('input',applyAdminFilter);
  statusFilter?.addEventListener('change',applyAdminFilter);

  function fileStamp(){
    const d=new Date();
    const p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
  }

  function downloadAdminFile(name,type,content){
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  }

  function exportAllJson(){
    if(!allItems.length){inboxMsg.textContent='내보낼 접수 데이터가 없습니다.';return;}
    const payload={
      exportedAt:new Date().toISOString(),
      count:allItems.length,
      items:allItems
    };
    downloadAdminFile(
      'rider-feedback-backup-'+fileStamp()+'.json',
      'application/json;charset=utf-8',
      JSON.stringify(payload,null,2)
    );
    inboxMsg.textContent='JSON 백업 파일을 만들었습니다.';
  }

  function csvCell(v){
    const x=String(v??'').replace(/"/g,'""');
    return '"'+x+'"';
  }

  function exportAllCsv(){
    if(!allItems.length){inboxMsg.textContent='내보낼 접수 데이터가 없습니다.';return;}
    const rows=[
      ['접수번호','종류','제목','내용','상태','접수시간','수정시간'],
      ...allItems.map(x=>[
        x.id||'',
        x.type||'',
        x.title||'',
        x.body||'',
        label[x.status||'unread']||x.status||'',
        x.createdAt||'',
        x.updatedAt||''
      ])
    ];
    const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
    downloadAdminFile(
      'rider-feedback-'+fileStamp()+'.csv',
      'text/csv;charset=utf-8',
      csv
    );
    inboxMsg.textContent='CSV 파일을 만들었습니다.';
  }

  exportCsv?.addEventListener('click',exportAllCsv);
  exportJson?.addEventListener('click',exportAllJson);

  list.addEventListener('click',async e=>{
    const btn=e.target.closest('[data-status]');
    if(!btn)return;
    const item=btn.closest('[data-id]');
    btn.disabled=true;
    try{
      await request('PATCH',{id:item.dataset.id,status:btn.dataset.status});
      await load();
    }catch(err){inboxMsg.textContent=err.message}
    finally{btn.disabled=false}
  });

  loginBtn.addEventListener('click',login);
  pass.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  refresh.addEventListener('click',load);
  logout.addEventListener('click',()=>{token='';sessionStorage.removeItem('riderAdminToken');inbox.hidden=true;loginCard.hidden=false});
  if(token) load();
})();
</script>
</body>
</html>
