<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>관리자 문의함</title><link rel="stylesheet" href="./assets/style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./index.html">고객상호명</a></div></header><main><section class="hero"><div class="wrap"><h1>관리자 문의함</h1></div></section><section class="section"><div class="wrap"><div id="login" class="card"><div class="field"><label>관리자 비밀번호</label><input id="pw" type="password"></div><button id="loginBtn" class="btn primary">로그인</button><div id="msg" class="status" style="margin-top:10px"></div></div><div id="inbox" hidden><div class="adminActions"><button class="btn" id="refresh">새로고침</button><button class="btn" id="logout">로그아웃</button></div><div id="storage" class="notice"></div><div id="list" class="list" style="margin-top:10px"></div></div></div></section></main><script>(()=>{const API='/api/admin';let token=sessionStorage.getItem('adminToken')||'';const login=document.getElementById('login'),inbox=document.getElementById('inbox'),list=document.getElementById('list'),msg=document.getElementById('msg');async function req(method,body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.message||'실패');return d}async function load(){try{const d=await req('GET');login.hidden=true;inbox.hidden=false;document.getElementById('storage').textContent=d.persistent?'● 영구저장 연결됨':'⚠ 임시저장 상태';list.innerHTML=(d.items||[]).map(x=>'<div class="row" data-id="'+x.id+'"><h3>['+x.type+'] '+x.title+'</h3><small>'+x.createdAt+' · '+(x.status||'unread')+'</small><p>'+String(x.body||'').replace(/[<>&]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))+'</p><button data-s="reviewed" class="btn">확인</button> <button data-s="done" class="btn">처리완료</button></div>').join('')||'<div class="row">문의가 없습니다.</div>'}catch(e){login.hidden=false;inbox.hidden=true;msg.textContent=e.message}}document.getElementById('loginBtn').onclick=async()=>{try{const d=await req('POST',{password:document.getElementById('pw').value});token=d.token;sessionStorage.setItem('adminToken',token);load()}catch(e){msg.textContent=e.message}};document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=()=>{token='';sessionStorage.removeItem('adminToken');location.reload()};list.onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;await req('PATCH',{id:b.closest('[data-id]').dataset.id,status:b.dataset.s});load()};if(token)load()})()</script></body></html>
