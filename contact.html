<meta property="og:type" content="website"><meta property="og:title" content="문의 · 오류 제보 · 광고제휴 | 라이더짝꿍"><meta property="og:description" content="일반 문의, 오류 제보, 기능 제안과 광고·제휴 문의를 홈페이지에서 접수합니다."><meta property="og:url" content="https://baedal-jjakkung-download.vercel.app/contact.html"><meta property="og:image" content="https://baedal-jjakkung-download.vercel.app/homepage2/rider_master_icon.png"></head><body class="homeLight"><nav class="nav"><div class="wrap"><div class="navin"><a class="brand homeBrand" href="./index.html" aria-label="라이더짝꿍 홈"><img src="./assets/rider-app-icon.png?v=20260924-8" alt=""><span>라이더짝꿍</span></a><div class="links"><a href="rider.html">라이더짝꿍</a><a href="nav.html">짝꿍내비</a><a href="quick.html">퀵짝꿍</a><a href="guide.html">사용법</a><a href="updates.html">업데이트</a><a href="contact.html">문의</a></div><button class="menu">메뉴</button></div><div class="mobileLinks"><a href="rider.html">라이더짝꿍</a><a href="nav.html">짝꿍내비</a><a href="quick.html">퀵짝꿍</a><a href="guide.html">사용법</a><a href="updates.html">업데이트</a><a href="contact.html">문의</a></div></div></nav><main><section class="section feedbackPage"><div class="wrap"><div class="head"><div class="kicker">FEEDBACK</div><h1>문의 · 오류 제보 · 기능 제안</h1><p class="muted">홈페이지에서 바로 접수됩니다. 접수 내용은 관리자 확인용으로 저장되며, 메일 알림 기능이 연결되면 운영자에게도 알림이 전송됩니다.</p></div><form id="feedbackForm" class="feedbackForm"><label>종류<select id="feedbackType" required><option value="일반 문의">일반 문의</option><option value="오류 제보">오류 제보</option><option value="기능 제안">기능 제안</option><option value="광고·제휴 문의">광고·제휴 문의</option></select></label>
<div id="partnerFields" hidden>
<label>업체명 <span style="font-weight:500;color:#70879a">(광고·제휴 필수)</span><input id="feedbackOrganization" type="text" maxlength="120" placeholder="업체 또는 브랜드명"></label>
<label>담당자 <span style="font-weight:500;color:#70879a">(광고·제휴 필수)</span><input id="feedbackName" type="text" maxlength="80" placeholder="담당자 이름"></label>
</div>
<label>제목<input id="feedbackTitle" type="text" maxlength="80" placeholder="문의 제목을 입력해 주세요" required></label>
<label>회신 연락처 <span id="contactHelp" style="font-weight:500;color:#70879a">(선택 · 광고·제휴는 필수)</span><input id="feedbackContact" type="text" maxlength="120" placeholder="이메일 또는 전화번호"></label><label>내용<textarea id="feedbackBody" rows="8" maxlength="3000" placeholder="어떤 화면에서 무엇을 했을 때 문제가 생겼는지 또는 원하는 기능을 적어주세요." required></textarea></label><div class="feedbackHelp" id="feedbackHelp"><b>오류 제보라면 함께 적어주세요</b><span>앱 버전 · 휴대폰 기종 · 발생 화면 · 발생 순서</span></div><input class="feedbackHoney" id="feedbackWebsite" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn primary feedbackSubmit" type="submit">작성한 내용 보내기</button><div class="feedbackResult" id="feedbackResult" role="status" aria-live="polite"></div><div class="feedbackRecent" id="feedbackRecent" hidden></div></form></div></section></main><div class="feedbackSuccessModal" id="feedbackSuccess" hidden><div class="feedbackSuccessCard"><div class="feedbackSuccessIcon">✓</div><h3>접수 완료</h3><p>문의 내용이 정상 접수됐습니다.</p><strong id="feedbackSuccessId"></strong><button type="button" id="feedbackSuccessClose">확인</button></div></div><footer><div class="wrap"><strong style="color:#fff">라이더짝꿍</strong><div>배달·퀵 라이더 운행 도우미</div><div style="margin-top:8px;font-size:13px">© <span data-year></span> Rider Mate</div></div></footer><script src="assets/site.js?v=20260924-20"></script><script>
(()=>{
 const form=document.getElementById('feedbackForm');
 const params=new URLSearchParams(location.search);
 const typeSelect=document.getElementById('feedbackType');
 const partnerFields=document.getElementById('partnerFields');
 const organization=document.getElementById('feedbackOrganization');
 const personName=document.getElementById('feedbackName');
 const contactHelp=document.getElementById('contactHelp');
 const helper=document.getElementById('feedbackHelp');
 const heroTitle=document.querySelector('.feedbackPage h1');
 const heroDesc=document.querySelector('.feedbackPage .muted');
 if(params.get('type')==='partner') typeSelect.value='광고·제휴 문의';
 if(params.get('type')==='general') typeSelect.value='일반 문의';
 function syncType(){
   const partner=typeSelect.value==='광고·제휴 문의';
   partnerFields.hidden=!partner;
   organization.required=partner;
   personName.required=partner;
   document.getElementById('feedbackContact').required=partner;
   contactHelp.textContent=partner?'(필수 · 이메일 또는 전화번호)':'(선택)';
   helper.hidden=typeSelect.value!=='오류 제보';
   if(partner){
     heroTitle.textContent='광고·제휴 문의';
     heroDesc.textContent='제안 내용은 관리자 접수함에 저장되며, 메일 알림이 연결된 경우 운영자에게도 전달됩니다.';
   }else{
     heroTitle.textContent='문의 · 오류 제보 · 기능 제안';
     heroDesc.textContent='문의 종류를 선택해 홈페이지에서 바로 접수할 수 있습니다.';
   }
 }
 typeSelect.addEventListener('change',syncType);
 syncType();
 const result=document.getElementById('feedbackResult');
 const recent=document.getElementById('feedbackRecent');
 const modal=document.getElementById('feedbackSuccess');
 const modalId=document.getElementById('feedbackSuccessId');
 const endpoint='/api/feedback';
 function showRecent(){
   try{
     const x=JSON.parse(localStorage.getItem('riderFeedbackRecent')||'null');
     if(x&&x.id){recent.hidden=false;recent.innerHTML='<b>최근 접수</b><span>'+x.id+'</span>';}
   }catch(e){}
 }
 showRecent();
 document.getElementById('feedbackSuccessClose').onclick=()=>modal.hidden=true;
 form.addEventListener('submit',async e=>{
   e.preventDefault();
   const submit=form.querySelector('.feedbackSubmit');
   const source=new URLSearchParams(location.search).get('source')||'';
   const rawTitle=document.getElementById('feedbackTitle').value.trim();
   const type=document.getElementById('feedbackType').value;
   const organizationValue=organization.value.trim();
   const nameValue=personName.value.trim();
   const contact=document.getElementById('feedbackContact').value.trim();
   if(type==='광고·제휴 문의'&&(organizationValue.length<2||nameValue.length<2||contact.length<4)){result.className='feedbackResult error';result.textContent='광고·제휴 문의는 업체명, 담당자, 회신 연락처를 모두 입력해 주세요.';return;}
   const payload={
     type,
     organization:organizationValue,
     name:nameValue,
     title:source==='homepage2'?'[홈페이지2] '+rawTitle:rawTitle,
     body:document.getElementById('feedbackBody').value.trim(),
     contact,
     website:document.getElementById('feedbackWebsite').value
   };
   result.className='feedbackResult';
   result.textContent='접수 중입니다...';
   submit.disabled=true;
   submit.textContent='접수 중...';
   try{
     const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
     const data=await r.json().catch(()=>({}));
     if(!r.ok||!data.ok) throw new Error(data.message||'접수 실패');
     localStorage.setItem('riderFeedbackRecent',JSON.stringify({id:data.id,at:new Date().toISOString()}));
     recent.hidden=false;
     recent.innerHTML='<b>최근 접수</b><span>'+data.id+'</span>';
     result.className='feedbackResult success';
     result.textContent='접수 완료 · 접수번호 '+data.id;
     modalId.textContent='접수번호 '+data.id;
     modal.hidden=false;
     form.reset();
     if(params.get('type')==='partner') typeSelect.value='광고·제휴 문의';
     syncType();
   }catch(err){
     result.className='feedbackResult error';
     result.textContent='접수에 실패했습니다. 잠시 후 다시 시도해 주세요.';
   }finally{
     submit.disabled=false;
     submit.textContent='작성한 내용 보내기';
   }
 });
})();
</script></body></html>
