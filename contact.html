<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>문의 | 고객상호명</title><link rel="stylesheet" href="./assets/style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="./index.html">고객상호명</a></div></header><main><section class="hero"><div class="wrap"><h1>문의하기</h1><p>일반 문의, 오류 제보, 기능 제안, 광고·제휴 문의를 접수할 수 있습니다.</p></div></section><section class="section"><div class="wrap"><form id="f" class="card"><div class="field"><label>종류</label><select id="type"><option>일반 문의</option><option>오류 제보</option><option>기능 제안</option><option>광고·제휴 문의</option></select></div><div class="field"><label>이름/업체명</label><input id="name" maxlength="100"></div><div class="field"><label>회신 연락처</label><input id="contact" maxlength="120" placeholder="이메일 또는 전화번호"></div><div class="field"><label>제목</label><input id="title" maxlength="80" required></div><div class="field"><label>내용</label><textarea id="body" maxlength="3000" required></textarea></div><input id="website" style="display:none" tabindex="-1" autocomplete="off"><button class="btn primary" type="submit">보내기</button><div id="result" class="status" style="margin-top:12px"></div></form></div></section></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('result');out.textContent='접수 중...';const payload={type:document.getElementById('type').value,name:document.getElementById('name').value.trim(),contact:document.getElementById('contact').value.trim(),title:document.getElementById('title').value.trim(),body:document.getElementById('body').value.trim(),website:document.getElementById('website').value};try{const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'접수 실패');out.textContent='접수 완료 · '+d.id;e.target.reset()}catch(err){out.textContent='접수 실패 · 잠시 후 다시 시도해 주세요.'}})</script></body></html>
