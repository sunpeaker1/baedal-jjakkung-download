y feedbackSubmit" type="submit">작성한 내용 보내기</button><div class="feedbackResult" id="feedbackResult" role="status" aria-live="polite"></div><div class="feedbackRecent" id="feedbackRecent" hidden></div></form></div></section></main><div class="feedbackSuccessModal" id="feedbackSuccess" hidden><div class="feedbackSuccessCard"><div class="feedbackSuccessIcon">✓</div><h3>접수 완료</h3><p>오류·제안이 정상 접수됐습니다.</p><strong id="feedbackSuccessId"></strong><button type="button" id="feedbackSuccessClose">확인</button></div></div><footer><div class="wrap"><strong style="color:#fff">라이더짝꿍</strong><div>배달·퀵 라이더 운행 도우미</div><div style="margin-top:8px;font-size:13px">© <span data-year></span> Rider Mate</div><div style="margin-top:14px"><a href="https://baedal-jjakkung-download.vercel.app/admin.html" style="display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border:1px solid #b8c9d8;border-radius:999px;background:#ffffff;color:#173654;font-size:13px;font-weight:800;text-decoration:none">관리자 접수함</a></div></div></footer><script src="assets/site.js?v=20260924-20"></script><script>
(()=>{
 const form=document.getElementById('feedbackForm');
 const result=document.getElementById('feedbackResult');
 const recent=document.getElementById('feedbackRecent');
 const modal=document.getElementById('feedbackSuccess');
 const modalId=document.getElementById('feedbackSuccessId');
 const endpoint='https://baedal-jjakkung-download.vercel.app/api/feedback';
 function showRecent(){
   try{
     const x=JSON.parse(localStorage.getItem('riderFeedbackRecent')||'null');
     if(x&&x.id){recent.hidden=false;recent.innerHTML='<b>최근 접수</b><span>'+x.id+'</span>';}
   }catch(e){}
 }
 showRecent();
 document.getElementById('feedbackSuccessClose').onclick=()=>modal.hidden=true;
 form.addEventListener('submit',async e=>{
   e.preventDefault();
   const submit=form.querySelector('.feedbackSubmit');
   const source=new URLSearchParams(location.search).get('source')||'';
   const rawTitle=document.getElementById('feedbackTitle').value.trim();
   const payload={
     type:document.getElementById('feedbackType').value,
     title:source==='homepage2'?'[홈페이지2] '+rawTitle:rawTitle,
     body:document.getElementById('feedbackBody').value.trim(),
     website:document.getElementById('feedbackWebsite').value
   };
   result.className='feedbackResult';
   result.textContent='접수 중입니다...';
   submit.disabled=true;
   submit.textContent='접수 중...';
   try{
     const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
     const data=await r.json().catch(()=>({}));
     if(!r.ok||!data.ok) throw new Error(data.message||'접수 실패');
     localStorage.setItem('riderFeedbackRecent',JSON.stringify({id:data.id,at:new Date().toISOString()}));
     recent.hidden=false;
     recent.innerHTML='<b>최근 접수</b><span>'+data.id+'</span>';
     result.className='feedbackResult success';
     result.textContent='접수 완료 · 접수번호 '+data.id;
     modalId.textContent='접수번호 '+data.id;
     modal.hidden=false;
     form.reset();
   }catch(err){
     result.className='feedbackResult error';
     result.textContent='접수에 실패했습니다. 잠시 후 다시 시도해 주세요.';
   }finally{
     submit.disabled=false;
     submit.textContent='작성한 내용 보내기';
   }
 });
})();
</script></body></html>
