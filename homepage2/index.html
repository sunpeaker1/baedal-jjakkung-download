<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf7ff">
  <meta name="robots" content="noindex,nofollow">
  <title>라이더짝꿍 웹 체험판 | 홈페이지2</title>
  <link rel="stylesheet" href="./style.css?v=20260924-2">
</head>
<body>
  <main class="webAppStage">
    <section class="appReplica" aria-label="라이더짝꿍 웹 체험판">
      <header class="appTop">
        <div class="appBrand">
          <img src="../assets/rider-app-icon.png?v=20260924-8" alt="">
          <div>
            <div class="brandLine"><strong>라이더짝꿍</strong><span>Syn</span></div>
            <small>운행도우미</small>
          </div>
        </div>
        <button class="demoBadge explainBtn" data-help="demo" type="button">웹 체험판</button>
      </header>

      <div class="appSubbar">
        <span class="autoOn">● 자동기록 ON</span>
        <time id="todayText"></time>
      </div>

      <section class="appViewport" id="appViewport" aria-live="polite"></section>

      <nav class="appBottomNav" aria-label="라이더짝꿍 메뉴">
        <button class="navItem active" type="button" data-screen="home">
          <span class="navIcon">⌂</span><small>홈</small>
        </button>
        <button class="navItem" type="button" data-screen="region">
          <span class="navIcon">⌖</span><small>지역판단</small>
        </button>
        <button class="navItem" type="button" data-screen="record">
          <span class="navIcon">▤</span><small>운행기록</small>
        </button>
        <button class="navItem" type="button" data-screen="nav">
          <span class="navIcon">➤</span><small>짝꿍내비</small>
        </button>
        <button class="navItem" type="button" data-screen="manage">
          <span class="navIcon">☷</span><small>관리</small>
        </button>
      </nav>
    </section>
  </main>

  <section class="helpSheet" id="helpSheet" hidden aria-modal="true" role="dialog">
    <button class="sheetBackdrop" type="button" aria-label="닫기" data-close-sheet></button>
    <div class="sheetCard">
      <div class="sheetGrab"></div>
      <div class="sheetHead">
        <div>
          <span class="sheetKicker" id="sheetKicker">기능 안내</span>
          <h2 id="sheetTitle"></h2>
        </div>
        <button class="sheetClose" type="button" aria-label="닫기" data-close-sheet>×</button>
      </div>
      <p class="sheetDesc" id="sheetDesc"></p>
      <div class="sheetImageWrap" id="sheetImageWrap" hidden>
        <img id="sheetImage" alt="">
      </div>
      <div class="sheetGuide">
        <h3>사용방법</h3>
        <ol id="sheetSteps"></ol>
      </div>
      <div class="sheetNote" id="sheetNote"></div>
      <button class="sheetDone" type="button" data-close-sheet>확인</button>
    </div>
  </section>

  <script src="./site.js?v=20260924-2"></script>
</body>
</html>
