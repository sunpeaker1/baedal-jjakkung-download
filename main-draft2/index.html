<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif}
body{

a{text-decoration:none;color:inherit}
.page{

.glow{position:absolute;border-radius:50%;filter:blur(10px);opacity:.48;pointer-events:none}

.logo{width:55px;height:55px;border-radius:16px;box-shadow:0 12px 25px rgba(0,0,0,.23)}

.topBrowse{

  border:1px solid rgba(124,228,255,.46);background:rgba(38,191,244,.12);
  backdrop-filter:blur(10px);font-size:11px;font-weight:1000;box-shadow:0 9px 22px rgba(0,0,0,.10)

.hero{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 4px}
.badge{

h1{margin:14px 0 0;font-size:42px;line-height:1.06;letter-spacing:-2.3px;font-weight:1000}
h1 em{font-style:normal;color:var(--cyan)}
.lead{margin:13px 0 0;color:#deefff;font-size:14px;line-height:1.62;font-weight:780;letter-spacing:-.15px}
.visual{
  margin-top:20px;position:relative;display:block;border-radius:26px;overflow:hidden;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(5,28,62,.86);
  box-shadow:0 22px 50px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08)

.visualPoster{display:block;width:100%;aspect-ratio:1.54/1;object-fit:cover;object-position:center center}
.visualFooter{
  min-height:58px;padding:10px 13px 11px 14px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(100deg,rgba(5,30,64,.98),rgba(7,86,143,.96) 62%,rgba(20,160,143,.93));

.visualFooterText{min-width:0;flex:1}
.visualFooterText strong{display:block;font-size:13px;line-height:1.25;letter-spacing:-.35px}
.visualFooterText small{display:block;margin-top:3px;color:#c8e8f7;font-size:9.5px;font-weight:800}
.visualCta{

  font-size:9.5px;font-weight:1000;box-shadow:0 7px 15px rgba(0,0,0,.15)
}
.visual:active{transform:translateY(1px)}
.actions{display:grid;grid-template-columns:1.28fr .72fr;gap:9px;margin-top:15px}
.primary,.secondary{
  min-height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:1000

.primary{background:#fff;color:#0a68b8;box-shadow:0 12px 24px rgba(0,33,84,.18)}
.secondary{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:#fff}
.note{margin-top:9px;text-align:center;color:#bcd9ed;font-size:9px;font-weight:800}
@media(max-width:380px){

</style>
