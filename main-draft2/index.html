<style>
:root{
  --cyan:#62ddff;--mint:#59edbf;--text:#fff;--muted:#d8ecff;
  --line:rgba(255,255,255,.19);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif}
body{
  color:#fff;
  background:
    radial-gradient(circle at 14% 14%,rgba(42,202,255,.28),transparent 27%),
    radial-gradient(circle at 88% 38%,rgba(54,235,181,.23),transparent 31%),
    radial-gradient(circle at 50% 100%,rgba(55,119,255,.25),transparent 36%),
    linear-gradient(160deg,#071a35 0%,#0a315d 45%,#0b6aa8 100%);
}
a{text-decoration:none;color:inherit}
.page{
  width:min(100%,430px);min-height:100dvh;margin:0 auto;position:relative;overflow:hidden;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}
.glow{position:absolute;border-radius:50%;filter:blur(10px);opacity:.48;pointer-events:none}
.g1{width:170px;height:170px;left:-72px;top:118px;background:#16c8ff}
.g2{width:220px;height:220px;right:-95px;top:305px;background:#34e0aa}
.g3{width:170px;height:170px;left:30%;bottom:-80px;background:#3e7fff}
.top{display:flex;align-items:center;gap:11px;position:relative;z-index:5}
.logo{width:55px;height:55px;border-radius:16px;box-shadow:0 12px 25px rgba(0,0,0,.23)}
.brand{min-width:0}
.brand strong{display:block;font-size:25px;line-height:1.05;letter-spacing:-1.35px;font-weight:1000;white-space:nowrap}
.brand span{display:block;margin-top:4px;color:#c3eaff;font-size:9.5px;font-weight:850;white-space:nowrap}
.topBrowse{
  margin-left:auto;white-space:nowrap;padding:10px 13px;border-radius:999px;
  border:1px solid rgba(124,228,255,.46);background:rgba(38,191,244,.12);
  backdrop-filter:blur(10px);font-size:11px;font-weight:1000;box-shadow:0 9px 22px rgba(0,0,0,.10)
}
.hero{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 4px}
.badge{
  display:inline-flex;align-self:flex-start;padding:7px 11px;border-radius:999px;
  border:1px solid rgba(83,236,188,.35);background:rgba(75,228,180,.12);
  color:#c6ffe8;font-size:11px;font-weight:1000;letter-spacing:.045em
}
h1{margin:14px 0 0;font-size:42px;line-height:1.06;letter-spacing:-2.3px;font-weight:1000}
h1 em{font-style:normal;color:var(--cyan)}
.lead{margin:13px 0 0;color:#deefff;font-size:14px;line-height:1.62;font-weight:780;letter-spacing:-.15px}
.visual{
  margin-top:20px;position:relative;display:block;min-height:258px;border-radius:26px;overflow:hidden;
  border:1px solid rgba(255,255,255,.22);
  background:
    radial-gradient(circle at 88% 14%,rgba(91,226,255,.24),transparent 31%),
    radial-gradient(circle at 12% 88%,rgba(71,234,181,.16),transparent 28%),
    linear-gradient(125deg,rgba(5,28,62,.96),rgba(8,81,139,.88) 56%,rgba(25,179,157,.42));
  box-shadow:0 22px 50px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08)
}
.visual:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(2,25,55,.20),transparent 48%,rgba(255,255,255,.03))
}
.visualTitle{position:absolute;z-index:5;left:18px;top:18px;max-width:47%}
.visualTitle span{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:rgba(78,227,187,.13);border:1px solid rgba(94,238,199,.27);color:#a9ffe1;font-size:8.5px;font-weight:1000;letter-spacing:.11em}
.visualTitle strong{display:block;margin-top:9px;font-size:22px;line-height:1.18;letter-spacing:-1px}
.visualTitle p{margin:8px 0 0;color:#d7ecfb;font-size:10.5px;line-height:1.5;font-weight:760}
.previewPoints{position:absolute;z-index:5;left:18px;bottom:18px;display:grid;gap:6px;max-width:40%}
.previewPoints span{display:flex;align-items:center;gap:5px;color:#e9f7ff;font-size:9.5px;font-weight:850}
.previewPoints i{width:6px;height:6px;border-radius:50%;background:#67e7c0;box-shadow:0 0 0 4px rgba(103,231,192,.10)}
.previewCta{position:absolute;z-index:6;right:15px;top:14px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#0969b2;font-size:9px;font-weight:1000;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.phone{
  position:absolute;z-index:4;right:12px;bottom:-7px;width:55%;height:222px;
  border:1px solid rgba(255,255,255,.34);border-radius:27px 27px 0 0;background:#08182c;padding:5px;
  box-shadow:0 18px 34px rgba(0,0,0,.30);overflow:hidden
}
.phone:before{content:"";position:absolute;z-index:3;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:99px;background:rgba(7,24,45,.55)}
.phone iframe{
  width:430px;height:760px;border:0;background:#eef6fb;transform:scale(.48);
  transform-origin:top left;pointer-events:none
}
.visualArrow{
  position:absolute;z-index:7;right:17px;bottom:15px;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;background:#fff;color:#0a6eb8;font-size:19px;font-weight:1000;
  box-shadow:0 8px 18px rgba(0,0,0,.18)
}
.visual:active{transform:translateY(1px)}
.actions{display:grid;grid-template-columns:1.28fr .72fr;gap:9px;margin-top:15px}
.primary,.secondary{
  min-height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:1000
}
.primary{background:#fff;color:#0a68b8;box-shadow:0 12px 24px rgba(0,33,84,.18)}
.secondary{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:#fff}
.note{margin-top:9px;text-align:center;color:#bcd9ed;font-size:9px;font-weight:800}
@media(max-width:380px){
  .page{padding-left:15px;padding-right:15px}
  .logo{width:49px;height:49px}.brand strong{font-size:22px}.brand span{font-size:8.5px}
  .topBrowse{padding:9px 10px;font-size:10px}
  .hero{padding-top:18px}.badge{font-size:10px}h1{font-size:37px}.lead{font-size:13.5px}
  .visual{min-height:238px;margin-top:17px}.visualTitle{left:15px;top:15px}.visualTitle strong{font-size:19px}.visualTitle p{font-size:9.5px}.previewPoints{left:15px;bottom:15px}.previewPoints span{font-size:8.8px}
  .phone{right:9px;height:207px;width:54%}.phone iframe{transform:scale(.445)}
  .previewCta{right:12px;top:12px}
  .actions{grid-template-columns:1.2fr .8fr}
}
</style>
