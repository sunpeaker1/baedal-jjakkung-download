.visual{

.visualTitle{position:absolute;z-index:3;left:17px;top:16px}

.visualTitle strong{display:block;margin-top:5px;font-size:20px;line-height:1.2;letter-spacing:-.8px}

.visualHint{

.actions{display:grid;grid-template-columns:1.28fr .72fr;gap:9px;margin-top:15px}
.primary,.secondary{
