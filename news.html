<section class="hero"><div class="wrap"><span class="eyebrow">Rider News</span><h1>라이더 소식</h1><p class="lead">음식배달, 카카오퀵, 일반 퀵서비스, 정책·안전 정보를 날짜와 출처를 기준으로 정리합니다.</p></div></section>
<section class="section"><div class="wrap"><div class="newsbar"><button class="filter active" data-cat="전체">전체</button><button class="filter" data-cat="음식배달">음식배달</button><button class="filter" data-cat="카카오퀵">카카오퀵</button><button class="filter" data-cat="일반퀵">일반퀵</button><button class="filter" data-cat="정책안전">정책·안전</button></div><div class="newsgrid" id="newsgrid"></div></div></section>
</main><footer><div class="wrap"><strong style="color:#fff">라이더짝꿍</strong><div>배달·퀵 라이더 운행 도우미</div><div style="margin-top:8px;font-size:13px">© <span data-year></span> Rider Mate · 테스트 기능과 배포 버전은 변경될 수 있습니다.</div></div></footer><script src="assets/site.js"></script><script src="news-data.js"></script><script>
const grid=document.getElementById('newsgrid'),filters=[...document.querySelectorAll('.filter')];
let cat='전체';function esc(s=''){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const items=(window.RIDER_NEWS||[]).filter(x=>cat==='전체'||x.category===cat).sort((a,b)=>new Date(b.date)-new Date(a.date));grid.innerHTML=items.length?items.map(x=>`<article class="news"><div><span class="tag">${esc(x.category)}</span> <span class="muted" style="font-size:12px">${esc(x.date)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="more">${x.source?'출처: '+esc(x.source):'라이더짝꿍'}</div></article>`).join(''):'<div class="card">등록된 소식이 없습니다.</div>'}
filters.forEach(b=>b.onclick=()=>{cat=b.dataset.cat;filters.forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
