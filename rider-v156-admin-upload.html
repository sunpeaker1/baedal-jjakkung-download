<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>라이더짝꿍 V1.58.156 비공개 APK 등록</title>
<style>*{box-sizing:border-box}body{font:16px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f4f8fc;color:#142c42;margin:0}.wrap{max-width:520px;margin:30px auto;padding:18px}.card{padding:24px;border-radius:20px;background:white;border:1px solid #dce4ef;box-shadow:0 10px 28px #1232}h1{font-size:23px;line-height:1.4}p{font-size:14px;color:#52697b}.choice{display:block;border:1px solid #b6c7d5;padding:14px;border-radius:12px;width:100%;margin:18px 0}button{border:0;background:#158647;color:white;font-size:17px;font-weight:bold;width:100%;border-radius:14px;padding:16px}button:disabled{opacity:.45}.notice{background:#fff5e4;padding:13px;border-radius:12px}progress{width:100%;height:20px}#state{font-weight:600;white-space:pre-line}</style></head><body><main class="wrap"><div class="card"><div>라이더짝꿍 · 비공개 1회 등록</div><h1>V1.58.156 APK 등록</h1><p>공식 다운로드 버튼에서 파일을 받을 수 있도록 원본을 비공개 저장소에 한 번만 등록합니다.</p><p class="notice">사용하던 라이더짝꿍 앱은 삭제하거나 초기화하지 마세요. 여기서는 설치·실행을 하지 않습니다.</p><label for="apk">휴대전화에 저장된 V1.58.156 APK 선택</label><input class="choice" id="apk" type="file" accept=".apk,application/vnd.android.package-archive"><button id="start" type="button">비공개 APK 등록</button><progress id="bar" value="0" max="100" hidden></progress><p role="status" id="state">대기 중</p></div></main>
<script>
(function(){
const EXPECTED_SIZE=54954541,EXPECTED_SHA='d38ef5809029e28a7a168466ba75746077a99e6fb6c746651cd711c492a9cee3';
const CHUNK_SIZE=2500000;const token=new URLSearchParams(location.hash.replace(/^#/,'')).get('token')||'';
try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
const input=document.getElementById('apk'),button=document.getElementById('start'),bar=document.getElementById('bar'),state=document.getElementById('state');
const msg=s=>{state.textContent=s};
const hex=a=>Array.from(new Uint8Array(a)).map(x=>x.toString(16).padStart(2,'0')).join('');
async function makeSha(data){return hex(await crypto.subtle.digest('SHA-256',data))}
async function ask(path,options={}){
 const r=await fetch('/api/v156-upload?action='+path,{cache:'no-store',credentials:'same-origin',...options,headers:{Authorization:'Bearer '+token,...(options.headers||{})}});
 let j;try{j=await r.json()}catch{throw Error('서버 응답을 확인하지 못했습니다 ('+r.status+')')}
 if(!r.ok||!j.ok)throw Error('서버 검사 실패: '+(j.error||r.status));return j;
}
if(!token){button.disabled=true;msg('비공개 링크에서 다시 접속해 주세요.')}
button.onclick=async function(){
 const file=input.files&&input.files[0];if(!file){msg('APK 파일을 먼저 선택하세요.');return}
 if(file.size!==EXPECTED_SIZE){msg('선택한 파일 크기가 V156 원본과 다릅니다. 등록을 중단합니다.');return}
 button.disabled=true;bar.hidden=false;
 try{
  msg('원본 APK의 SHA-256을 확인하는 중…');
  const digest=await makeSha(await file.arrayBuffer());
  if(digest!==EXPECTED_SHA)throw Error('V156 원본 APK 해시가 다릅니다. 안전을 위해 중단합니다.');
  const count=Math.ceil(file.size/CHUNK_SIZE);
  for(let i=0;i<count;i++){
   const chunk=file.slice(i*CHUNK_SIZE,Math.min(file.size,(i+1)*CHUNK_SIZE));
   const sha=await makeSha(await chunk.arrayBuffer());
   let ok=false;
   for(let attempt=0;attempt<3&&!ok;attempt++){
    try {await ask('part',{method:'POST',headers:{'Content-Type':'application/octet-stream','x-v156-part-index':String(i),'x-v156-part-sha256':sha},body:chunk});ok=true;}
    catch(e){if(attempt===2)throw e;}
   }
   bar.value=Math.round((i+1)/count*95);
   msg('비공개 저장 중: '+(i+1)+' / '+count+'개 조각');
  }
  msg('서버에서 전체 APK의 해시를 다시 확인하는 중…');
  const proof=await ask('complete',{method:'POST'});
  if(!proof.ready||proof.sha256!==EXPECTED_SHA)throw Error('최종 원본 검증에 실패했습니다.');
  bar.value=100;msg('등록 성공. APK 원본이 비공개로 저장되고 전체 해시 검증을 마쳤습니다.');
 }catch(e){msg('등록 미완료: '+(e.message||'알 수 없는 문제')+'\n같은 파일을 다시 선택하면 재시도할 수 있습니다.');}
 finally{button.disabled=false;}
};
})();
</script></body></html>
