<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>계정 설정 · RiderNex</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#667085;--line:#e3e8ef;--bg:#f6f8fc;--danger:#c43d34}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:820px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.topin a:last-child{font-size:13px;font-weight:900;color:#276fbe}.wrap{max-width:820px;margin:auto;padding:20px 14px 45px}.hero{padding:21px;border-radius:20px;background:linear-gradient(135deg,#1658bb,#1978e7 60%,#2ba6d7);color:#fff}.hero h1{margin:0;font-size:27px}.hero p{margin:7px 0 0;font-size:14px;color:#eaf4ff;line-height:1.55}.section{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.section h2{margin:0;font-size:19px}.section>p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.form{display:grid;gap:10px;margin-top:13px}.field label{display:block;margin-bottom:5px;font-size:13px;font-weight:900}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid #dbe3ec;border-radius:11px;background:#fff;font:inherit;font-size:14px}.field textarea{min-height:88px;resize:vertical}.readonly{background:#f5f7fa!important;color:#738095}.btn{border:0;border-radius:11px;background:#0d73e6;color:#fff;padding:11px 14px;font-size:13px;font-weight:1000;white-space:nowrap}.btn.alt{background:#eef5ff;color:#176bc5;border:1px solid #cfe0f7}.btn.danger{background:#fff0ee;color:var(--danger);border:1px solid #efc8c4}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{min-height:20px;margin-top:10px;font-size:13px}.good{color:#087b42}.bad{color:#c0392b}.legal{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;color:#4b6f99;font-size:12px;font-weight:800}.lock{padding:28px;border:1px dashed #cad5e3;border-radius:16px;background:#fff;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.lock a{display:inline-block;margin-top:10px;padding:10px 13px;border-radius:11px;background:#0d73e6;color:#fff;font-weight:900}.warning{margin-top:10px;padding:11px;border-radius:11px;background:#fff7e7;border:1px solid #f1d9a7;color:#79571e;font-size:12px;line-height:1.55}@media(max-width:520px){.row .btn{width:100%}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 계정</a><a href="my.html">내 방</a></div></header>
<main class="wrap"><section class="hero"><h1>계정 설정</h1><p>프로필, 비밀번호와 회원 계정을 관리합니다.</p></section><div id="app"><div class="lock">계정 정보를 확인하고 있습니다.</div></div><div class="legal"><a href="terms.html">이용약관</a><a href="privacy.html">개인정보처리방침</a></div></main>
<script src="supabase-adapter.js"></script><script>
const app=document.getElementById("app");let state=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
(async function(){
  state=await RNXRemote.init();
  if(!state.enabled||!state.user){
    app.innerHTML='<div class="lock">로그인 후 계정 설정을 사용할 수 있습니다.<br><a href="auth.html">로그인</a></div>';return;
  }
  const p=state.profile||await RNXRemote.refreshProfile();
  render(p||{});
})();
function render(p){
  const admin=["admin","moderator"].includes(p.role);
  let h='';
  h+='<section class="section"><h2>프로필 수정</h2><p>라이더넥스에서 다른 회원에게 보여줄 기본 정보입니다.</p><div class="form">';
  h+='<div class="field"><label>이메일</label><input class="readonly" value="'+esc(state.user.email||"")+'" readonly></div>';
  h+='<div class="field"><label>닉네임</label><input id="nickname" maxlength="20" value="'+esc(p.nickname||"")+'"></div>';
  h+='<div class="field"><label>주 활동지역</label><input id="primaryRegion" maxlength="50" value="'+esc(p.primary_region||"")+'" placeholder="예: 서울 관악구"></div>';
  h+='<div class="field"><label>보조 활동지역</label><input id="secondaryRegion" maxlength="50" value="'+esc(p.secondary_region||"")+'" placeholder="선택 입력"></div>';
  h+='<div class="field"><label>바이크</label><input id="bike" maxlength="80" value="'+esc(p.bike||"")+'" placeholder="예: PCX 125"></div>';
  h+='<div class="field"><label>소개</label><textarea id="bio" maxlength="300" placeholder="간단한 소개">'+esc(p.bio||"")+'</textarea></div>';
  h+='<button class="btn" id="saveProfile" type="button">프로필 저장</button></div><div class="msg" id="profileMsg"></div></section>';
  h+='<section class="section"><h2>비밀번호</h2><p>로그인된 상태에서는 바로 변경할 수 있고, 이메일로 재설정 링크를 받을 수도 있습니다.</p>';
  h+='<div class="form"><div class="field"><label>새 비밀번호</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="8자 이상"></div></div>';
  h+='<div class="row"><button class="btn" id="changePassword" type="button">비밀번호 변경</button><button class="btn alt" id="sendReset" type="button">재설정 메일 보내기</button></div><div class="msg" id="passwordMsg"></div></section>';
  h+='<section class="section"><h2>회원탈퇴</h2><p>회원탈퇴 시 프로필과 작성한 게시글·댓글·장터·업체·구인 등 계정에 연결된 데이터가 함께 삭제될 수 있습니다.</p>';
  if(admin) h+='<div class="warning">관리자 계정은 안전을 위해 여기서 탈퇴할 수 없습니다. 먼저 관리자 권한을 다른 계정으로 이전하거나 해제해야 합니다.</div>';
  else h+='<div class="row"><button class="btn danger" id="deleteAccount" type="button">회원탈퇴</button></div>';
  h+='<div class="msg" id="deleteMsg"></div></section>';
  app.innerHTML=h;

  document.getElementById("saveProfile").onclick=async function(){
    const m=document.getElementById("profileMsg");m.textContent="저장 중입니다...";m.className="msg";
    try{
      const updated=await RNXRemote.updateProfile({nickname:nickname.value,primaryRegion:primaryRegion.value,secondaryRegion:secondaryRegion.value,bio:bio.value,bike:bike.value});
      m.textContent="프로필을 저장했습니다.";m.className="msg good";state.profile=updated;
    }catch(e){m.textContent=e.message||"저장에 실패했습니다.";m.className="msg bad"}
  };
  document.getElementById("changePassword").onclick=async function(){
    const m=document.getElementById("passwordMsg");m.textContent="변경 중입니다...";m.className="msg";
    try{await RNXRemote.updatePassword(newPassword.value);newPassword.value="";m.textContent="비밀번호를 변경했습니다.";m.className="msg good"}
    catch(e){m.textContent=e.message||"비밀번호 변경에 실패했습니다.";m.className="msg bad"}
  };
  document.getElementById("sendReset").onclick=async function(){
    const m=document.getElementById("passwordMsg");m.textContent="재설정 메일을 요청하고 있습니다...";m.className="msg";
    try{await RNXRemote.sendPasswordReset(state.user.email);m.textContent="비밀번호 재설정 메일을 요청했습니다. 메일함과 스팸함을 확인하세요.";m.className="msg good"}
    catch(e){m.textContent=e.message||"재설정 메일을 보내지 못했습니다.";m.className="msg bad"}
  };
  const del=document.getElementById("deleteAccount");
  if(del)del.onclick=async function(){
    const m=document.getElementById("deleteMsg");
    if(!confirm("정말 회원탈퇴할까요? 계정과 연결된 데이터가 삭제될 수 있습니다."))return;
    const check=prompt("확인을 위해 탈퇴 를 입력하세요.");
    if(check!=="탈퇴"){m.textContent="회원탈퇴가 취소되었습니다.";m.className="msg bad";return}
    del.disabled=true;m.textContent="회원탈퇴 처리 중입니다...";m.className="msg";
    try{await RNXRemote.deleteAccount();alert("회원탈퇴가 완료되었습니다.");location.href="./"}
    catch(e){m.textContent=e.message||"회원탈퇴에 실패했습니다.";m.className="msg bad";del.disabled=false}
  };
}
</script></body></html>
