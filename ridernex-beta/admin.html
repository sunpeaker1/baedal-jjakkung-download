<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>관리자 신고함 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:880px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.home{font-size:13px;font-weight:900;color:#276fbe}.wrap{max-width:880px;margin:auto;padding:20px 14px 40px}.notice{padding:13px;border-radius:13px;background:#fff8df;border:1px solid #f0dda4;color:#72511b;font-size:12px;line-height:1.5}.head{margin-top:14px;display:flex;justify-content:space-between;align-items:end}.head h1{margin:0;font-size:25px}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}.list{display:grid;gap:9px;margin-top:12px}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.item.done{opacity:.55}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#edf5ff;color:#176bc5;font-size:11px;font-weight:900}.item h3{margin:8px 0 0;font-size:14px}.meta{margin-top:4px;color:#8a95a4;font-size:11px}.reason{margin-top:8px;color:#526174;font-size:12px}.item button{margin-top:9px;border:1px solid #cfe0f7;background:#eef5ff;color:#176bc5;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:900;white-space:nowrap}.empty{margin-top:12px;padding:22px;border:1px dashed #cbd5e1;border-radius:13px;text-align:center;color:var(--muted);font-size:12px}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 관리자</a><a class="home" href="./">홈으로</a></div></header>
<main class="wrap"><div class="notice"><b>베타 관리자 화면</b> · 현재는 서버 권한 시스템이 없는 브라우저 로컬 테스트용 신고함입니다. 실제 운영 전 관리자 인증과 서버 저장으로 교체해야 합니다.</div><div class="head"><div><h1>신고 관리</h1><p>지역글, 장터, 업체정보, 구인·구직 신고를 한곳에서 확인합니다.</p></div></div><div id="list"></div></main>
<script src="beta-store.js"></script><script>
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){const arr=RNX.adminReports(),list=document.getElementById("list");if(!arr.length){list.innerHTML='<div class="empty">접수된 신고가 없습니다.</div>';return}list.innerHTML='<div class="list">'+arr.map((r,i)=>'<article class="item '+(r.resolved?'done':'')+'"><span class="badge">'+esc(r.kind)+'</span><h3>'+esc(r.title)+'</h3><div class="meta">'+RNX.fmt(r.createdAt)+'</div><div class="reason">신고 사유: '+esc(r.reason)+'</div>'+(r.resolved?'<button disabled>확인 완료</button>':'<button data-k="'+esc(r.kind)+'" data-id="'+esc(r.itemId)+'" data-index="'+r.index+'">확인 완료 처리</button>')+'</article>').join("")+'</div>';list.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{RNX.resolveAdminReport(b.dataset.k,b.dataset.id,Number(b.dataset.index));render()})}render();
</script></body></html>
