<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>관리자 · RiderNex</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:920px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.home{font-size:13px;font-weight:900;color:#276fbe}.wrap{max-width:920px;margin:auto;padding:20px 14px 40px}.notice{padding:13px;border-radius:13px;background:#eef7ff;border:1px solid #cfe4ff;color:#365b80;font-size:12px;line-height:1.55}.head{margin-top:16px}.head h1{margin:0;font-size:25px}.head p{margin:6px 0 0;color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-size:12px;font-weight:900;white-space:nowrap}.tabs button.on{background:#eaf3ff;border-color:#9fc5fb;color:#0d67c9}.panel{margin-top:12px}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.item.done{opacity:.62}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf5ff;color:#176bc5;font-size:11px;font-weight:900}.badge.pending{background:#fff5d9;color:#8c6410}.badge.ok{background:#e8f8ef;color:#12804b}.item h3{margin:8px 0 0;font-size:15px}.meta{margin-top:5px;color:#8a95a4;font-size:11px}.reason,.body{margin-top:9px;color:#526174;font-size:12px;line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{border:1px solid #cfe0f7;background:#eef5ff;color:#176bc5;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:900;white-space:nowrap}.actions .danger{border-color:#f0c9c5;background:#fff0ee;color:#b43b31}.actions .approve{border-color:#bfe4ce;background:#edf9f2;color:#167d47}.empty,.lock{margin-top:14px;padding:26px;border:1px dashed #cbd5e1;border-radius:14px;background:#fff;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}.login{display:inline-block;margin-top:10px;padding:10px 13px;border-radius:10px;background:#0d73e6;color:#fff;font-weight:900}.count{color:#0d67c9;font-weight:900}@media(max-width:600px){.row{display:block}.badge{margin-bottom:4px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 관리자</a><a class="home" href="./">홈으로</a></div></header>
<main class="wrap">
<div class="notice"><b>실서비스 관리자</b> · 신고 검토와 업체 승인 데이터를 Supabase에서 직접 관리합니다.</div>
<div class="head"><h1>운영 관리</h1><p>일반 회원은 이 화면에 접근할 수 없습니다.</p></div>
<div class="tabs" id="tabs" style="display:none"><button class="on" data-tab="reports">신고 관리 <span id="reportCount"></span></button><button data-tab="businesses">업체 승인 <span id="businessCount"></span></button></div>
<div class="panel" id="app"><div class="empty">관리자 권한을 확인하고 있습니다.</div></div>
</main>
<script src="beta-store.js"></script><script src="supabase-adapter.js"></script><script>
const app=document.getElementById("app"),tabs=document.getElementById("tabs"),reportCount=document.getElementById("reportCount"),businessCount=document.getElementById("businessCount");
let current="reports",reports=[],businesses=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function typeLabel(t){return ({post:"지역글",comment:"댓글",market:"장터",business:"업체",job:"구인·구직",interest_post:"관심방",care_post:"정비·장비"})[t]||t}
function statusLabel(s){return ({open:"미처리",reviewed:"검토완료",resolved:"해결",dismissed:"기각"})[s]||s}
(async()=>{
  const state=await RNXRemote.init();
  if(!state.enabled||!state.user){
    app.innerHTML='<div class="lock">관리자 로그인이 필요합니다.<br><a class="login" href="auth.html">로그인</a></div>';return;
  }
  if(!RNXRemote.isAdmin()){
    app.innerHTML='<div class="lock">이 계정에는 관리자 권한이 없습니다.<br><a class="login" href="./">홈으로</a></div>';return;
  }
  tabs.style.display="flex";
  await reload();
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.tab;tabs.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));render()});
})();

async function reload(){
  try{
    [reports,businesses]=await Promise.all([RNXRemote.getAdminReports(),RNXRemote.getPendingBusinesses()]);
    reportCount.textContent="("+reports.filter(x=>x.status==="open").length+")";
    businessCount.textContent="("+businesses.length+")";
    render();
  }catch(e){app.innerHTML='<div class="empty">관리 데이터를 불러오지 못했습니다.<br>'+esc(e.message||"")+'</div>'}
}
function render(){current==="businesses"?renderBusinesses():renderReports()}
function renderReports(){
  if(!reports.length){app.innerHTML='<div class="empty">접수된 신고가 없습니다.</div>';return}
  app.innerHTML='<div class="list">'+reports.map(r=>'<article class="item '+(r.status!=="open"?"done":"")+'"><div class="row"><span class="badge">'+esc(typeLabel(r.target_type))+'</span><span class="badge '+(r.status==="open"?"pending":"ok")+'">'+esc(statusLabel(r.status))+'</span></div><h3>'+esc(r.target_title||"신고 대상")+'</h3><div class="meta">'+RNX.fmt(r.created_at)+'</div><div class="reason"><b>신고 사유</b> · '+esc(r.reason)+'</div><div class="actions">'+(r.status==="open"?'<button onclick="setReport(\''+r.id+'\',\'reviewed\')">검토완료</button><button class="approve" onclick="setReport(\''+r.id+'\',\'resolved\')">해결</button><button onclick="setReport(\''+r.id+'\',\'dismissed\')">기각</button>':'')+(['market','business','job'].includes(r.target_type)?'<button class="danger" onclick="hideTarget(\''+r.target_type+'\',\''+r.target_id+'\',\''+r.id+'\')">콘텐츠 숨김</button>':'')+'</div></article>').join("")+'</div>';
}
function renderBusinesses(){
  if(!businesses.length){app.innerHTML='<div class="empty">승인대기 업체가 없습니다.</div>';return}
  app.innerHTML='<div class="list">'+businesses.map(b=>'<article class="item"><div class="row"><span class="badge pending">승인대기</span><span class="meta">'+RNX.fmt(b.created_at)+'</span></div><h3>'+esc(b.name)+'</h3><div class="meta">'+esc(b.business_type)+' · '+esc(b.region)+'</div><div class="body">'+esc(b.body||"")+(b.address?'<br>📍 '+esc(b.address):'')+(b.phone?'<br>☎ '+esc(b.phone):'')+'</div><div class="actions"><button class="approve" onclick="approveBusiness(\''+b.id+'\',\'approved\')">승인</button><button class="danger" onclick="approveBusiness(\''+b.id+'\',\'rejected\')">거절</button></div></article>').join("")+'</div>';
}
async function setReport(id,status){try{await RNXRemote.setReportStatus(id,status);await reload()}catch(e){alert(e.message||"처리 실패")}}
async function hideTarget(type,id,reportId){if(!confirm("이 콘텐츠를 숨길까요?"))return;try{await RNXRemote.hideModeratedTarget(type,id);await RNXRemote.setReportStatus(reportId,"resolved");await reload()}catch(e){alert(e.message||"숨김 처리 실패")}}
async function approveBusiness(id,status){const word=status==="approved"?"승인":"거절";if(!confirm("이 업체를 "+word+"할까요?"))return;try{await RNXRemote.setBusinessApproval(id,status);await reload()}catch(e){alert(e.message||word+" 처리 실패")}}
</script></body></html>
