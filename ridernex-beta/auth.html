<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>회원가입·로그인 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}
a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:760px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;font-size:20px}.brand span{color:var(--blue)}
.wrap{max-width:760px;margin:auto;padding:22px 14px 40px}.notice{padding:13px 14px;border-radius:14px;background:#fff8df;border:1px solid #f1dfac;color:#74521b;font-size:11px;line-height:1.5}
.card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 28px rgba(31,60,99,.06)}h1{margin:0;font-size:27px}.sub{margin:8px 0 18px;color:var(--muted);font-size:12px;line-height:1.55}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.tabs button{padding:11px;border-radius:12px;border:1px solid var(--line);background:#f8fafc;font-weight:900}.tabs button.on{background:#eaf3ff;border-color:#9fc5fb;color:var(--blue)}
form{display:grid;gap:11px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dce3ec;border-radius:12px;background:#fff;font-size:14px;outline:0}.field input:focus,.field select:focus{border-color:#73aef2;box-shadow:0 0 0 3px rgba(13,115,230,.08)}
.submit{margin-top:4px;padding:13px;border:0;border-radius:13px;background:linear-gradient(145deg,#2589f4,#0d68d3);color:#fff;font-size:14px;font-weight:1000}.msg{min-height:20px;margin-top:10px;font-size:11px}.good{color:#087b42}.bad{color:#c0392b}.back{font-size:12px;color:#276fbe;font-weight:900}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span></a><a class="back" href="./">홈으로</a></div></header>
<main class="wrap">
<div class="notice"><b>베타 회원 기능</b> · 현재는 이 기기/브라우저 안에서만 저장되는 테스트 계정입니다. 실서비스 공개 전에는 서버 DB 인증으로 교체됩니다.</div>
<section class="card">
<h1>회원가입 · 로그인</h1><p class="sub">지역방, 내 방, 글쓰기와 댓글 기능을 실제 흐름으로 테스트합니다.</p>
<div class="tabs"><button id="tabLogin" class="on" type="button">로그인</button><button id="tabJoin" type="button">회원가입</button></div>

<form id="loginForm">
<div class="field"><label>이메일</label><input id="loginEmail" type="email" autocomplete="email" placeholder="example@email.com"></div>
<div class="field"><label>비밀번호</label><input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
<button class="submit">로그인</button>
</form>

<form id="joinForm" style="display:none">
<div class="field"><label>닉네임</label><input id="joinNick" maxlength="20" placeholder="라이더 닉네임"></div>
<div class="field"><label>이메일</label><input id="joinEmail" type="email" autocomplete="email" placeholder="example@email.com"></div>
<div class="field"><label>비밀번호</label><input id="joinPw" type="password" autocomplete="new-password" placeholder="4자 이상"></div>
<div class="field"><label>주 활동지역</label><select id="joinRegion"><option>서울 관악구</option><option>서울 동작구</option><option>서울 강남구</option><option>서울 서초구</option></select></div>
<button class="submit">회원가입하고 시작하기</button>
</form>
<div class="msg" id="msg"></div>
</section>
</main>
<script src="beta-store.js"></script>
<script>
const loginForm=document.getElementById("loginForm"),joinForm=document.getElementById("joinForm"),msg=document.getElementById("msg");
function mode(m){const l=m==="login";loginForm.style.display=l?"grid":"none";joinForm.style.display=l?"none":"grid";tabLogin.classList.toggle("on",l);tabJoin.classList.toggle("on",!l);msg.textContent="";msg.className="msg"}
tabLogin.onclick=()=>mode("login");tabJoin.onclick=()=>mode("join");
loginForm.onsubmit=async e=>{e.preventDefault();try{await RNX.login(loginEmail.value,loginPw.value);msg.textContent="로그인되었습니다. 내 방으로 이동합니다.";msg.className="msg good";setTimeout(()=>location.href="my.html",350)}catch(err){msg.textContent=err.message;msg.className="msg bad"}};
joinForm.onsubmit=async e=>{e.preventDefault();try{await RNX.register({email:joinEmail.value,password:joinPw.value,nickname:joinNick.value,region:joinRegion.value});msg.textContent="회원가입이 완료되었습니다. 내 방으로 이동합니다.";msg.className="msg good";setTimeout(()=>location.href="my.html",350)}catch(err){msg.textContent=err.message;msg.className="msg bad"}};
if(new URLSearchParams(location.search).get("mode")==="join") mode("join");
if(RNX.currentUser()){msg.textContent="현재 로그인 상태입니다. 내 방으로 이동할 수 있습니다.";msg.className="msg good"}
</script></body></html>
