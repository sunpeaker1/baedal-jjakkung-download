<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>업체정보 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.topin a:last-child{font-size:13px;font-weight:900;color:#276fbe}.wrap{max-width:980px;margin:auto;padding:20px 14px 42px}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#174fa8,#1978e7 60%,#2ba6d7);color:#fff}.hero h1{margin:0;font-size:29px}.hero p{margin:8px 0 0;font-size:14px;color:#e9f4ff;line-height:1.55}.bar{margin-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button,.action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900;white-space:nowrap}.action{background:#0d73e6;color:#fff;border-color:#0d73e6;min-width:96px;flex:0 0 auto}.form{display:none;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.form.on{display:grid;gap:9px}.form input,.form select,.form textarea{width:100%;padding:10px 11px;border:1px solid #dce3ec;border-radius:10px;background:#fff;font:inherit;font-size:13px}.form textarea{min-height:80px}.form button{justify-self:end;border:0;border-radius:10px;background:#0d73e6;color:#fff;padding:9px 13px;font-size:12px;font-weight:1000;white-space:nowrap;min-width:78px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.card h3{margin:0;font-size:14px}.meta{margin-top:5px;color:var(--muted);font-size:11px}.body{margin-top:9px;color:#526174;font-size:12px;line-height:1.5;white-space:pre-wrap}.contact{margin-top:8px;padding-top:8px;border-top:1px solid #edf1f5;color:#41556e;font-size:12px}.tools{margin-top:10px}.tools button{border:1px solid #e1e7ee;background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;color:#9b4138}.empty{margin-top:14px;padding:24px;border:1px dashed #cad5e3;border-radius:16px;background:#fff;text-align:center;color:var(--muted);font-size:13px}.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#eef7ff;border:1px solid #d5e8ff;color:#38536f;font-size:12px;line-height:1.55}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 업체정보</a><a href="./">홈으로</a></div></header>
<main class="wrap"><section class="hero"><h1>업체정보</h1><p>정비센터, 렌탈, 장비점, 배달대행·퀵업체를 지역별로 찾는 공간입니다.</p></section>
<div class="bar"><div class="filters"><button data-type="">전체</button><button data-type="정비센터">정비센터</button><button data-type="렌탈">렌탈</button><button data-type="장비점">장비점</button><button data-type="배달대행·퀵">배달대행·퀵</button></div><button class="action" id="openForm">업체 등록</button></div>
<div class="form" id="form"><select id="type"><option>정비센터</option><option>렌탈</option><option>장비점</option><option>배달대행·퀵</option><option>기타</option></select><input id="name" placeholder="업체명"><input id="region" placeholder="지역 예: 서울 관악구"><input id="phone" placeholder="연락처 (선택)"><input id="address" placeholder="주소 (선택)"><textarea id="body" placeholder="업체 소개 및 제공 서비스"></textarea><button id="submit" type="button">등록</button></div>
<div id="list"></div><div class="note"><b>공용 업체정보</b> · 등록한 업체는 RiderNex 사용자에게 함께 표시됩니다. 사업자 확인, 관리자 승인, 지도 위치와 후기 정책은 다음 단계에서 보강합니다.</div></main>
<script src="beta-store.js"></script><script src="supabase-adapter.js"></script><script>
let remote=false,filter="";const form=document.getElementById("form"),openForm=document.getElementById("openForm"),type=document.getElementById("type"),name=document.getElementById("name"),region=document.getElementById("region"),phone=document.getElementById("phone"),address=document.getElementById("address"),body=document.getElementById("body"),submit=document.getElementById("submit");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function statusText(s){return ({pending:"승인대기",approved:"승인완료",rejected:"거절",hidden:"숨김"})[s]||s||""}
(async()=>{const state=await RNXRemote.init();remote=state.enabled;await render()})();
openForm.onclick=()=>{const u=remote?RNXRemote.state.user:RNX.currentUser();if(!u){location.href="auth.html";return}form.classList.toggle("on");if(!region.value){region.value=remote?(RNXRemote.state.profile?.primary_region||""):(RNX.currentUser()?.region||"")}};
document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{filter=b.dataset.type;render()});
submit.onclick=async()=>{try{if(remote)await RNXRemote.addBusiness({type:type.value,name:name.value,region:region.value,phone:phone.value,address:address.value,body:body.value});else RNX.addBusiness({type:type.value,name:name.value,region:region.value,phone:phone.value,address:address.value,body:body.value});name.value="";phone.value="";address.value="";body.value="";form.classList.remove("on");await render()}catch(e){alert(e.message||"등록 실패")}};
async function render(){let arr=remote?await RNXRemote.getBusinesses():RNX.businesses();arr=arr.filter(x=>!filter||(x.business_type||x.type)===filter);const list=document.getElementById("list");if(!arr.length){list.innerHTML='<div class="empty">등록된 업체정보가 없습니다.</div>';return}list.innerHTML='<div class="grid">'+arr.map(x=>'<article class="card"><h3>'+esc(x.name)+'</h3><div class="meta">'+esc(x.business_type||x.type)+' · '+esc(x.region)+(x.approval_status?' · '+esc(statusText(x.approval_status)):'')+' · '+RNX.fmt(x.created_at||x.createdAt)+'</div><div class="body">'+esc(x.body)+'</div><div class="contact">'+(x.address?'📍 '+esc(x.address)+'<br>':'')+(x.phone?'☎ '+esc(x.phone):'')+'</div><div class="tools"><button onclick="reportEntry(\''+x.id+'\')">신고</button></div></article>').join("")+'</div>'}
async function reportEntry(id){const u=remote?RNXRemote.state.user:RNX.currentUser();if(!u){location.href="auth.html";return}const r=prompt("신고 사유","기타");if(r!==null){try{if(remote)await RNXRemote.report({targetType:"business",targetId:id,reason:r});else RNX.reportEntry("business",id,r);alert("신고가 접수되었습니다.")}catch(e){alert(e.message||"신고 실패")}}}
</script></body></html>
