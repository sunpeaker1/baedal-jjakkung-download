<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>정비·장비 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.home{font-size:13px;font-weight:900;color:#276fbe}.wrap{max-width:980px;margin:auto;padding:20px 14px 40px}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#174fa8,#1978e7 60%,#2ba6d7);color:#fff}.hero h1{margin:0;font-size:28px}.hero p{margin:8px 0 0;font-size:14px;color:#eaf4ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.card{display:block;background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;transition:.15s}.card:active{transform:scale(.985)}.card.on{border-color:#9fc5fb;background:#eef5ff}.card.on h3{color:#0d67c9}.card h3{margin:0;font-size:14px}.card p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.allLink{display:inline-block;margin-top:12px;padding:8px 10px;border:1px solid #cfe0f7;border-radius:10px;background:#fff;color:#176bc5;font-size:11px;font-weight:900}.form{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:grid;gap:8px}.form select,.form input,.form textarea{padding:10px;border:1px solid #dce3ec;border-radius:10px;font:inherit;font-size:12px}.form textarea{min-height:80px}.form button{justify-self:end;border:0;background:#0d73e6;color:#fff;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:900}.posts{display:grid;gap:8px;margin-top:12px}.post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.post h3{margin:0;font-size:14px}.meta{margin-top:4px;color:#8a95a4;font-size:11px}.body{margin-top:7px;color:#526174;font-size:12px;line-height:1.5}.empty{padding:20px;border:1px dashed #cbd5e1;border-radius:13px;background:#fff;text-align:center;color:var(--muted);font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 정비·장비</a><a class="home" href="./">홈으로</a></div></header>
<main class="wrap"><section class="hero"><h1>정비·장비</h1><p>정비 경험, 소모품, 계절장비와 라이더 장비 정보를 한곳에 모읍니다.</p></section>
<a class="allLink" href="care.html">📚 전체 글 보기</a><div class="grid" id="careCards"></div>
<section class="form"><select id="category"><option>정비·센터</option><option>보호장비</option><option>계절장비</option><option>거치·충전</option><option>소모품</option><option>바이크별 팁</option></select><input id="title" placeholder="제목"><textarea id="body" placeholder="정비나 장비 경험을 공유하세요."></textarea><button id="submit">글 등록</button></section><div class="posts" id="posts"></div></main>
<script src="beta-store.js"></script><script>
const categories=[
{name:"정비·센터",icon:"🔧",desc:"오일, 타이어, 브레이크, 구동계와 정비센터 경험을 공유합니다."},
{name:"보호장비",icon:"🪖",desc:"헬멧, 보호대, 장갑, 신발 등 안전장비 정보를 모읍니다."},
{name:"계절장비",icon:"🌧",desc:"우천·여름·겨울 장비와 방한·방수 정보를 공유합니다."},
{name:"거치·충전",icon:"📱",desc:"휴대폰 거치대, 충전기, 블루투스와 보조장비 정보를 모읍니다."},
{name:"소모품",icon:"🛞",desc:"타이어, 패드, 벨트, 필터 등 교체 경험과 주기를 공유합니다."},
{name:"바이크별 팁",icon:"🏍",desc:"PCX, NMAX, ADV, 전기바이크 등 기종별 관리 팁을 정리합니다."}
];
const selected=new URLSearchParams(location.search).get("category")||"";
document.getElementById("careCards").innerHTML=categories.map(x=>'<a class="card '+(selected===x.name?'on':'')+'" href="?category='+encodeURIComponent(x.name)+'"><h3>'+x.icon+' '+x.name+'</h3><p>'+x.desc+'</p></a>').join("");
const category=document.getElementById("category"),title=document.getElementById("title"),body=document.getElementById("body"),submit=document.getElementById("submit");
if(selected) category.value=selected;submit.onclick=()=>{if(!RNX.currentUser()){location.href="auth.html";return}try{RNX.addCarePost({category:category.value,title:title.value,body:body.value});title.value="";body.value="";render()}catch(e){alert(e.message)}};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){const arr=RNX.carePosts(selected||undefined),el=document.getElementById("posts");if(!arr.length){el.innerHTML='<div class="empty">'+(selected?'이 분야에 등록된 글이 없습니다.':'아직 등록된 정비·장비 글이 없습니다.')+'</div>';return}el.innerHTML=arr.map(x=>{const u=RNX.userById(x.authorId);return '<article class="post"><h3>'+esc(x.title)+'</h3><div class="meta">'+esc(x.category)+' · '+esc(u?u.nickname:"회원")+' · '+RNX.fmt(x.createdAt)+'</div><div class="body">'+esc(x.body)+'</div></article>'}).join("")}render();
</script></body></html>
