<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>관심방 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.home{font-size:13px;font-weight:900;color:#276fbe}.wrap{max-width:980px;margin:auto;padding:20px 14px 40px}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#1658bb,#1978e7 60%,#2ba6d7);color:#fff}.hero h1{margin:0;font-size:28px}.hero p{margin:8px 0 0;color:#eaf4ff;font-size:14px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.room{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.room b{font-size:14px}.room small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.room.on{border-color:#9fc5fb;background:#f2f7ff}.panel{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.panel h2{margin:0;font-size:19px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:900}.actions .join{background:#0d73e6;border-color:#0d73e6;color:#fff}.compose{display:none;margin-top:10px;gap:8px}.compose.on{display:grid}.compose input,.compose textarea{padding:9px;border:1px solid #dce3ec;border-radius:9px;font:inherit;font-size:12px}.compose textarea{min-height:80px}.compose button{justify-self:end;border:0;background:#0d73e6;color:#fff;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:900}.posts{display:grid;gap:8px;margin-top:12px}.post{border:1px solid #e7ebf1;border-radius:12px;padding:11px}.post h3{margin:0;font-size:14px}.meta{margin-top:4px;color:#8a95a4;font-size:11px}.body{margin-top:7px;color:#526174;font-size:12px;line-height:1.5}.empty{padding:18px;border:1px dashed #cbd5e1;border-radius:12px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:760px){.rooms{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:24px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 관심방</a><a class="home" href="./">홈으로</a></div></header>
<main class="wrap"><section class="hero"><h1>관심방</h1><p>바이크, 플랫폼, 장비와 라이더 관심사별로 모이는 공간입니다.</p></section><div class="rooms" id="rooms"></div><section class="panel" id="panel"></section></main>
<script src="beta-store.js"></script><script>
const roomNames=["PCX","NMAX","ADV","전기바이크","쿠팡이츠","배민","카카오퀵","퀵 라이더","장비","정비","초보 라이더","수익관리"],params=new URLSearchParams(location.search);let current=params.get("room")||roomNames[0];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderRooms(){rooms.innerHTML=roomNames.map(r=>'<a class="room '+(r===current?'on':'')+'" href="?room='+encodeURIComponent(r)+'"><b>'+esc(r)+'</b><small>참여 '+RNX.interestMemberCount(r)+'명</small></a>').join("")}
function renderPanel(){const member=RNX.isInterestMember(current),u=RNX.currentUser(),posts=RNX.interestPosts(current);panel.innerHTML='<h2>'+esc(current)+' 관심방</h2><div class="actions">'+(member?'<button id="leave">관심방 나가기</button>':'<button class="join" id="join">관심방 참여</button>')+'</div><div class="compose '+(member?'on':'')+'" id="compose"><input id="title" placeholder="제목"><textarea id="body" placeholder="관심방에 공유할 내용을 입력하세요."></textarea><button id="submit">글 등록</button></div><div class="posts" id="posts">'+(posts.length?posts.map(p=>{const au=RNX.userById(p.authorId);return '<article class="post"><h3>'+esc(p.title)+'</h3><div class="meta">'+esc(au?au.nickname:"회원")+' · '+RNX.fmt(p.createdAt)+'</div><div class="body">'+esc(p.body)+'</div></article>'}).join(""):'<div class="empty">아직 등록된 글이 없습니다.</div>')+'</div>';
if(document.getElementById("join"))join.onclick=()=>{if(!u){location.href="auth.html";return}RNX.joinInterest(current);renderRooms();renderPanel()};
if(document.getElementById("leave"))leave.onclick=()=>{RNX.leaveInterest(current);renderRooms();renderPanel()};
if(document.getElementById("submit"))submit.onclick=()=>{try{RNX.addInterestPost({room:current,title:title.value,body:body.value});renderPanel()}catch(e){alert(e.message)}}}
renderRooms();renderPanel();
</script></body></html>
