<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>라이더 지도 · RiderNex 베타</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:1120px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.topin a:last-child{font-size:13px;font-weight:900;color:#276fbe}
.wrap{max-width:1120px;margin:auto;padding:18px 14px 38px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.hero h1{margin:0;font-size:27px}.hero p{margin:6px 0 0;color:var(--muted);font-size:13px}.locate{border:0;background:#0d73e6;color:#fff;border-radius:11px;padding:10px 12px;font-size:12px;font-weight:1000}
.layout{display:grid;grid-template-columns:1.55fr .75fr;gap:12px}.mapCard,.side{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.mapToolbar{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap}.mapToolbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font-size:11px;font-weight:900}.mapToolbar button.on{background:#eaf3ff;border-color:#a9cafa;color:var(--blue)}#map{height:500px}
.side{padding:14px}.side h2{margin:0;font-size:16px}.side p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.list{display:grid;gap:8px;margin-top:12px}.entry{display:block;border:1px solid #e8edf3;border-radius:13px;padding:11px}.entry b{font-size:13px}.entry small{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.empty{padding:18px;border:1px dashed #cad5e3;border-radius:13px;text-align:center;color:var(--muted);font-size:12px}.note{margin-top:12px;padding:11px;border-radius:12px;background:#eef7ff;border:1px solid #d5e8ff;color:#38536f;font-size:11px;line-height:1.5}
@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{align-items:flex-start}.hero h1{font-size:24px}#map{height:390px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 지도</a><a href="./">홈으로</a></div></header>
<main class="wrap"><div class="hero"><div><h1>라이더 지도</h1><p>관악구 지역방과 라이더 관련 장소를 지도 중심으로 연결합니다.</p></div><button class="locate" id="locate" type="button">내 위치 보기</button></div>
<div class="layout">
<section class="mapCard"><div class="mapToolbar"><button class="on" data-filter="all">전체</button><button data-filter="region">지역방</button><button data-filter="business">업체</button><button data-filter="job">일자리</button></div><div id="map"></div></section>
<aside class="side"><h2>지도 연결 정보</h2><p>현재 베타에서는 관악구 지역방을 실제 지도에 표시하고, 등록한 업체·구인정보는 옆 목록에서 확인합니다.</p><div class="list" id="list"></div><div class="note"><b>다음 단계</b> · 업체 등록 시 지도에서 위치를 찍도록 하면 등록 업체도 실제 핀으로 표시할 수 있습니다.</div></aside>
</div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="beta-store.js"></script><script>
const map=L.map("map").setView([37.4784,126.9516],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers={region:[],business:[],job:[]};
const g=L.marker([37.4784,126.9516]).bindPopup('<b>관악구 라이더방</b><br><a href="region.html?city=seoul&district=gwanak">지역방 열기</a>').addTo(map);markers.region.push(g);
let me=null;
locate.onclick=()=>{if(!navigator.geolocation){alert("이 브라우저에서는 위치 기능을 사용할 수 없습니다.");return}navigator.geolocation.getCurrentPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude];if(me)map.removeLayer(me);me=L.marker(p).addTo(map).bindPopup("현재 위치").openPopup();map.setView(p,16)},()=>alert("위치 권한을 허용하면 현재 위치를 지도에 표시할 수 있습니다."),{enableHighAccuracy:true,timeout:8000})};
const businesses=RNX.businesses(),jobs=RNX.jobs(),list=document.getElementById("list");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderList(filter="all"){let html="";if(filter==="all"||filter==="region")html+='<a class="entry" href="region.html?city=seoul&district=gwanak"><b>📍 관악구 라이더방</b><small>지역 현장정보 · 도로·교통 · 지역 Q&A</small></a>';if(filter==="all"||filter==="business")businesses.forEach(x=>html+='<a class="entry" href="business.html"><b>🏪 '+esc(x.name)+'</b><small>'+esc(x.region)+' · '+esc(x.type)+(x.address?' · '+esc(x.address):'')+'</small></a>');if(filter==="all"||filter==="job")jobs.forEach(x=>html+='<a class="entry" href="jobs.html"><b>💼 '+esc(x.title)+'</b><small>'+esc(x.region)+' · '+esc(x.kind)+'</small></a>');list.innerHTML=html||'<div class="empty">표시할 정보가 없습니다.</div>'}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("on"));b.classList.add("on");renderList(b.dataset.filter);Object.entries(markers).forEach(([k,arr])=>arr.forEach(m=>{const show=b.dataset.filter==="all"||b.dataset.filter===k;if(show&&!map.hasLayer(m))m.addTo(map);if(!show&&map.hasLayer(m))map.removeLayer(m)}))});
renderList();
</script></body></html>
