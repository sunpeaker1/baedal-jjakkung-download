<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>라이더장터 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.topin a:last-child{font-size:11px;font-weight:900;color:#276fbe}.wrap{max-width:980px;margin:auto;padding:20px 14px 42px}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#1658bb,#1978e7 60%,#2ba6d7);color:#fff}.hero h1{margin:0;font-size:29px}.hero p{margin:8px 0 0;font-size:12px;color:#e9f4ff;line-height:1.55}.bar{margin-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button,.action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:900}.action{background:#0d73e6;color:#fff;border-color:#0d73e6}.form{display:none;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.form.on{display:grid;gap:9px}.form input,.form select,.form textarea{width:100%;padding:10px 11px;border:1px solid #dce3ec;border-radius:10px;background:#fff;font:inherit;font-size:11px}.form textarea{min-height:80px}.form button{justify-self:end;border:0;border-radius:10px;background:#0d73e6;color:#fff;padding:9px 13px;font-size:10px;font-weight:1000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.card h3{margin:0;font-size:14px}.price{margin-top:7px;font-size:16px;font-weight:1000}.meta{margin-top:5px;color:var(--muted);font-size:9px}.body{margin-top:9px;color:#526174;font-size:10px;line-height:1.5;white-space:pre-wrap}.tools{margin-top:10px}.tools button{border:1px solid #e1e7ee;background:#fff;border-radius:8px;padding:6px 8px;font-size:9px;color:#9b4138}.empty{margin-top:14px;padding:24px;border:1px dashed #cad5e3;border-radius:16px;background:#fff;text-align:center;color:var(--muted);font-size:11px}.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#eef7ff;border:1px solid #d5e8ff;color:#38536f;font-size:10px;line-height:1.55}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 장터</a><a href="./">홈으로</a></div></header>
<main class="wrap"><section class="hero"><h1>라이더장터</h1><p>바이크부터 장비·용품까지 전국 매물을 보고, 지역은 추천과 필터로 활용합니다.</p></section>
<div class="bar"><div class="filters"><button data-cat="">전체</button><button data-cat="오토바이">오토바이</button><button data-cat="전기이동수단">전기이동수단</button><button data-cat="장비">장비</button><button data-cat="부품·소모품">부품·소모품</button></div><button class="action" id="openForm">매물 등록</button></div>
<div class="form" id="form"><select id="category"><option>오토바이</option><option>전기이동수단</option><option>장비</option><option>부품·소모품</option><option>기타</option></select><input id="title" placeholder="매물 제목"><input id="price" inputmode="numeric" placeholder="가격"><input id="region" placeholder="지역 예: 서울 관악구"><select id="condition"><option>중고</option><option>새상품</option></select><textarea id="body" placeholder="상태, 거래방법 등 설명"></textarea><button id="submit" type="button">등록</button></div>
<div id="list"></div><div class="note"><b>베타 장터</b> · 지금은 이 브라우저에 등록한 매물만 보입니다. 실서비스에서는 서버 DB, 사진 업로드, 거래상태, 사업자 표시와 신고 관리가 연결됩니다.</div></main>
<script src="beta-store.js"></script><script>
let filter="";const form=document.getElementById("form");openForm.onclick=()=>{if(!RNX.currentUser()){location.href="auth.html";return}form.classList.toggle("on");if(!region.value)region.value=RNX.currentUser().region||""};
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});
submit.onclick=()=>{try{RNX.addMarket({category:category.value,title:title.value,price:price.value,region:region.value,condition:condition.value,body:body.value});title.value="";price.value="";body.value="";form.classList.remove("on");render()}catch(e){alert(e.message)}};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){const arr=RNX.marketItems().filter(x=>!filter||x.category===filter),list=document.getElementById("list");if(!arr.length){list.innerHTML='<div class="empty">등록된 매물이 없습니다.</div>';return}list.innerHTML='<div class="grid">'+arr.map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><div class="price">'+Number(x.price).toLocaleString("ko-KR")+'원</div><div class="meta">'+esc(x.category)+' · '+esc(x.region)+' · '+esc(x.condition)+' · '+RNX.fmt(x.createdAt)+'</div><div class="body">'+esc(x.body)+'</div><div class="tools"><button onclick="reportEntry(\''+x.id+'\')">신고</button></div></article>').join("")+'</div>'}
function reportEntry(id){if(!RNX.currentUser()){location.href="auth.html";return}const r=prompt("신고 사유","기타");if(r!==null){try{RNX.reportEntry("market",id,r);alert("신고가 접수되었습니다.")}catch(e){alert(e.message)}}}render();
</script></body></html>
