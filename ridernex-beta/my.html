<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>내 방 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:900px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;font-size:20px}.brand span{color:var(--blue)}
.actions{display:flex;gap:8px}.actions a,.actions button{padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:900;color:#31506f}
.wrap{max-width:900px;margin:auto;padding:20px 14px 40px}.profile{padding:22px;border-radius:22px;background:linear-gradient(135deg,#1658bb,#1978e7 60%,#2ba6d7);color:#fff;box-shadow:0 10px 28px rgba(31,60,99,.08)}
.avatar{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:27px;border:1px solid rgba(255,255,255,.22)}.profile h1{margin:12px 0 0;font-size:27px}.profile p{margin:7px 0 0;color:#e8f2ff;font-size:14px}.profileMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.profileMeta span{padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.13);font-size:12px;font-weight:900}
.section{margin-top:18px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.title h2{margin:0;font-size:20px}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}.title a{font-size:13px;color:#246dbb;font-weight:900}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{display:block;background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;transition:.15s}.card:active{transform:scale(.985);background:#f4f8fd}.card b{display:block;font-size:14px}.card small{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}
.posts{display:grid;gap:9px}.post{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;transition:.15s}.post:active{transform:scale(.99);background:#f7faff}.postHead{display:flex;justify-content:space-between;gap:10px;align-items:start}.post h3{margin:0;font-size:14px}.post time{font-size:11px;color:#98a2b3}.post p{margin:7px 0 0;color:#556276;font-size:13px;line-height:1.5}.tag{display:inline-block;margin-top:8px;padding:5px 7px;border-radius:999px;background:#edf5ff;color:#176bc5;font-size:11px;font-weight:900}
.empty{padding:22px;text-align:center;border:1px dashed #cad5e3;border-radius:16px;color:var(--muted);background:#fafbfd;font-size:13px;line-height:1.55}
.lock{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}.lock h1{margin:0;font-size:23px}.lock p{color:var(--muted);font-size:14px;line-height:1.5}.loginBtn{display:inline-block;margin-top:10px;padding:11px 15px;background:#0d73e6;color:#fff;border-radius:12px;font-weight:900;font-size:14px}
@media(max-width:700px){.cards{grid-template-columns:1fr}.profile h1{font-size:24px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span></a><div class="actions"><a href="region.html?city=seoul&district=gwanak">지역방</a><button id="logoutBtn" type="button">로그아웃</button></div></div></header>
<main class="wrap" id="app"></main>
<script src="beta-store.js"></script><script src="region-data.js"></script>
<script>
const app=document.getElementById("app"),logoutBtn=document.getElementById("logoutBtn"),u=RNX.currentUser();
if(!u){
  logoutBtn.style.display="none";
  app.innerHTML='<section class="lock"><h1>내 방은 로그인 후 사용할 수 있습니다.</h1><p>회원가입 후 프로필, 활동지역과 작성글을 한곳에서 확인합니다.</p><a class="loginBtn" href="auth.html">로그인 · 회원가입</a></section>';
}else{
  const mine=RNX.myPosts(),activityHref=regionHref(u.region);
  app.innerHTML=`
  <section class="profile"><div class="avatar">👤</div><h1>${u.nickname}님의 방</h1><p>라이더넥스 베타 개인 라이더홈입니다.</p><div class="profileMeta"><span>📍 ${u.region||"활동지역 미설정"}</span><span>✍️ 작성글 ${mine.length}개</span></div></section>
  <section class="section"><div class="title"><div><h2>내 라이더홈</h2><p>카드를 누르면 해당 공간으로 바로 이동합니다.</p></div></div><div class="cards"><a class="card" href="${activityHref}"><b>📍 활동지역</b><small>${u.region||"지역정보 보기"}</small></a><a class="card" href="care.html?category=${encodeURIComponent("바이크별 팁")}"><b>🛵 바이크</b><small>기종별 관리 팁과 정비정보 보기</small></a><a class="card" href="interests.html"><b>⭐ 관심방</b><small>참여 중인 관심사를 둘러보기</small></a></div></section>
  <section class="section"><div class="title"><div><h2>내가 쓴 글</h2><p>지역방에서 작성한 글을 확인합니다.</p></div><a href="region.html?city=seoul&district=gwanak">글쓰러 가기 ›</a></div><div class="posts" id="postList"></div></section>`;
  const list=document.getElementById("postList");
  if(!mine.length) list.innerHTML='<div class="empty">아직 작성한 글이 없습니다.<br>관악구 라이더방에서 첫 글을 작성해보세요.</div>';
  else mine.forEach(p=>{const el=document.createElement("a");el.className="post";el.href=regionHref(p.region)+(regionHref(p.region).includes("?")?"&":"?")+"category="+encodeURIComponent(p.category||"");el.innerHTML='<div class="postHead"><h3>'+esc(p.title)+'</h3><time>'+RNX.fmt(p.createdAt)+'</time></div><p>'+esc(p.body)+'</p><span class="tag">'+esc(p.category)+'</span>';list.appendChild(el)});
}
logoutBtn.onclick=()=>{RNX.logout();location.href="./"};
function regionHref(region){
  const value=String(region||"");
  if(value.includes("관악구"))return "region.html?city=seoul&district=gwanak";
  if(window.RNX_REGION_DATA){
    for(const city of RNX_REGION_DATA){
      const cityKey=city.name.replace(/특별시|광역시|특별자치시|특별자치도|도$/g,"");
      for(const district of city.districts){
        if(value.includes(district)&&(value.includes(city.name)||value.includes(cityKey)))return "region.html?city="+city.slug+"&district="+encodeURIComponent(district);
      }
    }
  }
  return "region.html";
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
