<script>
const app=document.getElementById("app");let home=null,isOwner=false,records=[],albums=[],photos=[],activeAlbumId=null,cropState=null,cropObjectUrl=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function address(h){return h.life_region+" "+h.room_name+" "+h.road_no+"길"+h.house_no}
function fmtRecordDate(v){try{return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(v))}catch{return ""}}
function visibilityText(v){return v==="private"?"나만보기":v==="friends"?"친구공개":"전체공개"}
function recordsHtml(){
 if(!records.length)return '<div class="empty">아직 기록이 없습니다.</div>';
 return records.map(r=>'<article class="recordItem"><h3>'+esc(r.title)+'</h3><div class="recordMeta"><span>'+fmtRecordDate(r.created_at)+'</span><span class="privacy">'+visibilityText(r.visibility)+'</span></div><div class="recordBody" id="recordBody-'+r.id+'">'+esc(r.body)+'</div><button class="recordMore" data-record-more="'+r.id+'">더보기</button></article>').join("");
}
function albumFor(id){return albums.find(a=>a.id===id)||null}
function albumPhotos(id){return photos.filter(p=>p.album_id===id)}
function albumCover(id){const list=albumPhotos(id);return list.length?list[0].image_url:""}
function albumsGridHtml(){
 if(!albums.length)return '<div class="empty">아직 만든 앨범이 없습니다.</div>';
 return '<div class="albumGrid">'+albums.map(a=>{const cover=albumCover(a.id),count=albumPhotos(a.id).length;return '<article class="albumCard" data-album-id="'+a.id+'"><div class="albumThumb">'+(cover?'<img src="'+esc(cover)+'" alt="">':'📷')+'</div><div class="albumInfo"><strong>'+esc(a.title)+'</strong><div class="albumMeta"><span>'+count+'장</span><span>·</span><span>'+visibilityText(a.visibility)+'</span></div></div></article>'}).join("")+'</div>';
}
function photosPanelHtml(){
 const active=albumFor(activeAlbumId);
 if(active){
  const list=albumPhotos(active.id);
  return '<div class="card"><div class="albumTop"><button class="albumBack" id="albumBack">← 앨범 목록</button>'+(isOwner?'<button class="writeBtn" id="photoAdd">+ 사진 추가</button>':'')+'</div><h2>'+esc(active.title)+'</h2><p>'+visibilityText(active.visibility)+' · '+list.length+'장</p>'+(isOwner?'<input class="pickerHidden" id="albumPhotoPicker" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="uploadState" id="photoUploadState"></div>':'')+(list.length?'<div class="photoGrid">'+list.map(p=>'<button class="photoTile" data-photo-id="'+p.id+'"><img src="'+esc(p.image_url)+'" alt=""></button>').join("")+'</div>':'<div class="empty">아직 이 앨범에 사진이 없습니다.</div>')+'</div>';
 }
 return '<div class="card"><div class="photosHead"><div><h2>사진</h2><p>앨범으로 사진을 모아두는 공간입니다.</p></div>'+(isOwner?'<button class="writeBtn" id="albumCreateToggle">+ 앨범 만들기</button>':'')+'</div>'+(isOwner?'<div class="albumComposer" id="albumComposer"><div class="form"><div class="field"><label>앨범 이름</label><input id="albumTitle" maxlength="60" placeholder="예: 라이더넥스 제작 기록"></div><div class="field"><label>공개범위</label><select id="albumVisibility"><option value="public">전체공개</option><option value="private">나만보기</option></select></div><button class="save" id="albumCreate">앨범 만들기</button><button class="secondary" id="albumCancel" type="button">취소</button><div class="status" id="albumState"></div></div></div>':'')+albumsGridHtml()+'</div>';
}
async function albumPhotoBlob(file){
 const allowed=["image/jpeg","image/png","image/webp"];
 if(!file||!allowed.includes(file.type))throw new Error("JPG, PNG, WEBP 이미지만 올릴 수 있습니다.");
 if(file.size>20*1024*1024)throw new Error("원본 사진은 한 장당 20MB 이하만 선택해주세요.");
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error("사진을 불러오지 못했습니다."));im.src=url});
  const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d",{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(img,0,0,w,h);
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("사진을 처리하지 못했습니다.")),"image/webp",.84));
 }finally{URL.revokeObjectURL(url)}
}
function panel(name){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===name));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.dataset.panel===name))}
function clamp(v,min,max){return Math.min(max,Math.max(min,v))}
function closeCrop(){
 const modal=document.getElementById("cropModal");if(modal)modal.classList.remove("on");
 if(cropObjectUrl){URL.revokeObjectURL(cropObjectUrl);cropObjectUrl=null}
 cropState=null;
}
function positionCrop(){
 if(!cropState)return;const imgEl=document.getElementById("cropPreviewImg");if(!imgEl)return;
 imgEl.style.width=cropState.dw+"px";imgEl.style.height=cropState.dh+"px";imgEl.style.left=cropState.x+"px";imgEl.style.top=cropState.y+"px";
 const zoomEl=document.getElementById("cropZoom");if(zoomEl)zoomEl.value=String(cropState.zoom||1);
}
function constrainCrop(){
 if(!cropState)return;const c=cropState;
 const dx=c.fw-c.dw,dy=c.fh-c.dh;
 c.x=clamp(c.x,Math.min(0,dx),Math.max(0,dx));
 c.y=clamp(c.y,Math.min(0,dy),Math.max(0,dy));
}
function applyCropZoom(nextZoom,focusX,focusY){
 if(!cropState)return;
 const c=cropState,z=clamp(Number(nextZoom)||1,c.minZoom||1,4),fx=Number.isFinite(focusX)?focusX:c.fw/2,fy=Number.isFinite(focusY)?focusY:c.fh/2;
 const imageX=(fx-c.x)/c.scale,imageY=(fy-c.y)/c.scale;
 c.zoom=z;c.scale=c.baseScale*z;c.dw=c.img.naturalWidth*c.scale;c.dh=c.img.naturalHeight*c.scale;
 c.x=fx-imageX*c.scale;c.y=fy-imageY*c.scale;constrainCrop();positionCrop();
}
function beginCrop(kind,file){
 const allowed=["image/jpeg","image/png","image/webp"];
 if(!file||!allowed.includes(file.type)){alert("JPG, PNG, WEBP 이미지만 사용할 수 있습니다.");return}
 if(file.size>20*1024*1024){alert("원본 사진은 20MB 이하만 선택해주세요.");return}
 const modal=document.getElementById("cropModal"),frame=document.getElementById("cropFrame"),title=document.getElementById("cropTitle"),imgEl=document.getElementById("cropPreviewImg"),bgEl=document.getElementById("cropBackdrop"),zoomEl=document.getElementById("cropZoom");
 if(!modal||!frame||!imgEl)return;closeCrop();cropObjectUrl=URL.createObjectURL(file);
 title.textContent=kind==="profile"?"프로필 사진 맞추기":"커버 사진 맞추기";
 frame.className="cropFrame "+(kind==="profile"?"profileMode":"coverMode");modal.classList.add("on");
 const img=new Image();img.onload=()=>{requestAnimationFrame(()=>{const fw=frame.clientWidth,fh=frame.clientHeight,coverScale=Math.max(fw/img.naturalWidth,fh/img.naturalHeight),containScale=Math.min(fw/img.naturalWidth,fh/img.naturalHeight),minZoom=kind==="cover"?Math.max(.08,(containScale/coverScale)*.45):1,baseScale=coverScale,scale=baseScale,dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;cropState={kind,file,img,fw,fh,baseScale,minZoom,zoom:1,scale,dw,dh,x:(fw-dw)/2,y:(fh-dh)/2,drag:false};imgEl.src=cropObjectUrl;if(bgEl)bgEl.src=cropObjectUrl;if(zoomEl){zoomEl.min=String(minZoom);zoomEl.value="1"}positionCrop()})};img.src=cropObjectUrl;
}
async function autoCoverBlob(file){
 const allowed=["image/jpeg","image/png","image/webp"];
 if(!file||!allowed.includes(file.type))throw new Error("JPG, PNG, WEBP 이미지만 사용할 수 있습니다.");
 if(file.size>20*1024*1024)throw new Error("원본 사진은 20MB 이하만 선택해주세요.");
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error("사진을 불러오지 못했습니다."));im.src=url});
  const canvas=document.createElement("canvas"),w=1600,h=420;canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.fillStyle="#101722";ctx.fillRect(0,0,w,h);
  const bgScale=Math.max(w/img.naturalWidth,h/img.naturalHeight),bw=img.naturalWidth*bgScale,bh=img.naturalHeight*bgScale,bx=(w-bw)/2,by=(h-bh)/2;
  ctx.save();ctx.filter="blur(26px) brightness(0.66)";ctx.drawImage(img,bx-24,by-24,bw+48,bh+48);ctx.restore();
  const fgScale=Math.min(w/img.naturalWidth,h/img.naturalHeight),fw=img.naturalWidth*fgScale,fh=img.naturalHeight*fgScale,fx=(w-fw)/2,fy=(h-fh)/2;
  ctx.drawImage(img,fx,fy,fw,fh);
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("커버 사진을 처리하지 못했습니다.")),"image/webp",.86));
 }finally{URL.revokeObjectURL(url)}
}
async function croppedBlob(){
 if(!cropState)throw new Error("사진을 다시 선택하세요.");
 const c=cropState,target=c.kind==="profile"?{w:720,h:720}:{w:1600,h:420};
 const canvas=document.createElement("canvas");canvas.width=target.w;canvas.height=target.h;
 const ctx=canvas.getContext("2d",{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
 if(c.kind==="cover"){
   ctx.fillStyle="#101722";ctx.fillRect(0,0,target.w,target.h);
   const bgScale=Math.max(target.w/c.img.naturalWidth,target.h/c.img.naturalHeight),bw=c.img.naturalWidth*bgScale,bh=c.img.naturalHeight*bgScale,bx=(target.w-bw)/2,by=(target.h-bh)/2;
   ctx.save();ctx.filter="blur(24px) brightness(0.68)";ctx.drawImage(c.img,bx-18,by-18,bw+36,bh+36);ctx.restore();
   const rx=target.w/c.fw,ry=target.h/c.fh;ctx.drawImage(c.img,c.x*rx,c.y*ry,c.dw*rx,c.dh*ry);
 }else{
   const sx=-c.x/c.scale,sy=-c.y/c.scale,sw=c.fw/c.scale,sh=c.fh/c.scale;ctx.drawImage(c.img,sx,sy,sw,sh,0,0,target.w,target.h);
 }
 return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("사진을 처리하지 못했습니다.")),"image/webp",.84));
}
(async()=>{
 const s=await RNXRemote.init();if(!s.enabled){app.innerHTML='<div class="locked"><h2>서버 연결을 확인할 수 없습니다.</h2><p>잠시 후 다시 시도하세요.</p></div>';return}
 const id=new URLSearchParams(location.search).get("id");
 try{home=id?await RNXRemote.getNexHomeById(id):await RNXRemote.getMyNexHome()}catch{}
 if(!home){app.innerHTML='<div class="locked"><h2>NexHome을 찾을 수 없습니다.</h2><p>비공개이거나 아직 만들어지지 않은 공간입니다.</p><a href="./">RiderNex 홈으로</a></div>';return}
 isOwner=!!(s.user&&s.user.id===home.owner_id);
 try{records=await RNXRemote.getNexHomeRecords(home.id)}catch{records=[]}
 try{albums=await RNXRemote.getNexHomeAlbums(home.id)}catch{albums=[]}
 try{photos=await RNXRemote.getNexHomePhotos(home.id)}catch{photos=[]}
 render();
 if(isOwner&&home.first_visit){try{await RNXRemote.finishNexHomeFirstVisit(home.id)}catch{}}
})();
function render(){
 document.body.dataset.theme=home.theme||"light";const nick=home.profiles?.nickname||"라이더";
 app.innerHTML=`
 <section class="cover${isOwner?' editTap':''}" id="coverEdit">${home.cover_url?'<img class="coverImg" src="'+esc(home.cover_url)+'" alt="NexHome 커버">':''}</section>
 <section class="profileCard"><div class="avatar${isOwner?' editTap':''}" id="profileEdit">${home.profile_url?'<img src="'+esc(home.profile_url)+'" alt="프로필 사진">':'👤'}${isOwner?'<span class="avatarEdit">📷</span>':''}</div><div class="profile"><h1>${esc(home.room_name)}</h1><p>${esc(home.intro||"오늘도 안전하게 달립니다.")}</p><div class="addr">📍 ${esc(address(home))} · 집주인 ${esc(nick)}</div></div>${isOwner?'<span class="ownerBadge">내 NexHome</span>':''}</section>
 <nav class="tabs"><button class="on" data-tab="home">홈</button><button data-tab="records">기록</button><button data-tab="photos">사진</button><button data-tab="guestbook">방명록</button><button data-tab="friends">친구</button>${isOwner?'<button data-tab="style">꾸미기</button>':''}</nav>
 <section class="panel on" data-panel="home"><div class="grid"><article class="card"><h2>${esc(home.room_name)}에 오신 것을 환영합니다.</h2><p>${esc(home.intro||"오늘도 안전하게 달립니다.")}</p><div class="mini"><div>📝 최근 기록 · ${records.length?esc(records[0].title):"아직 없음"}</div><div>📷 최근 사진 · ${photos.length?(esc(albumFor(photos[0].album_id)?.title||"사진")+" · "+photos.length+"장"):"아직 없음"}</div><div>💬 방명록 · 아직 없음</div></div></article><article class="card"><h3>NexHome 정보</h3><p><b>생활권</b><br>${esc(home.life_region)}</p><p><b>주소</b><br>${esc(home.road_no+"길"+home.house_no)}</p><p><b>입장범위</b><br>${home.entry_scope==="public"?"전체 입장":home.entry_scope==="friends"?"친구만 입장":"나만 입장"}</p></article></div></section>
 <section class="panel" data-panel="records"><div class="card"><div class="recordsHead"><div><h2>기록</h2><p>개인 일상, 배달 이야기, 바이크, 후기와 생각을 쌓는 공간입니다.</p></div>${isOwner?'<button class="writeBtn" id="recordWrite">+ 기록 쓰기</button>':''}</div>${isOwner?'<div class="recordComposer" id="recordComposer"><div class="form"><div class="field"><label>제목</label><input id="recordTitle" maxlength="120" placeholder="오늘의 기록 제목"></div><div class="field"><label>내용</label><textarea id="recordBody" maxlength="12000" placeholder="라이더 생활과 생각을 자유롭게 남겨보세요."></textarea></div><div class="field"><label>공개범위</label><select id="recordVisibility"><option value="public">전체공개</option><option value="private">나만보기</option></select></div><button class="save" id="recordSave">기록 남기기</button><button class="secondary" id="recordCancel" type="button">취소</button><div class="status" id="recordState"></div></div></div>':''}<div class="recordList">${recordsHtml()}</div></div></section>
 <section class="panel" data-panel="photos">${photosPanelHtml()}</section>
 <section class="panel" data-panel="guestbook"><div class="card"><h2>방명록</h2><p>친구와 방문자가 남기는 카드형 방명록 공간입니다.</p><div class="empty">${home.guestbook_scope==="off"?"방명록을 사용하지 않는 NexHome입니다.":"아직 남겨진 방명록이 없습니다."}</div></div></section>
 <section class="panel" data-panel="friends"><div class="card"><h2>친구</h2><p>친구 신청·수락 후 서로의 NexHome을 방문하는 공간입니다.</p><div class="empty">아직 표시할 친구가 없습니다.</div></div></section>
 ${isOwner?`<section class="panel" data-panel="style"><div class="card"><h2>기본 꾸미기</h2><p>복잡한 편집 대신 핵심 요소만 간단하게 바꿉니다.</p><div class="form"><div class="mediaManage"><b>프로필 · 커버 사진</b><p>사진 자체를 눌러도 변경할 수 있습니다.</p><div class="photoRows"><div class="photoRow"><strong>프로필 사진</strong><button class="secondary" id="profileManage" type="button">${home.profile_url?"변경":"추가"}</button>${home.profile_url?'<button class="secondary danger" id="deleteProfile" type="button">삭제</button>':'<span></span>'}</div><div class="photoRow"><strong>커버 사진</strong><button class="secondary" id="coverManage" type="button">${home.cover_url?"변경":"추가"}</button>${home.cover_url?'<button class="secondary danger" id="deleteCover" type="button">삭제</button>':'<span></span>'}</div></div></div><div class="field"><label>한 줄 소개</label><input id="intro" maxlength="80" value="${esc(home.intro||"")}"></div><div class="field"><label>기본 테마</label><select id="theme"><option value="light">밝은형</option><option value="blue">블루형</option><option value="dark">어두운형</option></select></div><div class="field"><label>NexHome 입장범위</label><select id="entry"><option value="public">전체 입장</option><option value="friends">친구만 입장</option><option value="private">나만 입장</option></select></div><div class="field"><label>방명록 작성범위</label><select id="guestbook"><option value="all">누구나 작성 가능</option><option value="friends">친구만 작성 가능</option><option value="off">방명록 사용 안 함</option></select></div><button class="save" id="save">저장</button><div class="status" id="saveState"></div></div></div></section>`:""}`;
 app.insertAdjacentHTML("beforeend",'<div class="photoLightbox" id="photoLightbox"><button id="photoLightboxClose" type="button">×</button><img id="photoLightboxImg" alt=""></div>');
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>panel(b.dataset.tab));
 document.querySelectorAll("[data-record-more]").forEach(btn=>btn.onclick=()=>{const body=document.getElementById("recordBody-"+btn.dataset.recordMore);if(!body)return;body.classList.toggle("open");btn.textContent=body.classList.contains("open")?"접기":"더보기"});
 document.querySelectorAll("[data-album-id]").forEach(el=>el.onclick=()=>{activeAlbumId=el.dataset.albumId;render();panel("photos")});
 const albumBackEl=document.getElementById("albumBack");if(albumBackEl)albumBackEl.onclick=()=>{activeAlbumId=null;render();panel("photos")};
 const lightbox=document.getElementById("photoLightbox"),lightboxImg=document.getElementById("photoLightboxImg"),lightboxClose=document.getElementById("photoLightboxClose");
 document.querySelectorAll("[data-photo-id]").forEach(el=>el.onclick=()=>{const p=photos.find(x=>x.id===el.dataset.photoId);if(!p)return;lightboxImg.src=p.image_url;lightbox.classList.add("on")});
 if(lightboxClose)lightboxClose.onclick=()=>lightbox.classList.remove("on");if(lightbox)lightbox.onclick=e=>{if(e.target===lightbox)lightbox.classList.remove("on")};
 if(isOwner){
   const albumToggle=document.getElementById("albumCreateToggle"),albumComposer=document.getElementById("albumComposer"),albumCancel=document.getElementById("albumCancel"),albumCreate=document.getElementById("albumCreate");
   if(albumToggle&&albumComposer)albumToggle.onclick=()=>{albumComposer.classList.toggle("on");albumToggle.textContent=albumComposer.classList.contains("on")?"닫기":"+ 앨범 만들기"};
   if(albumCancel&&albumComposer&&albumToggle)albumCancel.onclick=()=>{albumComposer.classList.remove("on");albumToggle.textContent="+ 앨범 만들기"};
   if(albumCreate)albumCreate.onclick=async()=>{const title=document.getElementById("albumTitle"),visibility=document.getElementById("albumVisibility"),stateEl=document.getElementById("albumState");albumCreate.disabled=true;stateEl.textContent="앨범 만드는 중…";try{const made=await RNXRemote.createNexHomeAlbum(home.id,{title:title.value,visibility:visibility.value});albums=await RNXRemote.getNexHomeAlbums(home.id);activeAlbumId=made.id;render();panel("photos")}catch(e){stateEl.textContent=e.message||"앨범을 만들지 못했습니다.";albumCreate.disabled=false}};
   const photoAdd=document.getElementById("photoAdd"),photoPicker=document.getElementById("albumPhotoPicker"),photoState=document.getElementById("photoUploadState");
   if(photoAdd&&photoPicker)photoAdd.onclick=()=>{photoPicker.value="";photoPicker.click()};
   if(photoPicker)photoPicker.onchange=async()=>{const files=Array.from(photoPicker.files||[]).slice(0,20);if(!files.length)return;photoAdd.disabled=true;if(photoState)photoState.textContent=files.length+"장 준비 중…";try{const blobs=[];for(let i=0;i<files.length;i++){if(photoState)photoState.textContent=(i+1)+"/"+files.length+" 사진 최적화 중…";blobs.push(await albumPhotoBlob(files[i]))}if(photoState)photoState.textContent="업로드 중…";await RNXRemote.uploadNexHomeAlbumPhotos(activeAlbumId,blobs);photos=await RNXRemote.getNexHomePhotos(home.id);render();panel("photos")}catch(e){if(photoState)photoState.textContent=e.message||"사진을 올리지 못했습니다.";photoAdd.disabled=false}};
 }

 if(isOwner){
   const recordWriteEl=document.getElementById("recordWrite"),recordComposerEl=document.getElementById("recordComposer"),recordCancelEl=document.getElementById("recordCancel"),recordSaveEl=document.getElementById("recordSave");
   if(recordWriteEl&&recordComposerEl)recordWriteEl.onclick=()=>{recordComposerEl.classList.toggle("on");recordWriteEl.textContent=recordComposerEl.classList.contains("on")?"닫기":"+ 기록 쓰기"};
   if(recordCancelEl&&recordComposerEl&&recordWriteEl)recordCancelEl.onclick=()=>{recordComposerEl.classList.remove("on");recordWriteEl.textContent="+ 기록 쓰기"};
   if(recordSaveEl)recordSaveEl.onclick=async()=>{
     const titleEl=document.getElementById("recordTitle"),bodyEl=document.getElementById("recordBody"),visibilityEl=document.getElementById("recordVisibility"),stateEl=document.getElementById("recordState");
     recordSaveEl.disabled=true;stateEl.textContent="저장 중…";
     try{
       await RNXRemote.addNexHomeRecord(home.id,{title:titleEl.value,body:bodyEl.value,visibility:visibilityEl.value});
       records=await RNXRemote.getNexHomeRecords(home.id);
       render();panel("records");
     }catch(e){stateEl.textContent=e.message||"기록을 저장하지 못했습니다.";recordSaveEl.disabled=false}
   };
 }
 if(isOwner){
   app.insertAdjacentHTML("beforeend",'<input class="pickerHidden" id="profilePicker" type="file" accept="image/jpeg,image/png,image/webp"><input class="pickerHidden" id="coverPicker" type="file" accept="image/jpeg,image/png,image/webp"><div class="cropModal" id="cropModal"><div class="cropSheet"><div class="cropHead"><h3 id="cropTitle">사진 맞추기</h3></div><p class="cropHelp">프로필 사진을 드래그하거나 확대·축소해서 원하는 위치에 맞추세요.</p><div class="cropFrame coverMode" id="cropFrame"><img class="cropBackdrop" id="cropBackdrop" alt=""><img class="cropPreviewImg" id="cropPreviewImg" alt=""></div><div class="zoomRow"><span>－</span><input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="사진 확대 축소"><span>＋</span></div><div class="cropActions"><button class="cropCancel" id="cropCancel" type="button">취소</button><button class="cropApply" id="cropApply" type="button">적용</button></div></div></div>');
   const introEl=document.getElementById("intro"),themeEl=document.getElementById("theme"),entryEl=document.getElementById("entry"),guestbookEl=document.getElementById("guestbook"),saveEl=document.getElementById("save"),saveStateEl=document.getElementById("saveState");
   const profilePicker=document.getElementById("profilePicker"),coverPicker=document.getElementById("coverPicker"),profileEdit=document.getElementById("profileEdit"),coverEdit=document.getElementById("coverEdit"),profileManage=document.getElementById("profileManage"),coverManage=document.getElementById("coverManage"),cropFrame=document.getElementById("cropFrame"),cropZoom=document.getElementById("cropZoom"),cropCancel=document.getElementById("cropCancel"),cropApply=document.getElementById("cropApply"),deleteProfile=document.getElementById("deleteProfile"),deleteCover=document.getElementById("deleteCover");
   themeEl.value=home.theme||"light";entryEl.value=home.entry_scope||"public";guestbookEl.value=home.guestbook_scope||"friends";
   const pickProfile=()=>{profilePicker.value="";profilePicker.click()},pickCover=()=>{coverPicker.value="";coverPicker.click()};profileEdit.onclick=pickProfile;coverEdit.onclick=pickCover;if(profileManage)profileManage.onclick=pickProfile;if(coverManage)coverManage.onclick=pickCover;
   profilePicker.onchange=()=>profilePicker.files&&profilePicker.files[0]&&beginCrop("profile",profilePicker.files[0]);
   coverPicker.onchange=async()=>{
     const file=coverPicker.files&&coverPicker.files[0];if(!file)return;
     if(saveStateEl)saveStateEl.textContent="커버 사진을 자동으로 맞추는 중…";
     try{
       const blob=await autoCoverBlob(file);
       home=await RNXRemote.uploadNexHomeImage(home.id,"cover",blob);
       render();panel("home");
     }catch(e){
       if(saveStateEl)saveStateEl.textContent=e.message||"커버 사진을 적용하지 못했습니다.";
       else alert(e.message||"커버 사진을 적용하지 못했습니다.");
     }
   };
   const pointers=new Map();let dragPointer=null,startX=0,startY=0,originX=0,originY=0,pinchStartDist=0,pinchStartZoom=1;
   const localPoint=(a,b)=>{const r=cropFrame.getBoundingClientRect();return{x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top}};
   const distance=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
   cropFrame.onpointerdown=e=>{
     if(!cropState)return;cropFrame.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});
     if(pointers.size===1){dragPointer=e.pointerId;startX=e.clientX;startY=e.clientY;originX=cropState.x;originY=cropState.y;cropState.drag=true}
     else if(pointers.size===2){const [a,b]=[...pointers.values()];pinchStartDist=Math.max(1,distance(a,b));pinchStartZoom=cropState.zoom||1;cropState.drag=false;dragPointer=null}
   };
   cropFrame.onpointermove=e=>{
     if(!cropState||!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});
     if(pointers.size>=2){const [a,b]=[...pointers.values()];const mid=localPoint(a,b);applyCropZoom(pinchStartZoom*(distance(a,b)/pinchStartDist),mid.x,mid.y);return}
     if(cropState.drag&&e.pointerId===dragPointer){cropState.x=originX+(e.clientX-startX);cropState.y=originY+(e.clientY-startY);constrainCrop();positionCrop()}
   };
   const endPointer=e=>{
     pointers.delete(e.pointerId);
     if(!cropState)return;
     if(pointers.size===1){const [id,p]=[...pointers.entries()][0];dragPointer=id;startX=p.clientX;startY=p.clientY;originX=cropState.x;originY=cropState.y;cropState.drag=true}
     else{dragPointer=null;cropState.drag=false}
   };
   cropFrame.onpointerup=endPointer;cropFrame.onpointercancel=endPointer;
   cropZoom.oninput=()=>{if(cropState)applyCropZoom(Number(cropZoom.value),cropState.fw/2,cropState.fh/2)};
   cropFrame.onwheel=e=>{if(!cropState)return;e.preventDefault();const r=cropFrame.getBoundingClientRect(),fx=e.clientX-r.left,fy=e.clientY-r.top,factor=Math.exp(-e.deltaY*.0015);applyCropZoom((cropState.zoom||1)*factor,fx,fy)};
   cropCancel.onclick=closeCrop;
   cropApply.onclick=async()=>{cropApply.disabled=true;cropApply.textContent="적용 중…";try{const kind=cropState&&cropState.kind,blob=await croppedBlob();home=await RNXRemote.uploadNexHomeImage(home.id,kind,blob);closeCrop();render();panel("home")}catch(e){alert(e.message||"사진을 적용하지 못했습니다.");cropApply.disabled=false;cropApply.textContent="적용"}};
   const removePhoto=async kind=>{if(!confirm((kind==="profile"?"프로필":"커버")+" 사진을 삭제할까요?"))return;saveStateEl.textContent="삭제 중…";try{home=await RNXRemote.removeNexHomeImage(home.id,kind);render();panel("style")}catch(e){saveStateEl.textContent=e.message||"사진을 삭제하지 못했습니다."}};
   if(deleteProfile)deleteProfile.onclick=()=>removePhoto("profile");if(deleteCover)deleteCover.onclick=()=>removePhoto("cover");
   saveEl.onclick=async()=>{saveEl.disabled=true;saveStateEl.textContent="저장 중…";try{home=await RNXRemote.updateNexHome(home.id,{intro:introEl.value,theme:themeEl.value,entryScope:entryEl.value,guestbookScope:guestbookEl.value});saveStateEl.textContent="저장했습니다.";setTimeout(render,450)}catch(e){saveStateEl.textContent=e.message||"저장하지 못했습니다.";saveEl.disabled=false}};
 }
}
</script></body></html>
