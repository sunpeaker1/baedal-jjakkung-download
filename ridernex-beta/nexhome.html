const MENU_LABELS={home:"홈",records:"기록",photos:"사진",guestbook:"방명록",friends:"친구"};
function menuOrder(){
 const raw=Array.isArray(home.menu_order)?home.menu_order:[];
 const keys=["home","records","photos","guestbook","friends"];
 const out=[...raw.filter(x=>keys.includes(x)),...keys.filter(x=>!raw.includes(x))];
 return [...new Set(out)];
}
function hiddenMenus(){return Array.isArray(home.menu_hidden)?home.menu_hidden:[]}
function tabsHtml(){
 const hidden=hiddenMenus();
 const buttons=menuOrder().filter(k=>k==="home"||!hidden.includes(k)).map((k,i)=>'<button class="'+(i===0?"on":"")+'" data-tab="'+k+'">'+MENU_LABELS[k]+'</button>').join("");
 return buttons+(isOwner?'<button data-tab="style">꾸미기</button>':'');
}
function homeSectionOrder(){
 const raw=Array.isArray(home.home_sections)?home.home_sections:[];
 const keys=["records","photos","guestbook","friends"];
 return [...new Set([...raw.filter(x=>keys.includes(x)),...keys.filter(x=>!raw.includes(x))])];
}
function orderControlHtml(kind,keys,hidden=[]){

}

async function albumPhotoBlob(file){
 const allowed=["image/jpeg","image/png","image/webp"];
 if(!file||!allowed.includes(file.type))throw new Error("JPG, PNG, WEBP 이미지만 올릴 수 있습니다.");
 if(file.size>20*1024*1024)throw new Error("원본 사진은 한 장당 20MB 이하만 선택해주세요.");
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error("사진을 불러오지 못했습니다."));im.src=url});
  const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d",{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(img,0,0,w,h);
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("사진을 처리하지 못했습니다.")),"image/webp",.84));
 }finally{URL.revokeObjectURL(url)}
}

function constrainCrop(){
 if(!cropState)return;const c=cropState;
 const dx=c.fw-c.dw,dy=c.fh-c.dh;

 document.querySelectorAll("[data-photo-id]").forEach(el=>el.onclick=async()=>{const p=photos.find(x=>x.id===el.dataset.photoId);if(!p)return;lightboxImg.src=p.image_url;if(lightboxDelete)lightboxDelete.dataset.photoId=p.id;if(photoCaptionSave)photoCaptionSave.dataset.photoId=p.id;if(photoTitleInput)photoTitleInput.value=p.title||"";if(photoCaptionInput)photoCaptionInput.value=p.caption||"";if(photoPostTitle)photoPostTitle.textContent=p.title||"사진 기록";if(photoPostDate)photoPostDate.textContent=fmtRecordDate(p.created_at);if(photoCaptionText){photoCaptionText.textContent=p.caption||"";photoCaptionText.style.display=p.caption?"block":"none"}if(photoCommentAdd)photoCommentAdd.dataset.photoId=p.id;lightbox.classList.add("on");await loadPhotoComments(p.id)});

 }
 if(isOwner){
   app.insertAdjacentHTML("beforeend",'<input class="pickerHidden" id="profilePicker" type="file" accept="image/jpeg,image/png,image/webp"><input class="pickerHidden" id="coverPicker" type="file" accept="image/jpeg,image/png,image/webp"><input class="pickerHidden" id="backgroundPicker" type="file" accept="image/jpeg,image/png,image/webp"><div class="cropModal" id="cropModal"><div class="cropSheet"><div class="cropHead"><h3 id="cropTitle">사진 맞추기</h3></div><p class="cropHelp">프로필 사진을 드래그하거나 확대·축소해서 원하는 위치에 맞추세요.</p><div class="cropFrame coverMode" id="cropFrame"><img class="cropBackdrop" id="cropBackdrop" alt=""><img class="cropPreviewImg" id="cropPreviewImg" alt=""></div><div class="zoomRow"><span>－</span><input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="사진 확대 축소"><span>＋</span></div><div class="cropActions"><button class="cropCancel" id="cropCancel" type="button">취소</button><button class="cropApply" id="cropApply" type="button">적용</button></div></div></div>');
   const introEl=document.getElementById("intro"),themeEl=document.getElementById("theme"),entryEl=document.getElementById("entry"),guestbookEl=document.getElementById("guestbook"),saveEl=document.getElementById("save"),saveStateEl=document.getElementById("saveState");
   const profilePicker=document.getElementById("profilePicker"),coverPicker=document.getElementById("coverPicker"),backgroundPicker=document.getElementById("backgroundPicker"),profileEdit=document.getElementById("profileEdit"),coverEdit=document.getElementById("coverEdit"),profileManage=document.getElementById("profileManage"),coverManage=document.getElementById("coverManage"),backgroundManage=document.getElementById("backgroundManage"),cropFrame=document.getElementById("cropFrame"),cropZoom=document.getElementById("cropZoom"),cropCancel=document.getElementById("cropCancel"),cropApply=document.getElementById("cropApply"),deleteProfile=document.getElementById("deleteProfile"),deleteCover=document.getElementById("deleteCover"),deleteBackground=document.getElementById("deleteBackground");
   themeEl.value=home.theme||"light";entryEl.value=home.entry_scope||"public";guestbookEl.value=home.guestbook_scope||"friends";
   const pickProfile=()=>{profilePicker.value="";profilePicker.click()},pickCover=()=>{coverPicker.value="";coverPicker.click()},pickBackground=()=>{backgroundPicker.value="";backgroundPicker.click()};profileEdit.onclick=pickProfile;coverEdit.onclick=pickCover;if(profileManage)profileManage.onclick=pickProfile;if(coverManage)coverManage.onclick=pickCover;if(backgroundManage)backgroundManage.onclick=pickBackground;
   profilePicker.onchange=()=>profilePicker.files&&profilePicker.files[0]&&beginCrop("profile",profilePicker.files[0]);
   coverPicker.onchange=async()=>{
     const file=coverPicker.files&&coverPicker.files[0];if(!file)return;

     try{
       const blob=await autoCoverBlob(file);
       home=await RNXRemote.uploadNexHomeImage(home.id,"cover",blob);
       render();panel("home");
     }catch(e){
       if(saveStateEl)saveStateEl.textContent=e.message||"커버 사진을 적용하지 못했습니다.";
       else alert(e.message||"커버 사진을 적용하지 못했습니다.");
     }
   };
   backgroundPicker.onchange=async()=>{
     const file=backgroundPicker.files&&backgroundPicker.files[0];if(!file)return;
     if(saveStateEl)saveStateEl.textContent="배경 사진을 준비하는 중…";
     try{
       const blob=await autoBackgroundBlob(file);
       home=await RNXRemote.uploadNexHomeImage(home.id,"background",blob);

     }catch(e){if(saveStateEl)saveStateEl.textContent=e.message||"배경 사진을 적용하지 못했습니다."}
   };
   document.querySelectorAll(".orderList").forEach(list=>list.querySelectorAll(".orderMove").forEach(btn=>btn.onclick=()=>{const item=btn.closest(".orderItem");if(!item)return;if(btn.hasAttribute("data-order-up")){const prev=item.previousElementSibling;if(prev)list.insertBefore(item,prev)}else{const next=item.nextElementSibling;if(next)list.insertBefore(next,item)}}));
   const pointers=new Map();let dragPointer=null,startX=0,startY=0,originX=0,originY=0,pinchStartDist=0,pinchStartZoom=1;
   const localPoint=(a,b)=>{const r=cropFrame.getBoundingClientRect();return{x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top}};
   const distance=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
   cropFrame.onpointerdown=e=>{
     if(!cropState)return;cropFrame.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});
     if(pointers.size===1){dragPointer=e.pointerId;startX=e.clientX;startY=e.clientY;originX=cropState.x;originY=cropState.y;cropState.drag=true}
     else if(pointers.size===2){const [a,b]=[...pointers.values()];pinchStartDist=Math.max(1,distance(a,b));pinchStartZoom=cropState.zoom||1;cropState.drag=false;dragPointer=null}
   };
   cropFrame.onpointermove=e=>{
     if(!cropState||!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});

   const endPointer=e=>{
     pointers.delete(e.pointerId);

   };
   cropFrame.onpointerup=endPointer;cropFrame.onpointercancel=endPointer;

   cropFrame.onwheel=e=>{if(!cropState)return;e.preventDefault();const r=cropFrame.getBoundingClientRect(),fx=e.clientX-r.left,fy=e.clientY-r.top,factor=Math.exp(-e.deltaY*.0015);applyCropZoom((cropState.zoom||1)*factor,fx,fy)};

   if(deleteProfile)deleteProfile.onclick=()=>removePhoto("profile");if(deleteCover)deleteCover.onclick=()=>removePhoto("cover");if(deleteBackground)deleteBackground.onclick=()=>removePhoto("background");
   saveEl.onclick=async()=>{saveEl.disabled=true;saveStateEl.textContent="저장 중…";try{

     home=await RNXRemote.updateNexHome(home.id,{intro:introEl.value,theme:themeEl.value,entryScope:entryEl.value,guestbookScope:guestbookEl.value,menuOrder,menuHidden,homeSections});

 }
