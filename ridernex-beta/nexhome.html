<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071d35">
<title>NexHome · RiderNex</title>
<style>
:root{--blue:#0d7cff;--ink:#172033;--muted:#6f7c8f;--line:#e3e8ef;--bg:#f5f8fc;--panel:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}
.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:940px;margin:auto;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.top a:last-child{font-size:13px;font-weight:900;color:#4b6078}
.wrap{max-width:940px;margin:auto;padding:16px 13px 40px}.cover{height:210px;border-radius:25px;background:linear-gradient(135deg,#082445,#0d73e6 63%,#41a7df);position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(25,52,84,.12)}body[data-theme="dark"] .cover{background:linear-gradient(135deg,#121820,#222d3b 63%,#35516e)}body[data-theme="blue"] .cover{background:linear-gradient(135deg,#07336b,#0d7cff 63%,#2aa6d9)}
.cover:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.10);right:-80px;bottom:-120px}
.profileCard{position:relative;margin:-54px 16px 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;box-shadow:0 11px 30px rgba(26,47,74,.08)}.avatar{width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,#eef5ff,#d7e9ff);display:grid;place-items:center;font-size:34px;border:4px solid #fff}.profile h1{margin:0;font-size:24px;letter-spacing:-.8px}.profile p{margin:5px 0 0;color:var(--muted);font-size:13px}.addr{margin-top:7px;font-size:12px;font-weight:900;color:#38628b}.ownerBadge{padding:7px 9px;border-radius:999px;background:#edf5ff;color:#1466be;font-size:11px;font-weight:1000}
.tabs{display:flex;gap:5px;overflow:auto;margin-top:14px;padding:5px;background:#eaf0f7;border-radius:15px}.tabs button{border:0;background:transparent;padding:10px 13px;border-radius:11px;font-size:13px;font-weight:1000;color:#607186;white-space:nowrap}.tabs button.on{background:#fff;color:#155fae;box-shadow:0 3px 10px rgba(36,63,96,.08)}
.panel{display:none;margin-top:13px}.panel.on{display:block}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px}.card h2,.card h3{margin:0}.card h2{font-size:19px}.card h3{font-size:15px}.card p{color:var(--muted);font-size:13px;line-height:1.6}.empty{padding:28px;text-align:center;border:1px dashed #cad5e3;border-radius:16px;color:var(--muted);background:#fafbfd;font-size:13px;line-height:1.6}.mini{display:grid;gap:8px;margin-top:11px}.mini div{padding:12px;border-radius:13px;background:#f7f9fc;font-size:13px;font-weight:900;color:#40526a}
.recordsHead{display:flex;justify-content:space-between;gap:12px;align-items:end}.writeBtn{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:10px 13px;font-size:12px;font-weight:1000;white-space:nowrap}.recordComposer{display:none;margin-top:15px;padding:14px;border:1px solid #dfe6ef;border-radius:16px;background:#f8fafd}.recordComposer.on{display:block}.recordComposer textarea{min-height:150px;resize:vertical;line-height:1.6}.recordList{display:grid;gap:11px;margin-top:15px}.recordItem{padding:16px;border:1px solid #e2e8f0;border-radius:16px;background:#fff}.recordItem h3{margin:0;font-size:16px;line-height:1.38}.recordMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;color:#7a8798;font-size:11px;font-weight:800}.privacy{padding:3px 7px;border-radius:999px;background:#edf4fc;color:#35658f}.recordBody{margin-top:12px;color:#46566a;font-size:14px;line-height:1.62;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}.recordBody.open{display:block}.recordMore{margin-top:10px;border:0;background:transparent;color:#176ec9;padding:0;font-size:12px;font-weight:1000}.form{display:grid;gap:11px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:900;color:#405169}.field input,.field select,.field textarea{border:1px solid #d5dde8;border-radius:12px;padding:12px;background:#fff}.save{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:12px;font-weight:1000}.secondary{border:1px solid #d5dde8;background:#fff;color:#506176;border-radius:12px;padding:11px;font-weight:900}.status{min-height:20px;color:#18895b;font-size:12px;font-weight:900}.locked{padding:40px 18px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px}.locked h2{margin:0 0 8px}.locked p{color:var(--muted);font-size:14px}.locked a{display:inline-block;margin-top:8px;padding:11px 14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900}
@media(max-width:700px){.cover{height:170px}.profileCard{margin:-45px 9px 0;grid-template-columns:auto 1fr;padding:14px}.ownerBadge{grid-column:1/-1;width:max-content}.avatar{width:62px;height:62px}.profile h1{font-size:21px}.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span></a><a href="./">RiderNex 홈 →</a></div></header>
<main class="wrap" id="app"><div class="empty">NexHome을 불러오는 중입니다.</div></main>
<script src="beta-store.js"></script><script src="supabase-adapter.js"></script>
<script>
const app=document.getElementById("app");let home=null,isOwner=false,records=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function address(h){return h.life_region+" "+h.room_name+" "+h.road_no+"길"+h.house_no}
function fmtRecordDate(v){try{return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(v))}catch{return ""}}
function visibilityText(v){return v==="private"?"나만보기":v==="friends"?"친구공개":"전체공개"}
function recordsHtml(){
 if(!records.length)return '<div class="empty">아직 기록이 없습니다.</div>';
 return records.map(r=>'<article class="recordItem"><h3>'+esc(r.title)+'</h3><div class="recordMeta"><span>'+fmtRecordDate(r.created_at)+'</span><span class="privacy">'+visibilityText(r.visibility)+'</span></div><div class="recordBody" id="recordBody-'+r.id+'">'+esc(r.body)+'</div><button class="recordMore" data-record-more="'+r.id+'">더보기</button></article>').join("");
}
function panel(name){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===name));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.dataset.panel===name))}
(async()=>{
 const s=await RNXRemote.init();if(!s.enabled){app.innerHTML='<div class="locked"><h2>서버 연결을 확인할 수 없습니다.</h2><p>잠시 후 다시 시도하세요.</p></div>';return}
 const id=new URLSearchParams(location.search).get("id");
 try{home=id?await RNXRemote.getNexHomeById(id):await RNXRemote.getMyNexHome()}catch{}
 if(!home){app.innerHTML='<div class="locked"><h2>NexHome을 찾을 수 없습니다.</h2><p>비공개이거나 아직 만들어지지 않은 공간입니다.</p><a href="./">RiderNex 홈으로</a></div>';return}
 isOwner=!!(s.user&&s.user.id===home.owner_id);
 try{records=await RNXRemote.getNexHomeRecords(home.id)}catch{records=[]}
 render();
 if(isOwner&&home.first_visit){try{await RNXRemote.finishNexHomeFirstVisit(home.id)}catch{}}
})();
function render(){
 document.body.dataset.theme=home.theme||"light";const nick=home.profiles?.nickname||"라이더";
 app.innerHTML=`
 <section class="cover"></section>
 <section class="profileCard"><div class="avatar">👤</div><div class="profile"><h1>${esc(home.room_name)}</h1><p>${esc(home.intro||"오늘도 안전하게 달립니다.")}</p><div class="addr">📍 ${esc(address(home))} · 집주인 ${esc(nick)}</div></div>${isOwner?'<span class="ownerBadge">내 NexHome</span>':''}</section>
 <nav class="tabs"><button class="on" data-tab="home">홈</button><button data-tab="records">기록</button><button data-tab="photos">사진</button><button data-tab="guestbook">방명록</button><button data-tab="friends">친구</button>${isOwner?'<button data-tab="style">꾸미기</button>':''}</nav>
 <section class="panel on" data-panel="home"><div class="grid"><article class="card"><h2>${esc(home.room_name)}에 오신 것을 환영합니다.</h2><p>${esc(home.intro||"오늘도 안전하게 달립니다.")}</p><div class="mini"><div>📝 최근 기록 · ${records.length?esc(records[0].title):"아직 없음"}</div><div>📷 최근 사진 · 아직 없음</div><div>💬 방명록 · 아직 없음</div></div></article><article class="card"><h3>NexHome 정보</h3><p><b>생활권</b><br>${esc(home.life_region)}</p><p><b>주소</b><br>${esc(home.road_no+"길"+home.house_no)}</p><p><b>입장범위</b><br>${home.entry_scope==="public"?"전체 입장":home.entry_scope==="friends"?"친구만 입장":"나만 입장"}</p></article></div></section>
 <section class="panel" data-panel="records"><div class="card"><div class="recordsHead"><div><h2>기록</h2><p>개인 일상, 배달 이야기, 바이크, 후기와 생각을 쌓는 공간입니다.</p></div>${isOwner?'<button class="writeBtn" id="recordWrite">+ 기록 쓰기</button>':''}</div>${isOwner?'<div class="recordComposer" id="recordComposer"><div class="form"><div class="field"><label>제목</label><input id="recordTitle" maxlength="120" placeholder="오늘의 기록 제목"></div><div class="field"><label>내용</label><textarea id="recordBody" maxlength="12000" placeholder="라이더 생활과 생각을 자유롭게 남겨보세요."></textarea></div><div class="field"><label>공개범위</label><select id="recordVisibility"><option value="public">전체공개</option><option value="private">나만보기</option></select></div><button class="save" id="recordSave">기록 남기기</button><button class="secondary" id="recordCancel" type="button">취소</button><div class="status" id="recordState"></div></div></div>':''}<div class="recordList">${recordsHtml()}</div></div></section>
 <section class="panel" data-panel="photos"><div class="card"><h2>사진</h2><p>앨범형 사진 공간입니다.</p><div class="empty">아직 만든 앨범이 없습니다.</div></div></section>
 <section class="panel" data-panel="guestbook"><div class="card"><h2>방명록</h2><p>친구와 방문자가 남기는 카드형 방명록 공간입니다.</p><div class="empty">${home.guestbook_scope==="off"?"방명록을 사용하지 않는 NexHome입니다.":"아직 남겨진 방명록이 없습니다."}</div></div></section>
 <section class="panel" data-panel="friends"><div class="card"><h2>친구</h2><p>친구 신청·수락 후 서로의 NexHome을 방문하는 공간입니다.</p><div class="empty">아직 표시할 친구가 없습니다.</div></div></section>
 ${isOwner?`<section class="panel" data-panel="style"><div class="card"><h2>기본 꾸미기</h2><p>복잡한 편집 대신 핵심 요소만 간단하게 바꿉니다.</p><div class="form"><div class="field"><label>한 줄 소개</label><input id="intro" maxlength="80" value="${esc(home.intro||"")}"></div><div class="field"><label>기본 테마</label><select id="theme"><option value="light">밝은형</option><option value="blue">블루형</option><option value="dark">어두운형</option></select></div><div class="field"><label>NexHome 입장범위</label><select id="entry"><option value="public">전체 입장</option><option value="friends">친구만 입장</option><option value="private">나만 입장</option></select></div><div class="field"><label>방명록 작성범위</label><select id="guestbook"><option value="all">누구나 작성 가능</option><option value="friends">친구만 작성 가능</option><option value="off">방명록 사용 안 함</option></select></div><button class="save" id="save">저장</button><div class="status" id="saveState"></div></div></div></section>`:""}`;
 document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>panel(b.dataset.tab));
 document.querySelectorAll("[data-record-more]").forEach(btn=>btn.onclick=()=>{const body=document.getElementById("recordBody-"+btn.dataset.recordMore);if(!body)return;body.classList.toggle("open");btn.textContent=body.classList.contains("open")?"접기":"더보기"});
 if(isOwner){
   const recordWriteEl=document.getElementById("recordWrite"),recordComposerEl=document.getElementById("recordComposer"),recordCancelEl=document.getElementById("recordCancel"),recordSaveEl=document.getElementById("recordSave");
   if(recordWriteEl&&recordComposerEl)recordWriteEl.onclick=()=>{recordComposerEl.classList.toggle("on");recordWriteEl.textContent=recordComposerEl.classList.contains("on")?"닫기":"+ 기록 쓰기"};
   if(recordCancelEl&&recordComposerEl&&recordWriteEl)recordCancelEl.onclick=()=>{recordComposerEl.classList.remove("on");recordWriteEl.textContent="+ 기록 쓰기"};
   if(recordSaveEl)recordSaveEl.onclick=async()=>{
     const titleEl=document.getElementById("recordTitle"),bodyEl=document.getElementById("recordBody"),visibilityEl=document.getElementById("recordVisibility"),stateEl=document.getElementById("recordState");
     recordSaveEl.disabled=true;stateEl.textContent="저장 중…";
     try{
       await RNXRemote.addNexHomeRecord(home.id,{title:titleEl.value,body:bodyEl.value,visibility:visibilityEl.value});
       records=await RNXRemote.getNexHomeRecords(home.id);
       render();panel("records");
     }catch(e){stateEl.textContent=e.message||"기록을 저장하지 못했습니다.";recordSaveEl.disabled=false}
   };
 }
 if(isOwner){const introEl=document.getElementById("intro"),themeEl=document.getElementById("theme"),entryEl=document.getElementById("entry"),guestbookEl=document.getElementById("guestbook"),saveEl=document.getElementById("save"),saveStateEl=document.getElementById("saveState");themeEl.value=home.theme||"light";entryEl.value=home.entry_scope||"public";guestbookEl.value=home.guestbook_scope||"friends";saveEl.onclick=async()=>{saveEl.disabled=true;saveStateEl.textContent="저장 중…";try{home=await RNXRemote.updateNexHome(home.id,{intro:introEl.value,theme:themeEl.value,entryScope:entryEl.value,guestbookScope:guestbookEl.value});saveStateEl.textContent="저장했습니다.";setTimeout(render,450)}catch(e){saveStateEl.textContent=e.message||"저장하지 못했습니다.";saveEl.disabled=false}}}
}
</script></body></html>
