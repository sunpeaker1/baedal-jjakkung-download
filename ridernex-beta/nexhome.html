<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071d35">
<title>NexHome · RiderNex</title>
<style>
:root{--blue:#0d7cff;--ink:#172033;--muted:#6f7c8f;--line:#e3e8ef;--bg:#f5f8fc;--panel:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}
.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:940px;margin:auto;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.top a:last-child{font-size:13px;font-weight:900;color:#4b6078}
.wrap{max-width:940px;margin:auto;padding:16px 13px 40px}.cover{height:210px;border-radius:25px;background:linear-gradient(135deg,#082445,#0d73e6 63%,#41a7df);position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(25,52,84,.12)}body[data-theme="dark"] .cover{background:linear-gradient(135deg,#121820,#222d3b 63%,#35516e)}body[data-theme="blue"] .cover{background:linear-gradient(135deg,#07336b,#0d7cff 63%,#2aa6d9)}
.coverImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.10);right:-80px;bottom:-120px;pointer-events:none}.editTap{cursor:pointer}.editChip{position:absolute;right:12px;top:12px;z-index:3;padding:7px 10px;border-radius:999px;background:rgba(4,18,35,.72);color:#fff;font-size:11px;font-weight:1000;backdrop-filter:blur(7px)}
.profileCard{position:relative;margin:-54px 16px 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;box-shadow:0 11px 30px rgba(26,47,74,.08)}.avatar{position:relative;width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,#eef5ff,#d7e9ff);display:grid;place-items:center;font-size:34px;border:4px solid #fff;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatarEdit{position:absolute;right:2px;bottom:2px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:rgba(4,18,35,.76);color:#fff;font-size:12px;border:2px solid #fff}.profile h1{margin:0;font-size:24px;letter-spacing:-.8px}.profile p{margin:5px 0 0;color:var(--muted);font-size:13px}.addr{margin-top:7px;font-size:12px;font-weight:900;color:#38628b}.ownerBadge{padding:7px 9px;border-radius:999px;background:#edf5ff;color:#1466be;font-size:11px;font-weight:1000}
.tabs{display:flex;gap:5px;overflow:auto;margin-top:14px;padding:5px;background:#eaf0f7;border-radius:15px}.tabs button{border:0;background:transparent;padding:10px 13px;border-radius:11px;font-size:13px;font-weight:1000;color:#607186;white-space:nowrap}.tabs button.on{background:#fff;color:#155fae;box-shadow:0 3px 10px rgba(36,63,96,.08)}
.panel{display:none;margin-top:13px}.panel.on{display:block}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px}.card h2,.card h3{margin:0}.card h2{font-size:19px}.card h3{font-size:15px}.card p{color:var(--muted);font-size:13px;line-height:1.6}.empty{padding:28px;text-align:center;border:1px dashed #cad5e3;border-radius:16px;color:var(--muted);background:#fafbfd;font-size:13px;line-height:1.6}.mini{display:grid;gap:8px;margin-top:11px}.mini div{padding:12px;border-radius:13px;background:#f7f9fc;font-size:13px;font-weight:900;color:#40526a}
.recordsHead{display:flex;justify-content:space-between;gap:12px;align-items:end}.writeBtn{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:10px 13px;font-size:12px;font-weight:1000;white-space:nowrap}.recordComposer{display:none;margin-top:15px;padding:14px;border:1px solid #dfe6ef;border-radius:16px;background:#f8fafd}.recordComposer.on{display:block}.recordComposer textarea{min-height:150px;resize:vertical;line-height:1.6}.recordList{display:grid;gap:11px;margin-top:15px}.recordItem{padding:16px;border:1px solid #e2e8f0;border-radius:16px;background:#fff}.recordItem h3{margin:0;font-size:16px;line-height:1.38}.recordMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;color:#7a8798;font-size:11px;font-weight:800}.privacy{padding:3px 7px;border-radius:999px;background:#edf4fc;color:#35658f}.recordBody{margin-top:12px;color:#46566a;font-size:14px;line-height:1.62;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}.recordBody.open{display:block}.recordMore{margin-top:10px;border:0;background:transparent;color:#176ec9;padding:0;font-size:12px;font-weight:1000}.form{display:grid;gap:11px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:900;color:#405169}.field input,.field select,.field textarea{border:1px solid #d5dde8;border-radius:12px;padding:12px;background:#fff}.mediaManage{padding:13px;border:1px solid #e0e7f0;border-radius:14px;background:#f8fafd}.mediaManage p{margin:4px 0 10px!important;font-size:12px!important}.mediaActions{display:flex;gap:7px;flex-wrap:wrap}.mediaActions button{flex:1;min-width:130px}.danger{border-color:#f0c8c8!important;color:#a63e3e!important}.pickerHidden{display:none}.cropModal{position:fixed;inset:0;z-index:1000;background:rgba(7,19,34,.78);display:none;align-items:center;justify-content:center;padding:18px}.cropModal.on{display:flex}.cropSheet{width:min(92vw,620px);background:#fff;border-radius:22px;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.cropHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.cropHead h3{margin:0;font-size:18px}.cropHelp{margin:7px 0 12px;color:#758397;font-size:12px;line-height:1.5}.cropFrame{position:relative;width:100%;overflow:hidden;background:#101722;border-radius:16px;touch-action:none;user-select:none}.cropFrame.coverMode{aspect-ratio:3.8/1}.cropFrame.profileMode{width:min(72vw,290px);aspect-ratio:1;margin:0 auto;border-radius:26px}.cropPreviewImg{position:absolute;max-width:none;max-height:none;pointer-events:none;user-select:none}.zoomRow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;margin-top:12px;color:#607186;font-size:12px;font-weight:900}.zoomRow input{width:100%;accent-color:var(--blue)}.cropActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.cropActions button{border:0;border-radius:12px;padding:12px;font-weight:1000}.cropCancel{background:#eef2f7;color:#536276}.cropApply{background:var(--blue);color:#fff}.save{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:12px;font-weight:1000}.secondary{border:1px solid #d5dde8;background:#fff;color:#506176;border-radius:12px;padding:11px;font-weight:900}.status{min-height:20px;color:#18895b;font-size:12px;font-weight:900}.locked{padding:40px 18px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px}.locked h2{margin:0 0 8px}.locked p{color:var(--muted);font-size:14px}.locked a{display:inline-block;margin-top:8px;padding:11px 14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900}
@media(max-width:700px){.cover{height:170px}.profileCard{margin:-45px 9px 0;grid-template-columns:auto 1fr;padding:14px}.ownerBadge{grid-column:1/-1;width:max-content}.avatar{width:62px;height:62px}.profile h1{font-size:21px}.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span></a><a href="./">RiderNex 홈 →</a></div></header>
<main class="wrap" id="app"><div class="empty">NexHome을 불러오는 중입니다.</div></main>
<script src="beta-store.js"></script><script src="supabase-adapter.js"></script>
<script>
const app=document.getElementById("app");let home=null,isOwner=false,records=[],cropState=null,cropObjectUrl=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function address(h){return h.life_region+" "+h.room_name+" "+h.road_no+"길"+h.house_no}
function fmtRecordDate(v){try{return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(v))}catch{return ""}}
function visibilityText(v){return v==="private"?"나만보기":v==="friends"?"친구공개":"전체공개"}
function recordsHtml(){
 if(!records.length)return '<div class="empty">아직 기록이 없습니다.</div>';
 return records.map(r=>'<article class="recordItem"><h3>'+esc(r.title)+'</h3><div class="recordMeta"><span>'+fmtRecordDate(r.created_at)+'</span><span class="privacy">'+visibilityText(r.visibility)+'</span></div><div class="recordBody" id="recordBody-'+r.id+'">'+esc(r.body)+'</div><button class="recordMore" data-record-more="'+r.id+'">더보기</button></article>').join("");
}
function panel(name){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===name));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.dataset.panel===name))}
function clamp(v,min,max){return Math.min(max,Math.max(min,v))}
function closeCrop(){
 const modal=document.getElementById("cropModal");if(modal)modal.classList.remove("on");
 if(cropObjectUrl){URL.revokeObjectURL(cropObjectUrl);cropObjectUrl=null}
 cropState=null;
}
function positionCrop(){
 if(!cropState)return;const imgEl=document.getElementById("cropPreviewImg");if(!imgEl)return;
 imgEl.style.width=cropState.dw+"px";imgEl.style.height=cropState.dh+"px";imgEl.style.left=cropState.x+"px";imgEl.style.top=cropState.y+"px";
 const zoomEl=document.getElementById("cropZoom");if(zoomEl)zoomEl.value=String(cropState.zoom||1);
}
function applyCropZoom(nextZoom,focusX,focusY){
 if(!cropState)return;
 const c=cropState,z=clamp(Number(nextZoom)||1,1,4),fx=Number.isFinite(focusX)?focusX:c.fw/2,fy=Number.isFinite(focusY)?focusY:c.fh/2;
 const imageX=(fx-c.x)/c.scale,imageY=(fy-c.y)/c.scale;
 c.zoom=z;c.scale=c.baseScale*z;c.dw=c.img.naturalWidth*c.scale;c.dh=c.img.naturalHeight*c.scale;
 c.x=fx-imageX*c.scale;c.y=fy-imageY*c.scale;
 c.x=clamp(c.x,Math.min(0,c.fw-c.dw),0);c.y=clamp(c.y,Math.min(0,c.fh-c.dh),0);positionCrop();
}
function beginCrop(kind,file){
 const allowed=["image/jpeg","image/png","image/webp"];
 if(!file||!allowed.includes(file.type)){alert("JPG, PNG, WEBP 이미지만 사용할 수 있습니다.");return}
 if(file.size>20*1024*1024){alert("원본 사진은 20MB 이하만 선택해주세요.");return}
 const modal=document.getElementById("cropModal"),frame=document.getElementById("cropFrame"),title=document.getElementById("cropTitle"),imgEl=document.getElementById("cropPreviewImg");
 if(!modal||!frame||!imgEl)return;closeCrop();cropObjectUrl=URL.createObjectURL(file);
 title.textContent=kind==="profile"?"프로필 사진 맞추기":"커버 사진 맞추기";
 frame.className="cropFrame "+(kind==="profile"?"profileMode":"coverMode");modal.classList.add("on");
 const img=new Image();img.onload=()=>{requestAnimationFrame(()=>{const fw=frame.clientWidth,fh=frame.clientHeight,baseScale=Math.max(fw/img.naturalWidth,fh/img.naturalHeight),scale=baseScale,dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;cropState={kind,file,img,fw,fh,baseScale,zoom:1,scale,dw,dh,x:(fw-dw)/2,y:(fh-dh)/2,drag:false};imgEl.src=cropObjectUrl;positionCrop()})};img.src=cropObjectUrl;
}
async function croppedBlob(){
 if(!cropState)throw new Error("사진을 다시 선택하세요.");
 const c=cropState,target=c.kind==="profile"?{w:720,h:720}:{w:1600,h:420};
 const sx=-c.x/c.scale,sy=-c.y/c.scale,sw=c.fw/c.scale,sh=c.fh/c.scale;
 const canvas=document.createElement("canvas");canvas.width=target.w;canvas.height=target.h;
 const ctx=canvas.getContext("2d",{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(c.img,sx,sy,sw,sh,0,0,target.w,target.h);
 return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("사진을 처리하지 못했습니다.")),"image/webp",.84));
}
(async()=>{
 const s=await RNXRemote.init();if(!s.enabled){app.innerHTML='<div class="locked"><h2>서버 연결을 확인할 수 없습니다.</h2><p>잠시 후 다시 시도하세요.</p></div>';return}
 const id=new URLSearchParams(location.search).get("id");
 try{home=id?await RNXRemote.getNexHomeById(id):await RNXRemote.getMyNexHome()}catch{}
 if(!home){app.innerHTML='<div class="locked"><h2>NexHome을 찾을 수 없습니다.</h2><p>비공개이거나 아직 만들어지지 않은 공간입니다.</p><a href="./">RiderNex 홈으로</a></div>';return}
 isOwner=!!(s.user&&s.user.id===home.owner_id);
 try{records=await RNXRemote.getNexHomeRecords(home.id)}catch{records=[]}
 render();
 if(isOwner&&home.first_visit){try{await RNXRemote.finishNexHomeFirstVisit(home.id)}catch{}}
})();
function render(){
 document.body.dataset.theme=home.theme||"light";const nick=home.profiles?.nickname||"라이더";
 app.innerHTML=`
 <section class="cover${isOwner?' editTap':''}" id="coverEdit">${home.cover_url?'<img class="coverImg" src="'+esc(home.cover_url)+'" alt="NexHome 커버">':''}${isOwner?'<span class="editChip">📷 커버 변경</span>':''}</section>
 <section class="profileCard"><div class="avatar${isOwner?' editTap':''}" id="profileEdit">${home.profile_url?'<img src="'+esc(home.profile_url)+'" alt="프로필 사진">':'👤'}${isOwner?'<span class="avatarEdit">📷</span>':''}</div><div class="profile"><h1>${esc(home.room_name)}</h1><p>${esc(home.intro||"오늘도 안전하게 달립니다.")}</p><div class="addr">📍 ${esc(address(home))} · 집주인 ${esc(nick)}</div></div>${isOwner?'<span class="ownerBadge">내 NexHome</span>':''}</section>
 <nav class="tabs"><button class="on" data-tab="home">홈</button><button data-tab="records">기록</button><button data-tab="photos">사진</button><button data-tab="guestbook">방명록</button><button data-tab="friends">친구</button>${isOwner?'<button data-tab="style">꾸미기</button>':''}</nav>
 <section class="panel on" data-panel="home"><div class="grid"><article class="card"><h2>${esc(home.room_name)}에 오신 것을 환영합니다.</h2><p>${esc(home.intro||"오늘도 안전하게 달립니다.")}</p><div class="mini"><div>📝 최근 기록 · ${records.length?esc(records[0].title):"아직 없음"}</div><div>📷 최근 사진 · 아직 없음</div><div>💬 방명록 · 아직 없음</div></div></article><article class="card"><h3>NexHome 정보</h3><p><b>생활권</b><br>${esc(home.life_region)}</p><p><b>주소</b><br>${esc(home.road_no+"길"+home.house_no)}</p><p><b>입장범위</b><br>${home.entry_scope==="public"?"전체 입장":home.entry_scope==="friends"?"친구만 입장":"나만 입장"}</p></article></div></section>
 <section class="panel" data-panel="records"><div class="card"><div class="recordsHead"><div><h2>기록</h2><p>개인 일상, 배달 이야기, 바이크, 후기와 생각을 쌓는 공간입니다.</p></div>${isOwner?'<button class="writeBtn" id="recordWrite">+ 기록 쓰기</button>':''}</div>${isOwner?'<div class="recordComposer" id="recordComposer"><div class="form"><div class="field"><label>제목</label><input id="recordTitle" maxlength="120" placeholder="오늘의 기록 제목"></div><div class="field"><label>내용</label><textarea id="recordBody" maxlength="12000" placeholder="라이더 생활과 생각을 자유롭게 남겨보세요."></textarea></div><div class="field"><label>공개범위</label><select id="recordVisibility"><option value="public">전체공개</option><option value="private">나만보기</option></select></div><button class="save" id="recordSave">기록 남기기</button><button class="secondary" id="recordCancel" type="button">취소</button><div class="status" id="recordState"></div></div></div>':''}<div class="recordList">${recordsHtml()}</div></div></section>
 <section class="panel" data-panel="photos"><div class="card"><h2>사진</h2><p>앨범형 사진 공간입니다.</p><div class="empty">아직 만든 앨범이 없습니다.</div></div></section>
 <section class="panel" data-panel="guestbook"><div class="card"><h2>방명록</h2><p>친구와 방문자가 남기는 카드형 방명록 공간입니다.</p><div class="empty">${home.guestbook_scope==="off"?"방명록을 사용하지 않는 NexHome입니다.":"아직 남겨진 방명록이 없습니다."}</div></div></section>
 <section class="panel" data-panel="friends"><div class="card"><h2>친구</h2><p>친구 신청·수락 후 서로의 NexHome을 방문하는 공간입니다.</p><div class="empty">아직 표시할 친구가 없습니다.</div></div></section>
 ${isOwner?`<section class="panel" data-panel="style"><div class="card"><h2>기본 꾸미기</h2><p>복잡한 편집 대신 핵심 요소만 간단하게 바꿉니다.</p><div class="form"><div class="mediaManage"><b>프로필 · 커버 사진</b><p>사진 영역을 눌러도 되고 아래 버튼으로도 추가·변경할 수 있습니다.</p><div class="mediaActions"><button class="secondary" id="profileManage" type="button">${home.profile_url?"프로필 사진 변경":"프로필 사진 추가"}</button><button class="secondary" id="coverManage" type="button">${home.cover_url?"커버 사진 변경":"커버 사진 추가"}</button>${home.profile_url?'<button class="secondary danger" id="deleteProfile" type="button">프로필 사진 삭제</button>':''}${home.cover_url?'<button class="secondary danger" id="deleteCover" type="button">커버 사진 삭제</button>':''}</div></div><div class="field"><label>한 줄 소개</label><input id="intro" maxlength="80" value="${esc(home.intro||"")}"></div><div class="field"><label>기본 테마</label><select id="theme"><option value="light">밝은형</option><option value="blue">블루형</option><option value="dark">어두운형</option></select></div><div class="field"><label>NexHome 입장범위</label><select id="entry"><option value="public">전체 입장</option><option value="friends">친구만 입장</option><option value="private">나만 입장</option></select></div><div class="field"><label>방명록 작성범위</label><select id="guestbook"><option value="all">누구나 작성 가능</option><option value="friends">친구만 작성 가능</option><option value="off">방명록 사용 안 함</option></select></div><button class="save" id="save">저장</button><div class="status" id="saveState"></div></div></div></section>`:""}`;
 document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>panel(b.dataset.tab));
 document.querySelectorAll("[data-record-more]").forEach(btn=>btn.onclick=()=>{const body=document.getElementById("recordBody-"+btn.dataset.recordMore);if(!body)return;body.classList.toggle("open");btn.textContent=body.classList.contains("open")?"접기":"더보기"});
 if(isOwner){
   const recordWriteEl=document.getElementById("recordWrite"),recordComposerEl=document.getElementById("recordComposer"),recordCancelEl=document.getElementById("recordCancel"),recordSaveEl=document.getElementById("recordSave");
   if(recordWriteEl&&recordComposerEl)recordWriteEl.onclick=()=>{recordComposerEl.classList.toggle("on");recordWriteEl.textContent=recordComposerEl.classList.contains("on")?"닫기":"+ 기록 쓰기"};
   if(recordCancelEl&&recordComposerEl&&recordWriteEl)recordCancelEl.onclick=()=>{recordComposerEl.classList.remove("on");recordWriteEl.textContent="+ 기록 쓰기"};
   if(recordSaveEl)recordSaveEl.onclick=async()=>{
     const titleEl=document.getElementById("recordTitle"),bodyEl=document.getElementById("recordBody"),visibilityEl=document.getElementById("recordVisibility"),stateEl=document.getElementById("recordState");
     recordSaveEl.disabled=true;stateEl.textContent="저장 중…";
     try{
       await RNXRemote.addNexHomeRecord(home.id,{title:titleEl.value,body:bodyEl.value,visibility:visibilityEl.value});
       records=await RNXRemote.getNexHomeRecords(home.id);
       render();panel("records");
     }catch(e){stateEl.textContent=e.message||"기록을 저장하지 못했습니다.";recordSaveEl.disabled=false}
   };
 }
 if(isOwner){
   app.insertAdjacentHTML("beforeend",'<input class="pickerHidden" id="profilePicker" type="file" accept="image/jpeg,image/png,image/webp"><input class="pickerHidden" id="coverPicker" type="file" accept="image/jpeg,image/png,image/webp"><div class="cropModal" id="cropModal"><div class="cropSheet"><div class="cropHead"><h3 id="cropTitle">사진 맞추기</h3></div><p class="cropHelp">사진을 손가락으로 움직여 보이는 위치를 맞춘 뒤 적용하세요.</p><div class="cropFrame coverMode" id="cropFrame"><img class="cropPreviewImg" id="cropPreviewImg" alt=""></div><div class="zoomRow"><span>－</span><input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="사진 확대 축소"><span>＋</span></div><div class="cropActions"><button class="cropCancel" id="cropCancel" type="button">취소</button><button class="cropApply" id="cropApply" type="button">적용</button></div></div></div>');
   const introEl=document.getElementById("intro"),themeEl=document.getElementById("theme"),entryEl=document.getElementById("entry"),guestbookEl=document.getElementById("guestbook"),saveEl=document.getElementById("save"),saveStateEl=document.getElementById("saveState");
   const profilePicker=document.getElementById("profilePicker"),coverPicker=document.getElementById("coverPicker"),profileEdit=document.getElementById("profileEdit"),coverEdit=document.getElementById("coverEdit"),profileManage=document.getElementById("profileManage"),coverManage=document.getElementById("coverManage"),cropFrame=document.getElementById("cropFrame"),cropZoom=document.getElementById("cropZoom"),cropCancel=document.getElementById("cropCancel"),cropApply=document.getElementById("cropApply"),deleteProfile=document.getElementById("deleteProfile"),deleteCover=document.getElementById("deleteCover");
   themeEl.value=home.theme||"light";entryEl.value=home.entry_scope||"public";guestbookEl.value=home.guestbook_scope||"friends";
   const pickProfile=()=>{profilePicker.value="";profilePicker.click()},pickCover=()=>{coverPicker.value="";coverPicker.click()};profileEdit.onclick=pickProfile;coverEdit.onclick=pickCover;if(profileManage)profileManage.onclick=pickProfile;if(coverManage)coverManage.onclick=pickCover;
   profilePicker.onchange=()=>profilePicker.files&&profilePicker.files[0]&&beginCrop("profile",profilePicker.files[0]);
   coverPicker.onchange=()=>coverPicker.files&&coverPicker.files[0]&&beginCrop("cover",coverPicker.files[0]);
   const pointers=new Map();let dragPointer=null,startX=0,startY=0,originX=0,originY=0,pinchStartDist=0,pinchStartZoom=1;
   const localPoint=(a,b)=>{const r=cropFrame.getBoundingClientRect();return{x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top}};
   const distance=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
   cropFrame.onpointerdown=e=>{
     if(!cropState)return;cropFrame.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});
     if(pointers.size===1){dragPointer=e.pointerId;startX=e.clientX;startY=e.clientY;originX=cropState.x;originY=cropState.y;cropState.drag=true}
     else if(pointers.size===2){const [a,b]=[...pointers.values()];pinchStartDist=Math.max(1,distance(a,b));pinchStartZoom=cropState.zoom||1;cropState.drag=false;dragPointer=null}
   };
   cropFrame.onpointermove=e=>{
     if(!cropState||!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});
     if(pointers.size>=2){const [a,b]=[...pointers.values()];const mid=localPoint(a,b);applyCropZoom(pinchStartZoom*(distance(a,b)/pinchStartDist),mid.x,mid.y);return}
     if(cropState.drag&&e.pointerId===dragPointer){const minX=Math.min(0,cropState.fw-cropState.dw),minY=Math.min(0,cropState.fh-cropState.dh);cropState.x=clamp(originX+(e.clientX-startX),minX,0);cropState.y=clamp(originY+(e.clientY-startY),minY,0);positionCrop()}
   };
   const endPointer=e=>{
     pointers.delete(e.pointerId);
     if(!cropState)return;
     if(pointers.size===1){const [id,p]=[...pointers.entries()][0];dragPointer=id;startX=p.clientX;startY=p.clientY;originX=cropState.x;originY=cropState.y;cropState.drag=true}
     else{dragPointer=null;cropState.drag=false}
   };
   cropFrame.onpointerup=endPointer;cropFrame.onpointercancel=endPointer;
   cropZoom.oninput=()=>{if(cropState)applyCropZoom(Number(cropZoom.value),cropState.fw/2,cropState.fh/2)};
   cropCancel.onclick=closeCrop;
   cropApply.onclick=async()=>{cropApply.disabled=true;cropApply.textContent="적용 중…";try{const kind=cropState&&cropState.kind,blob=await croppedBlob();home=await RNXRemote.uploadNexHomeImage(home.id,kind,blob);closeCrop();render();panel("home")}catch(e){alert(e.message||"사진을 적용하지 못했습니다.");cropApply.disabled=false;cropApply.textContent="적용"}};
   const removePhoto=async kind=>{if(!confirm((kind==="profile"?"프로필":"커버")+" 사진을 삭제할까요?"))return;saveStateEl.textContent="삭제 중…";try{home=await RNXRemote.removeNexHomeImage(home.id,kind);render();panel("style")}catch(e){saveStateEl.textContent=e.message||"사진을 삭제하지 못했습니다."}};
   if(deleteProfile)deleteProfile.onclick=()=>removePhoto("profile");if(deleteCover)deleteCover.onclick=()=>removePhoto("cover");
   saveEl.onclick=async()=>{saveEl.disabled=true;saveStateEl.textContent="저장 중…";try{home=await RNXRemote.updateNexHome(home.id,{intro:introEl.value,theme:themeEl.value,entryScope:entryEl.value,guestbookScope:guestbookEl.value});saveStateEl.textContent="저장했습니다.";setTimeout(render,450)}catch(e){saveStateEl.textContent=e.message||"저장하지 못했습니다.";saveEl.disabled=false}};
 }
}
</script></body></html>
