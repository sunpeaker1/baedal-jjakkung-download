<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>지역정보 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc;--shadow:0 10px 28px rgba(31,60,99,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:1000px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.home{font-size:11px;font-weight:900;color:#276fbe}.wrap{max-width:1000px;margin:auto;padding:18px 14px 40px}.crumb{display:flex;gap:6px;font-size:10px;color:#7a8798;margin-bottom:10px}.crumb a{color:#276fbe;font-weight:900}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#1658bb,#1978e7 60%,#2ba6d7);color:#fff}.hero h1{margin:0;font-size:28px}.hero p{margin:8px 0 0;font-size:12px;color:#eaf4ff;line-height:1.5}.section{margin-top:18px}.title h2{margin:0;font-size:20px}.title p{margin:5px 0 0;color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.card b{font-size:13px}.card small{display:block;margin-top:5px;color:var(--muted);font-size:9px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.cat{border:1px solid #e8edf3;border-radius:12px;padding:11px;font-size:10px}.member{margin-top:12px;padding:11px;border-radius:12px;background:#f7f9fc;border:1px solid #e7ebf1;display:flex;justify-content:space-between;gap:10px;font-size:10px}.member a{color:#fff;background:#0d73e6;padding:7px 9px;border-radius:9px;font-weight:900}.compose{display:none;margin-top:10px;padding:12px;border:1px solid #e5eaf1;border-radius:13px;gap:8px}.compose.on{display:grid}.compose select,.compose input,.compose textarea{padding:9px;border:1px solid #dbe3ec;border-radius:9px;font:inherit;font-size:10px}.compose textarea{min-height:80px}.compose button{justify-self:end;border:0;background:#0d73e6;color:#fff;padding:8px 11px;border-radius:9px;font-size:9px;font-weight:900}.posts{display:grid;gap:8px;margin-top:12px}.post{border:1px solid #e5eaf1;border-radius:13px;padding:12px}.post h3{margin:0;font-size:12px}.meta{margin-top:4px;color:#8b95a5;font-size:8px}.body{margin-top:7px;color:#526174;font-size:10px;line-height:1.5}.tools{margin-top:8px}.tools button{border:1px solid #dfe6ee;background:#fff;padding:6px 8px;border-radius:8px;font-size:8px}.comments{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #edf1f5}.comments.on{display:grid;gap:6px}.comment{background:#f7f9fc;padding:7px;border-radius:8px;font-size:9px}.commentForm{display:flex;gap:6px}.commentForm input{flex:1;padding:7px;border:1px solid #dce3ec;border-radius:8px;font-size:9px}.empty{padding:20px;border:1px dashed #cbd5e1;border-radius:13px;text-align:center;color:var(--muted);font-size:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:24px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 지역정보</a><a class="home" href="./">홈으로</a></div></header>
<main class="wrap"><div class="crumb" id="crumb"><a href="./">홈</a><span>›</span><span>지역정보</span></div><section class="hero"><h1 id="heroTitle">전국 지역정보</h1><p id="heroText">시·도를 선택하고 시·군·구 지역방으로 들어갑니다.</p></section><section class="section" id="content"></section></main>
<script src="beta-store.js"></script><script src="region-data.js"></script><script>
const params=new URLSearchParams(location.search),city=params.get("city"),rawDistrict=params.get("district");const content=document.getElementById("content"),crumb=document.getElementById("crumb");let cityObj=RNX_REGION_DATA.find(x=>x.slug===city)||null;let district=rawDistrict;
if(city==="seoul"&&rawDistrict==="gwanak")district="관악구";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
if(!cityObj){renderCities()}else if(!district){renderDistricts()}else{renderRoom()}
function renderCities(){heroTitle.textContent="전국 지역정보";heroText.textContent="전국 17개 시·도에서 활동지역을 선택하세요.";content.innerHTML='<div class="title"><h2>시·도 선택</h2><p>원하는 지역을 선택하면 시·군·구 목록으로 이동합니다.</p></div><div class="grid">'+RNX_REGION_DATA.map(x=>'<a class="card" href="?city='+x.slug+'"><b>'+esc(x.name)+'</b><small>'+x.districts.length+'개 지역 보기</small></a>').join("")+'</div>'}
function renderDistricts(){heroTitle.textContent=cityObj.name+" 지역정보";heroText.textContent="활동 중인 시·군·구를 선택하세요.";crumb.innerHTML='<a href="./">홈</a><span>›</span><a href="region.html">지역정보</a><span>›</span><span>'+esc(cityObj.name)+'</span>';content.innerHTML='<div class="title"><h2>시·군·구 선택</h2><p>'+esc(cityObj.name)+'의 지역 라이더방입니다.</p></div><div class="grid">'+cityObj.districts.map(d=>'<a class="card" href="?city='+cityObj.slug+'&district='+encodeURIComponent(d)+'"><b>'+esc(d)+'</b><small>라이더방 열기</small></a>').join("")+'</div>'}
function renderRoom(){const regionName=(cityObj?cityObj.name:"")+" "+district;heroTitle.textContent=district+" 라이더방";heroText.textContent="콜정보, 도로·교통, 사고·공사, 정비와 지역 이야기를 공유합니다.";crumb.innerHTML='<a href="./">홈</a><span>›</span><a href="region.html">지역정보</a><span>›</span><a href="?city='+cityObj.slug+'">'+esc(cityObj.name)+'</a><span>›</span><span>'+esc(district)+'</span>';content.innerHTML='<div class="panel"><div class="title"><h2>'+esc(district)+' 라이더방</h2><p>'+esc(regionName)+' 현장 중심 커뮤니티</p></div><div class="cats">'+["💬 자유수다","📣 오늘 콜정보","🛵 배달·퀵 상황","🚦 도로·교통","🚨 사고·공사","🔧 정비·센터","🪖 장비추천","☕ 맛집·휴식","❓ 지역 Q&A"].map(x=>'<div class="cat">'+x+'</div>').join("")+'</div><div class="member" id="member"></div><div class="compose" id="compose"><select id="category"><option>자유수다</option><option>오늘 콜정보</option><option>배달·퀵 상황</option><option>도로·교통</option><option>사고·공사</option><option>정비·센터</option><option>장비추천</option><option>맛집·휴식</option><option>지역 Q&A</option></select><input id="title" placeholder="제목"><textarea id="body" placeholder="지역 라이더들에게 공유할 내용"></textarea><button id="submit">등록</button></div><div class="posts" id="posts"></div></div>';const u=RNX.currentUser(),member=document.getElementById("member"),compose=document.getElementById("compose");if(u){member.innerHTML='<span><b>'+esc(u.nickname)+'</b>님으로 참여 중</span><a href="my.html">내 방</a>';compose.classList.add("on")}else member.innerHTML='<span>글쓰기·댓글은 로그인 후 사용할 수 있습니다.</span><a href="auth.html">로그인</a>';document.getElementById("submit").onclick=()=>{try{RNX.addPost({region:regionName,category:category.value,title:title.value,body:body.value});title.value="";body.value="";renderPosts(regionName)}catch(e){alert(e.message)}};renderPosts(regionName)}
function renderPosts(regionName){const list=document.getElementById("posts");if(!list)return;const arr=RNX.posts(regionName);if(!arr.length){list.innerHTML='<div class="empty">아직 등록된 글이 없습니다.</div>';return}list.innerHTML="";arr.forEach(p=>{const a=RNX.userById(p.authorId),el=document.createElement("article");el.className="post";const comments=(p.comments||[]).map(c=>{const cu=RNX.userById(c.authorId);return '<div class="comment"><b>'+esc(cu?cu.nickname:"회원")+'</b> · '+esc(c.body)+'</div>'}).join("");el.innerHTML='<h3>'+esc(p.title)+'</h3><div class="meta">'+esc(p.category)+' · '+esc(a?a.nickname:"회원")+' · '+RNX.fmt(p.createdAt)+'</div><div class="body">'+esc(p.body)+'</div><div class="tools"><button class="toggle">댓글 '+(p.comments||[]).length+'</button> <button class="report">신고</button></div><div class="comments">'+comments+'<div class="commentForm"><input placeholder="댓글"><button>등록</button></div></div>';el.querySelector(".toggle").onclick=()=>el.querySelector(".comments").classList.toggle("on");const inp=el.querySelector(".commentForm input");el.querySelector(".commentForm button").onclick=()=>{try{RNX.addComment(p.id,inp.value);renderPosts(regionName)}catch(e){location.href="auth.html"}};el.querySelector(".report").onclick=()=>{if(!RNX.currentUser()){location.href="auth.html";return}const r=prompt("신고 사유","기타");if(r!==null){try{RNX.report(p.id,r);alert("신고가 접수되었습니다.")}catch(e){alert(e.message)}}};list.appendChild(el)})}
</script></body></html>
