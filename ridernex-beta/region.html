<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>지역정보 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc;--shadow:0 10px 28px rgba(31,60,99,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:1000px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.home{font-size:13px;font-weight:900;color:#276fbe}.wrap{max-width:1000px;margin:auto;padding:18px 14px 40px}.crumb{display:flex;gap:6px;font-size:12px;color:#7a8798;margin-bottom:10px}.crumb a{color:#276fbe;font-weight:900}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#1658bb,#1978e7 60%,#2ba6d7);color:#fff}.hero h1{margin:0;font-size:28px}.hero p{margin:8px 0 0;font-size:14px;color:#eaf4ff;line-height:1.5}.section{margin-top:18px}.title h2{margin:0;font-size:20px}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.card b{font-size:14px}.card small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.cat{display:block;border:1px solid #e8edf3;border-radius:12px;padding:11px;font-size:12px;background:#fff;transition:.15s}.cat:active{transform:scale(.985)}.cat.on{border-color:#9fc5fb;background:#eef5ff;color:#0d67c9;font-weight:900}.member{margin-top:12px;padding:11px;border-radius:12px;background:#f7f9fc;border:1px solid #e7ebf1;display:flex;justify-content:space-between;gap:10px;font-size:12px}.member a{color:#fff;background:#0d73e6;padding:7px 9px;border-radius:9px;font-weight:900}.compose{display:none;margin-top:10px;padding:12px;border:1px solid #e5eaf1;border-radius:13px;gap:8px}.compose.on{display:grid}.compose select,.compose input,.compose textarea{padding:9px;border:1px solid #dbe3ec;border-radius:9px;font:inherit;font-size:12px}.compose textarea{min-height:80px}.compose button{justify-self:end;border:0;background:#0d73e6;color:#fff;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:900;white-space:nowrap;min-width:72px}.posts{display:grid;gap:8px;margin-top:12px}.post{border:1px solid #e5eaf1;border-radius:13px;padding:12px}.post h3{margin:0;font-size:14px}.meta{margin-top:4px;color:#8b95a5;font-size:11px}.body{margin-top:7px;color:#526174;font-size:12px;line-height:1.5}.tools{margin-top:8px}.tools button{border:1px solid #dfe6ee;background:#fff;padding:6px 8px;border-radius:8px;font-size:11px;white-space:nowrap}.comments{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #edf1f5}.comments.on{display:grid;gap:6px}.comment{background:#f7f9fc;padding:7px;border-radius:8px;font-size:11px}.commentForm{display:flex;gap:6px}.commentForm input{flex:1;padding:7px;border:1px solid #dce3ec;border-radius:8px;font-size:11px}.empty{padding:20px;border:1px dashed #cbd5e1;border-radius:13px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:24px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 지역정보</a><a class="home" href="./">홈으로</a></div></header>
<main class="wrap"><div class="crumb" id="crumb"><a href="./">홈</a><span>›</span><span>지역정보</span></div><section class="hero"><h1 id="heroTitle">전국 지역정보</h1><p id="heroText">시·도를 선택하고 시·군·구 지역방으로 들어갑니다.</p></section><section class="section" id="content"></section></main>
<script src="beta-store.js"></script>
<script src="region-data.js"></script>
<script src="supabase-adapter.js"></script>
<script>
const params=new URLSearchParams(location.search),city=params.get("city"),rawDistrict=params.get("district"),filterCategory=params.get("category")||"";
const content=document.getElementById("content"),crumb=document.getElementById("crumb");
let cityObj=RNX_REGION_DATA.find(x=>x.slug===city)||null,district=rawDistrict,remote=false;
if(city==="seoul"&&rawDistrict==="gwanak")district="관악구";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(v){return RNX.fmt(v)}
function regionName(){return (cityObj?cityObj.name:"")+" "+district}

(async()=>{
  const state=await RNXRemote.init();
  remote=state.enabled;
  if(!cityObj)renderCities();
  else if(!district)renderDistricts();
  else await renderRoom();
})();

function renderCities(){
  heroTitle.textContent="전국 지역정보";
  heroText.textContent="전국 17개 시·도에서 활동지역을 선택하세요.";
  content.innerHTML='<div class="title"><h2>시·도 선택</h2><p>원하는 지역을 선택하면 시·군·구 목록으로 이동합니다.</p></div><div class="grid">'+RNX_REGION_DATA.map(x=>'<a class="card" href="?city='+x.slug+'"><b>'+esc(x.name)+'</b><small>'+x.districts.length+'개 지역 보기</small></a>').join("")+'</div>';
}
function renderDistricts(){
  heroTitle.textContent=cityObj.name+" 지역정보";
  heroText.textContent="활동 중인 시·군·구를 선택하세요.";
  crumb.innerHTML='<a href="./">홈</a><span>›</span><a href="region.html">지역정보</a><span>›</span><span>'+esc(cityObj.name)+'</span>';
  content.innerHTML='<div class="title"><h2>시·군·구 선택</h2><p>'+esc(cityObj.name)+'의 지역 라이더방입니다.</p></div><div class="grid">'+cityObj.districts.map(d=>'<a class="card" href="?city='+cityObj.slug+'&district='+encodeURIComponent(d)+'"><b>'+esc(d)+'</b><small>라이더방 열기</small></a>').join("")+'</div>';
}
async function renderRoom(){
  const rName=regionName();
  const categories=["자유수다","오늘 콜정보","배달·퀵 상황","도로·교통","사고·공사","정비·센터","장비추천","맛집·휴식","지역 Q&A"];
  const icons={"자유수다":"💬","오늘 콜정보":"📣","배달·퀵 상황":"🛵","도로·교통":"🚦","사고·공사":"🚨","정비·센터":"🔧","장비추천":"🪖","맛집·휴식":"☕","지역 Q&A":"❓"};
  heroTitle.textContent=district+" 라이더방";
  heroText.textContent="콜정보, 도로·교통, 사고·공사, 정비와 지역 이야기를 공유합니다.";
  crumb.innerHTML='<a href="./">홈</a><span>›</span><a href="region.html">지역정보</a><span>›</span><a href="?city='+cityObj.slug+'">'+esc(cityObj.name)+'</a><span>›</span><span>'+esc(district)+'</span>';
  const base='?city='+encodeURIComponent(cityObj.slug)+'&district='+encodeURIComponent(district);
  const categoryCards='<a class="cat '+(!filterCategory?'on':'')+'" href="'+base+'">📚 전체</a>'+categories.map(x=>'<a class="cat '+(filterCategory===x?'on':'')+'" href="'+base+'&category='+encodeURIComponent(x)+'">'+icons[x]+' '+esc(x)+'</a>').join("");
  content.innerHTML='<div class="panel"><div class="title"><h2>'+esc(district)+' 라이더방</h2><p>'+esc(rName)+' 현장 중심 커뮤니티'+(filterCategory?' · '+esc(filterCategory):'')+'</p></div><div class="cats">'+categoryCards+'</div><div class="member" id="member"></div><div class="compose" id="compose"><select id="category">'+categories.map(x=>'<option '+(filterCategory===x?'selected':'')+'>'+x+'</option>').join("")+'</select><input id="title" placeholder="제목"><textarea id="body" placeholder="지역 라이더들에게 공유할 내용"></textarea><button id="submit">등록</button></div><div class="posts" id="posts"></div></div>';
  const member=document.getElementById("member"),compose=document.getElementById("compose");
  const remoteUser=remote?RNXRemote.state.user:null,remoteProfile=remote?RNXRemote.state.profile:null,localUser=!remote?RNX.currentUser():null;
  const signed=remote?!!remoteUser:!!localUser;
  const nickname=remote?(remoteProfile?.nickname||remoteUser?.email||"회원"):(localUser?.nickname||"회원");
  if(signed){member.innerHTML='<span><b>'+esc(nickname)+'</b>님으로 참여 중'+(remote?' · 공용 DB':' · 테스트 저장')+'</span><a href="my.html">내 방</a>';compose.classList.add("on")}
  else member.innerHTML='<span>글쓰기·댓글은 로그인 후 사용할 수 있습니다.</span><a href="auth.html">로그인</a>';
  const category=document.getElementById("category"),title=document.getElementById("title"),body=document.getElementById("body"),submit=document.getElementById("submit");
  submit.onclick=async()=>{
    try{
      if(remote)await RNXRemote.addPost({region:rName,category:category.value,title:title.value,body:body.value});
      else RNX.addPost({region:rName,category:category.value,title:title.value,body:body.value});
      title.value="";body.value="";await renderPosts(rName,filterCategory);
    }catch(e){if(String(e.message||"").includes("로그인"))location.href="auth.html";else alert(e.message||"등록 실패")}
  };
  await renderPosts(rName,filterCategory);
}
async function renderPosts(rName,categoryFilter=""){
  const list=document.getElementById("posts");if(!list)return;
  let arr=[];
  try{
    arr=remote?await RNXRemote.getRegionPosts(rName,categoryFilter):RNX.posts(rName).filter(p=>!categoryFilter||p.category===categoryFilter);
  }catch(e){list.innerHTML='<div class="empty">게시글을 불러오지 못했습니다.<br>'+esc(e.message||"")+'</div>';return}
  if(!arr.length){list.innerHTML='<div class="empty">'+(categoryFilter?'이 카테고리에 등록된 글이 없습니다.':'아직 등록된 글이 없습니다.')+'</div>';return}
  list.innerHTML="";
  for(const p of arr){
    const el=document.createElement("article");el.className="post";
    let comments=[],authorName="회원",created=p.created_at||p.createdAt;
    if(remote){
      authorName=p.profiles?.nickname||"회원";
      try{comments=await RNXRemote.getComments(p.id)}catch{}
    }else{
      const a=RNX.userById(p.authorId);authorName=a?.nickname||"회원";comments=p.comments||[];
    }
    const commentsHtml=comments.map(c=>{
      const name=remote?(c.profiles?.nickname||"회원"):(RNX.userById(c.authorId)?.nickname||"회원");
      return '<div class="comment"><b>'+esc(name)+'</b> · '+esc(c.body)+'</div>';
    }).join("");
    el.innerHTML='<h3>'+esc(p.title)+'</h3><div class="meta">'+esc(p.category)+' · '+esc(authorName)+' · '+fmt(created)+'</div><div class="body">'+esc(p.body)+'</div><div class="tools"><button class="toggle">댓글 '+comments.length+'</button> <button class="report">신고</button></div><div class="comments">'+commentsHtml+'<div class="commentForm"><input placeholder="댓글"><button>등록</button></div></div>';
    el.querySelector(".toggle").onclick=()=>el.querySelector(".comments").classList.toggle("on");
    const inp=el.querySelector(".commentForm input");
    el.querySelector(".commentForm button").onclick=async()=>{
      try{
        if(remote)await RNXRemote.addComment(p.id,inp.value);
        else RNX.addComment(p.id,inp.value);
        await renderPosts(rName,categoryFilter);
      }catch(e){location.href="auth.html"}
    };
    el.querySelector(".report").onclick=async()=>{
      const signed=remote?!!RNXRemote.state.user:!!RNX.currentUser();
      if(!signed){location.href="auth.html";return}
      const reason=prompt("신고 사유","기타");if(reason===null)return;
      try{
        if(remote)await RNXRemote.report({targetType:"post",targetId:p.id,reason});
        else RNX.report(p.id,reason);
        alert("신고가 접수되었습니다.");
      }catch(e){alert(e.message||"신고 실패")}
    };
    list.appendChild(el);
  }
}
</script></body></html>
