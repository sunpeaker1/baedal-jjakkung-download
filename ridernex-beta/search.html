<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>통합검색 · RiderNex 베타</title>
<style>
:root{--blue:#0d73e6;--ink:#172033;--muted:#6f7c90;--line:#e3e8ef;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:900px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.brand span{color:var(--blue)}.topin a:last-child{font-size:13px;font-weight:900;color:#276fbe}
.wrap{max-width:900px;margin:auto;padding:20px 14px 40px}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#1658bb,#1978e7 60%,#2ba6d7);color:#fff}.hero h1{margin:0;font-size:28px}.hero p{margin:8px 0 0;color:#eaf4ff;font-size:14px;line-height:1.5}
.search{display:flex;margin-top:14px;border:2px solid var(--blue);border-radius:14px;overflow:hidden;background:#fff}.search input{flex:1;border:0;outline:0;padding:13px 14px;font-size:14px}.search button{border:0;background:var(--blue);color:#fff;padding:0 18px;font-weight:1000;white-space:nowrap;min-width:84px;flex:0 0 auto}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900;white-space:nowrap}.tabs button.on{background:#eaf3ff;border-color:#a9c8f3;color:var(--blue)}
.summary{margin-top:14px;color:var(--muted);font-size:13px}.results{display:grid;gap:9px;margin-top:10px}.result{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.badge{display:inline-block;padding:5px 7px;border-radius:999px;background:#edf5ff;color:#176bc5;font-size:11px;font-weight:900}.result h3{margin:8px 0 0;font-size:14px}.meta{margin-top:4px;color:#8792a3;font-size:11px}.body{margin-top:8px;color:#526174;font-size:12px;line-height:1.5}.empty{margin-top:14px;padding:24px;border:1px dashed #cad5e3;border-radius:16px;background:#fff;text-align:center;color:var(--muted);font-size:13px}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./">Rider<span>Nex</span> 검색</a><a href="./">홈으로</a></div></header>
<main class="wrap"><section class="hero"><h1>라이더넥스 통합검색</h1><p>지역글, 장터, 업체정보, 구인·구직과 라이더도구를 한 번에 찾습니다.</p></section>
<form class="search" id="search"><input id="q" placeholder="지역, 게시글, 업체, 장터, 도구 검색"><button>검색</button></form>
<div class="tabs" id="tabs"></div><div class="summary" id="summary"></div><div class="results" id="results"></div></main>
<script src="beta-store.js"></script><script src="supabase-adapter.js"></script><script>
const p=new URLSearchParams(location.search),q=document.getElementById("q");q.value=p.get("q")||"";let filter="전체",remote=false,allResults=[];
const types=["전체","지역글","장터","업체","구인·구직","정비·장비","관심방","라이더도구","서비스"];
const tabs=document.getElementById("tabs"),summary=document.getElementById("summary"),results=document.getElementById("results"),search=document.getElementById("search");
types.forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.className=t==="전체"?"on":"";b.onclick=()=>{filter=t;tabs.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()};tabs.appendChild(b)});
search.onsubmit=e=>{e.preventDefault();const v=q.value.trim();location.href="search.html?q="+encodeURIComponent(v)};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function staticResults(term){
  const items=[
    {type:"라이더도구",title:"라이더짝꿍",meta:"수입·운행·내비 대표 앱",body:"라이더짝꿍 기존 홈",href:"../rider-jjakkung-home.html"},
    {type:"라이더도구",title:"배달내비",meta:"라이더 전용 주행안내",body:"배달내비",href:"../delivery-navi.html"},
    {type:"라이더도구",title:"퀵짝꿍",meta:"퀵 업무 지원",body:"퀵짝꿍",href:"../quick.html"},
    {type:"라이더도구",title:"바이크체크",meta:"정비·주행관리",body:"바이크체크",href:"../bikecheck.html"},
    {type:"라이더도구",title:"오늘얼마",meta:"수입 관리",body:"오늘얼마",href:"../oneul-eolma.html"},
    {type:"서비스",title:"지역정보",meta:"전국 지역방",body:"지역 현장정보와 지역 라이더방",href:"region.html"},
    {type:"서비스",title:"라이더 지도",meta:"지역·업체·현장 지도",body:"라이더 지도",href:"map.html"},
    {type:"서비스",title:"정비·장비",meta:"정비 경험·소모품·라이더 장비",body:"정비와 장비 정보를 한곳에서",href:"care.html"},
    {type:"서비스",title:"관심방",meta:"바이크·플랫폼·장비 관심사",body:"PCX NMAX 배민 쿠팡이츠 카카오퀵 장비 초보 라이더",href:"interests.html"}
  ],t=term.toLowerCase();
  return items.filter(x=>(x.title+" "+x.meta+" "+x.body).toLowerCase().includes(t));
}
(async()=>{const state=await RNXRemote.init();remote=state.enabled;await load()})();
async function load(){
  const term=q.value.trim();
  if(!term){allResults=[];render();return}
  try{allResults=remote?await RNXRemote.searchAll(term):RNX.searchAll(term)}catch{allResults=[]}
  allResults=allResults.concat(staticResults(term));
  render();
}
function render(){
  const term=q.value.trim(),arr=allResults.filter(x=>filter==="전체"||x.type===filter);
  summary.textContent=term?'"'+term+'" 검색결과 '+arr.length+'건':"검색어를 입력하세요.";
  if(!term){results.innerHTML='<div class="empty">찾고 싶은 지역, 장터 물품, 업체, 일자리 또는 라이더도구를 검색하세요.</div>';return}
  if(!arr.length){results.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}
  results.innerHTML=arr.map(x=>'<a class="result" href="'+esc(x.href)+'"><span class="badge">'+esc(x.type)+'</span><h3>'+esc(x.title)+'</h3><div class="meta">'+esc(x.meta||"")+(x.createdAt?' · '+RNX.fmt(x.createdAt):'')+'</div><div class="body">'+esc(x.body||"")+'</div></a>').join("")
}
</script></body></html>
